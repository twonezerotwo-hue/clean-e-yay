openapi: 3.1.0
info:
  title: Clean E-yAy API
  version: 2.0.0
  description: |
    Sözleşme-önce API. Pydantic ve TypeScript tipleri buradan üretilir.
    `make codegen` ile yenilenir. Manuel düzenleme yok.
servers:
  - url: http://127.0.0.1:9000
    description: Local dev
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/system/health:
    get:
      operationId: getSystemHealth
      summary: O1 — 7/24 worker reliability özeti (worker/provider/dqs/snapshot/halt)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"

  /api/v1/regime-report/current:
    get:
      operationId: getRegimeReportCurrent
      summary: En güncel rejim raporu
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegimeReport"

  /api/v1/dashboard/state:
    get:
      operationId: getDashboardState
      summary: Canonical dashboard state — risk gate + agent votes + module health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardState"

  /api/v1/dashboard/agent-quorum-matrix:
    get:
      operationId: getAgentQuorumMatrix
      summary: Agent persona quorum per-symbol across the trade universe (not pinned to BTCUSD)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentQuorumMatrixResponse"

  /api/v1/liquidity/rotation:
    get:
      operationId: getLiquidityRotation
      summary: Küresel Likidite Rotasyon — fixed basket flow score (1D/7D/30D), observation-only
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiquidityRotation"

  /api/v1/ai-report/current:
    get:
      operationId: getAIReportCurrent
      summary: En güncel AI analist raporu (LLM özetli)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIReport"

  /api/v1/chat:
    post:
      operationId: postChat
      summary: v2.6 — state-grounded soru-cevap (LLM karar vermez, sadece açıklar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /api/v1/chat/stream:
    post:
      operationId: postChatStream
      summary: v2.8 — state-grounded chat, SSE token akışı (LLM karar vermez)
      description: >
        POST gövdesi ChatRequest; yanıt text/event-stream. Event sözleşmesi:
        `status` {stage: context|grounded|llm, source} aşama geçişleri;
        `meta` {snapshot_id, evidence_used, refused:false} delta'lardan önce;
        `delta` {text} yalnızca gerçek LLM stream parçası;
        `done` tam ChatResponse — HER akışın son eventi ve OTORİTE: istemci
        biriken delta metnini done.answer ile değiştirir (bulgu-düşürme/kesinti
        düzeltmeleri böyle taşınır); `error` {message} beklenmedik hata.
        Guard reddi, deterministik komutlar (manuel emir/pozisyon op) ve
        cache-hit'te delta akıtılmaz, tek `done` gelir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE akışı (event/data çerçeveleri; done=ChatResponse)
          content:
            text/event-stream:
              schema:
                type: string

  /api/voice/speak:
    post:
      operationId: postVoiceSpeak
      summary: High quality TTS proxy (provider key never reaches frontend)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceSpeakRequest"
      responses:
        "200":
          description: MPEG audio
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Empty text
        "503":
          description: TTS provider not configured or unavailable

  /api/v1/paper-trading/state:
    get:
      operationId: getPaperTradingState
      summary: Açık pozisyonlar + son tick PnL (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperTradingState"

  /api/v1/paper-trading/tick:
    post:
      operationId: postPaperTradingTick
      summary: Manuel tick (yan etkili — açma/kapatma yapabilir)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickResult"

  /api/v1/paper-trading/positions/{position_id}/close:
    post:
      operationId: postPaperTradingPositionClose
      summary: Owner — tek açık pozisyonu manuel kapat (MANUAL exit; paper-safe, broker yok)
      parameters:
        - name: position_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Kapatıldı (realized trade)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  position_id: { type: string }
                  symbol: { type: string }
                  side: { type: string }
                  exit_price: { type: number }
                  pnl_usd: { type: number }
        "404":
          description: position_not_found
        "409":
          description: Fiyat yok / price-insane — kapatma yapılmadı (DATA_POLICY)

  /api/v1/paper-trading/tickets:
    get:
      operationId: getTradeTickets
      summary: Aktif Trade Ticket'lar (broker'a manuel girmeden tek-bakış kart)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeTicketList"

  /api/v1/notifications:
    get:
      operationId: getNotifications
      summary: Bildirim listesi (en yeni önce; observer — karar vermez)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: unread_only
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /api/v1/notifications/{notif_id}/ack:
    post:
      operationId: ackNotification
      summary: Bildirimi okundu işaretle
      parameters:
        - in: path
          name: notif_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  id: { type: string }

  /api/v1/notifications/ack-all:
    post:
      operationId: ackAllNotifications
      summary: Tüm okunmamış bildirimleri okundu işaretle
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  marked: { type: integer }

  /api/v1/paper-trading/manual-ready:
    get:
      operationId: getPaperTradingManualReady
      summary: P2 — owner-approval kuyruğu (DEFENSIVE/CRISIS adayları; read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualReadyQueue"

  /api/v1/paper-trading/manual-ready/{manual_id}/approve:
    post:
      operationId: postPaperTradingManualReadyApprove
      summary: P2 — owner onayı; paper pozisyon açar (price/state/duplicate guard'ları geçerli)
      parameters:
        - name: manual_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK (status=opened|no_price|blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualReadyActionResult"
        "404":
          description: manual_id kuyrukta yok (not_found)

  /api/v1/paper-trading/manual-ready/{manual_id}/reject:
    post:
      operationId: postPaperTradingManualReadyReject
      summary: P2 — owner reddi; kuyruktan çıkarır + rejection kaydeder (re-queue silent block)
      parameters:
        - name: manual_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualReadyActionResult"
        "404":
          description: manual_id kuyrukta yok (not_found)

  /api/v1/paper-trading/manual-ready/{manual_id}/dismiss:
    post:
      operationId: postPaperTradingManualReadyDismiss
      summary: P2 — kuyruktan çıkar (rejection kaydetmez; sonraki tick'te yeniden düşebilir)
      parameters:
        - name: manual_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualReadyActionResult"
        "404":
          description: manual_id kuyrukta yok (not_found)

  /api/v1/learning/summary:
    get:
      operationId: getLearningSummary
      summary: Walk-forward + kalibrasyon özeti
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSummary"

  /api/v1/risk/correlation:
    get:
      operationId: getRiskCorrelation
      summary: G4 — korelasyon matrisi + aynı yönlü cluster exposure (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrelationState"

  /api/v1/risk/halts:
    get:
      operationId: getRiskHalts
      summary: G5 — aktif halt + timeline + daily-loss/max-DD gauge metrikleri
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaltsState"

  /api/v1/risk/halts/reset:
    post:
      operationId: postRiskHaltsReset
      summary: G5 — owner reset (tek manuel çıkış; otomatik reset yok)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaltResetResult"

  /api/v1/decision/matrix:
    get:
      operationId: getDecisionMatrix
      summary: T2 — (symbol × timeframe) karar matrisi; hücre rozetleri backend'de
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionMatrix"

  /api/v1/cockpit/brief:
    get:
      operationId: getCockpitBrief
      summary: UX1 — Agent Operating Cockpit özeti (AgentBrief + DecisionTrace; read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CockpitBrief"

  /api/v1/data/snapshot:
    get:
      operationId: getDataSnapshot
      summary: Anlık piyasa snapshot'ı + provider durumu + DQS (read-only, mock fallback yok)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSnapshot"

  /api/v1/learning/calibration:
    get:
      operationId: getLearningCalibration
      summary: G6 — Platt kalibrasyon parametreleri + reliability bins (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationState"

  /api/v1/learning/tf-weights:
    get:
      operationId: getLearningTfWeights
      summary: Step 8 — per-TF calibration + trust-gated tf_weights proposal (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TfWeightsReport"

  /api/v1/learning/promotion-criteria:
    get:
      operationId: getPromotionCriteria
      summary: F5-2 — champion/challenger terfi kriteri (read-only; terfi otomatik DEĞİL)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: promotion_criteria.evaluate() sonucu (additive).
                additionalProperties: true

  /api/v1/learning/activation-watchdog:
    get:
      operationId: getActivationWatchdog
      summary: F5-3 — owner-flag aktivasyon izleyicisi (read-only; YALNIZ-ÖNERİ, oto-kapatma yok)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: activation_watchdog.report() sonucu (additive).
                additionalProperties: true

  /api/v1/learning/partial-tp-shadow:
    get:
      operationId: getPartialTpShadow
      summary: F4-3 — partial-TP shadow-vs-actual özeti (read-only; aktivasyon kanıtı)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: partial_tp_shadow.summary() sonucu (additive).
                additionalProperties: true

  /api/v1/learning/calibration/retrain:
    post:
      operationId: postLearningCalibrationRetrain
      summary: G6 — kalibrasyonu yeniden fit et (verified+predicted trade'lerden)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: calibration_trainer.train() sonucu (additive).

  /api/v1/learning/mistakes:
    get:
      operationId: getLearningMistakes
      summary: G3 — mistake memory kayıtları + per-fingerprint verdict (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MistakesState"

  /api/v1/learning/historical-edge:
    get:
      operationId: getHistoricalEdge
      summary: Fuzzy-similarity historical edge — read-only; mistake_memory exact-match gate'inin tamamlayıcısı
      parameters:
        - name: fingerprint
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: similarity_weights + HistoricalEdgeResult (additive) — sample_count, win_rate, avg_pnl, edge_confidence.

  /api/v1/learning/conflict-gate-validation:
    get:
      operationId: getConflictGateValidation
      summary: Faz 9A — Conflict Gate retrospektif doğrulama raporu (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConflictGateValidationReport" }

  /api/v1/learning/conflict-gate-status:
    get:
      operationId: getConflictGateStatus
      summary: Faz 8 — Conflict Gate config durumu (enabled + profil bazlı mod tablosu, read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConflictGateStatus" }

  /api/v1/agent-mode/config:
    get:
      operationId: getAgentModeConfig
      summary: Faz 3 — Agent Mode etkin config (thresholds defaults + owner override)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentModeConfigView" }
    post:
      operationId: postAgentModeConfig
      summary: Faz 3 — Agent Mode owner override'larını kaydet (ana config'e dokunmaz)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentModeConfigUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentModeConfigView" }

  /api/v1/agent-mode/config/reset:
    post:
      operationId: postAgentModeConfigReset
      summary: Faz 3 — Agent Mode override'larını sıfırla (saf config'e dön)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentModeConfigView" }

  /api/v1/learning/missed-opportunities:
    get:
      operationId: getMissedOpportunities
      summary: Faz 2 — Missed Opportunity özeti (açılmayan valid setup'ların TTL sonucu, read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissedOpportunitiesView" }

  /api/v1/learning/calibration-jumps:
    get:
      operationId: getCalibrationJumps
      summary: Calibration jump ledger — Platt şişmesi (raw→fitted) + faktörler + guardrail durumu (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalibrationJumpsView" }

  /api/v1/learning/tf-targets:
    get:
      operationId: getLearningTfTargets
      summary: Faz B — TF-bazlı SL/TP geometri öğrenmesinin durumu (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TfTargetsView" }

  /api/v1/learning/tf-targets/approve:
    post:
      operationId: postLearningTfTargetsApprove
      summary: Bekleyen TF-target önerisini onayla (current'a yazılır)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TfTargetsActionResult" }

  /api/v1/learning/tf-targets/reject:
    post:
      operationId: postLearningTfTargetsReject
      summary: Bekleyen TF-target önerisini reddet (değişiklik uygulanmaz)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TfTargetsActionResult" }

  /api/v1/learning/tf-targets/retrain:
    post:
      operationId: postLearningTfTargetsRetrain
      summary: TF-target trainer'ı manuel tetikle (sample-gate bypass; gözlem için)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/learning/exit-forensics:
    get:
      operationId: getLearningExitForensics
      summary: Çıkış Otopsisi — kötü çıkışın nerede/kaça olduğu (AUTO kohort, read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExitForensicsView" }

  /api/v1/learning/discovery:
    get:
      operationId: getLearningDiscovery
      summary: Keşif tarayıcısı — hipotetik "açılırdı" adayları + gölge karnesi (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryView" }

  /api/v1/learning/subsignal-scorecard:
    get:
      operationId: getLearningSubsignalScorecard
      summary: D5 — Sinyal karnesi (sinyal × TF ileri-getiri, v2 sert cetvel, read-only)
      responses:
        "200":
          description: OK (artifact yoksa status=NO_DATA)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/learning/rebalance/proposal:
    get:
      operationId: getLearningRebalanceProposal
      summary: G2 — bekleyen rebalance önerisi + geçmiş (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceState"

  /api/v1/paper-trading/reset:
    post:
      operationId: postPaperTradingReset
      summary: Paper state'i sıfırla (yalnızca paper; broker yok)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Reset sonucu (additive).

  /api/v1/paper-trading/maintenance/archive:
    post:
      operationId: postPaperTradingMaintenanceArchive
      summary: Owner-admin — paper state'i arşivle (read-only kopya; mutasyon yok; paper-safe)
      parameters:
        - name: reason
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK (MaintenanceResult; paper_safe/no_execution; additive)
          content:
            application/json:
              schema:
                type: object
                description: Maintenance sonucu (archive; additive).

  /api/v1/paper-trading/maintenance/repair:
    post:
      operationId: postPaperTradingMaintenanceRepair
      summary: Owner-admin — paper state tutarsızlıklarını onar (dry_run varsayılan true)
      parameters:
        - name: dry_run
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: OK (MaintenanceResult; dry_run ise yazım yok; non-dry-run önce arşivler)
          content:
            application/json:
              schema:
                type: object
                description: Maintenance sonucu (repair; additive).

  /api/v1/paper-trading/maintenance/reset:
    post:
      operationId: postPaperTradingMaintenanceReset
      summary: Owner-admin — paper hesabı sıfırla (önce arşivler; learning/decision log korunur)
      parameters:
        - name: reason
          in: query
          required: false
          schema: { type: string }
        - name: preserve_learning
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: OK (MaintenanceResult; arşiv + temiz initial state; broker yok)
          content:
            application/json:
              schema:
                type: object
                description: Maintenance sonucu (reset; additive).

  /api/v1/replay/status:
    get:
      operationId: getReplayStatus
      summary: R1 — replay store durumu (active/empty); kayıtlı snapshot sayısı + en son id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayStatus"

  /api/v1/replay/backtest:
    get:
      operationId: getReplayBacktest
      summary: R2 — deterministik rolling backtest (stored snapshot serisi; live refetch yok)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayBacktest"

  /api/v1/replay/backtest/{run_id}:
    get:
      operationId: getReplayBacktestRun
      summary: R2 — belirli run_id için backtest; store değiştiyse 404 (sahte run saklanmaz)
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayBacktest"
        "404":
          description: run_id mevcut store ile eşleşmiyor (not_found)

  /api/v1/replay/strategy-backtest:
    get:
      operationId: getReplayStrategyBacktest
      summary: Pilot — live technical-bias engine replayed over real historical OHLCV bars (single symbol)
      parameters:
        - name: symbol
          in: query
          required: false
          schema: { type: string, default: BTCUSD }
        - name: timeframe
          in: query
          required: false
