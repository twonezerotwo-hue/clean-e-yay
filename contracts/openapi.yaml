    GovernorProposalsView:
      type: object
      required: [pending, pending_count, history]
      properties:
        proposal_types:
          type: array
          items: { $ref: "#/components/schemas/GovernorProposalType" }
        pending:
          type: array
          items: { $ref: "#/components/schemas/GovernorProposal" }
        pending_count: { type: integer }
        pending_by_type:
          type: object
          additionalProperties: { type: integer }
        history:
          type: array
          items: { $ref: "#/components/schemas/GovernorProposal" }
        note: { type: string }

    GovernorTaskPriority:
      type: string
      enum: [P0, P1, P2, P3, P4]

    GovernorTaskStatus:
      type: string
      enum: [PENDING, DONE, FAILED]

    GovernorTaskType:
      type: string
      enum: [DATA_QUALITY_REVIEW, RISK_REVIEW, MISSED_OPPORTUNITY_REVIEW, TRADE_REVIEW, MODE_REVIEW, SYSTEM_HEALTH_REVIEW]

    GovernorTask:
      type: object
      required: [task_id, task_type, priority, status, can_change_policy]
      properties:
        task_id: { type: string }
        task_type: { $ref: "#/components/schemas/GovernorTaskType" }
        priority: { $ref: "#/components/schemas/GovernorTaskPriority" }
        subject: { type: string }
        params: { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/GovernorTaskStatus" }
        auto_execute: { type: boolean }
        can_change_policy: { type: boolean }
        source: { type: string }
        created_at: { type: string }
        executed_at: { type: string, nullable: true }
        result: { type: object, additionalProperties: true, nullable: true }

    GovernorTasksView:
      type: object
      required: [queue, queue_count, history]
      properties:
        task_types:
          type: object
          additionalProperties: { type: string }
        queue:
          type: array
          items: { $ref: "#/components/schemas/GovernorTask" }
        queue_count: { type: integer }
        queue_by_priority:
          type: object
          additionalProperties: { type: integer }
        history:
          type: array
          items: { $ref: "#/components/schemas/GovernorTask" }
        note: { type: string }

    GovernorReportSection:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        data: {}
        error: { type: string }

    GovernorReport:
      type: object
      required: [generated_at, paper_safe, no_execution]
      properties:
        generated_at: { type: string }
        paper_safe: { type: boolean }
        no_execution: { type: boolean }
        learned: { $ref: "#/components/schemas/GovernorReportSection" }
        found_missed_opportunities: { $ref: "#/components/schemas/GovernorReportSection" }
        tasks: { $ref: "#/components/schemas/GovernorReportSection" }
        proposals: { $ref: "#/components/schemas/GovernorReportSection" }
        other_pending_approvals: { $ref: "#/components/schemas/GovernorReportSection" }
        data_trust: { $ref: "#/components/schemas/GovernorReportSection" }
        worker_last_run: { $ref: "#/components/schemas/GovernorReportSection" }
        note: { type: string }
