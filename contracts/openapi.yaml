components:
  schemas:
    Health:
      type: object
      required: [status, version, uptime_sec]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        uptime_sec: { type: number }

    WorkerHealth:
      type: object
      description: O1 — tek worker (tick/learning) sağlık görünümü.
      required: [worker_name, status, stale]
      properties:
        worker_name: { type: string }
        # RUNNING/OK/DEGRADED/FAILED/NO_DATA (stored) + STALE/UNKNOWN (türetilen).
        # Enum bağlamıyorum: STALE/UNKNOWN runtime'da türetiliyor.
        status: { type: string }
        stale: { type: boolean }
        run_id: { type: string, nullable: true }
        started_at: { type: string, nullable: true }
        completed_at: { type: string, nullable: true }
        last_success_at: { type: string, nullable: true }
        last_error: { type: string, nullable: true }
        age_seconds: { type: number, nullable: true }
        cycle_count: { type: integer }
        snapshots_written: { type: integer }
        decisions_generated: { type: integer }
        paper_actions: { type: integer }
        learning_outcomes_seen: { type: integer }
        proposals_generated: { type: integer }
        duration_ms: { type: integer, nullable: true }
        # F2-1 — MTM salt-gözlem (tick_worker yazar; RiskGate girdisi DEĞİL).
        # null = ölçüm yok (FAILED cycle / legacy heartbeat / learning_worker).
        unrealized_pnl_usd: { type: number, nullable: true }
        mtm_equity_usd: { type: number, nullable: true }

    SystemHealth:
      type: object
      description: O1 — 7/24 sistem sağlığı özeti (network-free; owner warning'leri).
      required: [api_status, paper_safe, no_execution, workers]
      properties:
        api_status: { type: string }
        paper_safe: { type: boolean }
        no_execution: { type: boolean }
        workers:
          type: object
          properties:
            tick_worker: { $ref: "#/components/schemas/WorkerHealth" }
            learning_worker: { $ref: "#/components/schemas/WorkerHealth" }
        stale_workers:
          type: array
          items: { type: string }
        last_successful_tick: { type: string, nullable: true }
        last_learning_run: { type: string, nullable: true }
        provider_summary: { type: object }
        dqs_status: { type: string, nullable: true }
        snapshot_store_status: { type: object }
        risk_halt_status: { type: object }
        warnings:
          type: array
          items: { type: string }

    SnapshotMeta:
      type: object
      required: [snapshot_id, generated_at]
      properties:
        snapshot_id: { type: string }
        generated_at: { type: string, format: date-time }
        dqs_score: { type: number, minimum: 0, maximum: 100 }
        fallback_used: { type: boolean }

    RegimeLayer:
      type: object
      required: [name, score, direction]
      properties:
        name: { type: string }
        score: { type: number }
        direction: { type: string, enum: [bullish, bearish, neutral] }
        evidence:
          type: array
          items: { type: string }

    AssetSignal:
      type: object
      required: [symbol, score, direction, status]
      properties:
        symbol: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        direction: { type: string, enum: [bullish, bearish, neutral] }
        status: { type: string, enum: [BLOCKING, PENDING, CONFIRMED] }
        confluence_aligned: { type: boolean }
        dominant_module: { type: string }
        win_rate_signal: { type: string, enum: [AVOID, NORMAL, BOOST, INSUFFICIENT_DATA] }
        kind:
          type: string
          nullable: true
          description: Asset class (risk/commodity/hedge/safe/cash/macro) for risk-on/off bucketing.

    RegimeReport:
      type: object
      required: [meta, regime_label, layers, assets]
      properties:
        meta: { $ref: "#/components/schemas/SnapshotMeta" }
        regime_label: { type: string, enum: [OFFENSIVE, NEUTRAL, DEFENSIVE, CRISIS] }
        # F2-3 — veri yetersizliğinden düşen katman adları (drop_unavailable_layers
        # flag'i kapalıyken her zaman boş liste).
        dropped_layers:
          type: array
          items: { type: string }
        layers:
          type: array
          items: { $ref: "#/components/schemas/RegimeLayer" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/AssetSignal" }
        headlines:
          type: array
          items: { $ref: "#/components/schemas/NewsHeadline" }
        catalysts:
          type: array
          items: { $ref: "#/components/schemas/Catalyst" }
        event_risk: { $ref: "#/components/schemas/EventRiskView" }

    NewsHeadline:
      type: object
      required: [id, source, ts, title]
      properties:
        id: { type: string }
        source: { type: string }
        region: { type: string }
        ts: { type: string, format: date-time }
        title: { type: string }
        title_tr: { type: string }
        sentiment: { type: string, enum: [bullish, bearish, neutral] }
        # M1 — v2 (çekim-eki normalize) sınıflandırıcı okuması; salt-gözlem.
        # Flag (news.sentiment_v2) kapalıyken karar zinciri `sentiment`(v1) okur.
        sentiment_v2: { type: string, enum: [bullish, bearish, neutral], nullable: true }
        asset_impact:
          type: object
          additionalProperties: { type: number }
        # P0 — haber yalnızca bağlam; sembol etkisi varsa actionable, yoksa context-only.
        actionable: { type: boolean }
        freshness: { type: string, enum: [FRESH, RECENT, STALE] }

    Catalyst:
      type: object
      required: [id, ts, title]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        title: { type: string }
        importance: { type: string, enum: [low, medium, high, critical] }
        region: { type: string }
        hours_until: { type: number }
        days_until: { type: integer }
        # P0 — bu olayın tetiklediği event riski seviyesi (yalnızca kısıtlayıcı).
        event_level: { type: string, enum: [NONE, WATCH, NO_POSITION_INCREASE] }

    EventRiskView:
      type: object
      description: >
        P0 — Olay riski özeti. YALNIZCA kısıtlayıcı: yaklaşan doğrulanmış yüksek
        etkili takvim olayı yeni pozisyon açılışını kısar. RiskGate/DQS/KillSwitch/
        halt gate'lerini bypass etmez, size artırmaz.
      required: [level, restrictive]
      properties:
        level: { type: string, enum: [NONE, WATCH, NO_POSITION_INCREASE] }
        action: { type: string, enum: [WATCH, NO_POSITION_INCREASE], nullable: true }
        reason: { type: string }
        evidence:
          type: array
          items: { type: string }
        restrictive: { type: boolean }
        triggers:
          type: array
          items: { $ref: "#/components/schemas/EventRiskTrigger" }

    EventRiskTrigger:
      type: object
      required: [id, title, importance, level]
      properties:
        id: { type: string }
        title: { type: string }
        importance: { type: string }
        hours_until: { type: number }
        days_until: { type: integer, nullable: true }
        level: { type: string, enum: [WATCH, NO_POSITION_INCREASE] }

    RiskGate:
      type: object
      required: [action, reason]
      properties:
        action: { type: string, enum: [HOLD, WATCH, HEDGE_INCREASE, NO_POSITION_INCREASE, RISK_REDUCE, KILL_SWITCH] }
        reason: { type: string }
        evidence:
          type: array
          items: { type: string }

    AgentVote:
      type: object
      required: [persona, direction, confidence]
      properties:
        persona: { type: string, enum: [analyst, risk_officer, macro_strategist] }
        direction: { type: string, enum: [bullish, bearish, neutral] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        narrative: { type: string }

    ModuleHealth:
      type: object
      additionalProperties:
        type: object
        properties:
          status: { type: string, enum: [ok, degraded, down] }
          last_success_at: { type: string, format: date-time }
          notes: { type: string }

    DashboardState:
      type: object
      required: [meta, risk_gate, agent_votes, module_health]
      properties:
        meta: { $ref: "#/components/schemas/SnapshotMeta" }
        risk_gate: { $ref: "#/components/schemas/RiskGate" }
        agent_votes:
          type: array
          items: { $ref: "#/components/schemas/AgentVote" }
        quorum_reached: { type: boolean }
        module_health: { $ref: "#/components/schemas/ModuleHealth" }
        warnings:
          type: array
          items: { type: string }

    AIReport:
      type: object
      required: [meta, verdict, narrative]
      properties:
        meta: { $ref: "#/components/schemas/SnapshotMeta" }
        verdict: { type: string, enum: [bullish, bearish, neutral, no_trade] }
        narrative: { type: string }
        key_signals:
          type: array
          items: { type: string }
        token_usage:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }
            cached: { type: boolean }
        # v2.6 additive — persona katmanı (narrative-only; decision path'e yazmaz)
        no_actionable_decision: { type: boolean }
        timeframe_summary: { $ref: "#/components/schemas/TimeframeSummary" }
        personas:
          type: array
          items: { $ref: "#/components/schemas/PersonaSection" }
        llm: { $ref: "#/components/schemas/LLMMeta" }

    PersonaSection:
      type: object
      description: >
        v2.6 — persona bölümü. evidence_used HER ZAMAN backend'de
        deterministik doldurulur (LLM kanıt uyduramaz). source=fallback →
        LLM'siz deterministik narrative.
      required: [persona, title, summary]
      properties:
        persona: { type: string, enum: [analyst, risk_officer, macro_strategist] }
        title: { type: string }
        summary: { type: string }
        concerns:
          type: array
          items: { type: string }
        evidence_used:
          type: array
          items: { type: string }
        missing_data:
          type: array
          items: { type: string }
        actionability: { type: string }
        what_would_change_my_mind: { type: string }
        source: { type: string, enum: [llm, fallback] }
        model: { type: string, nullable: true }

    TimeframeSummary:
      type: object
      description: v2.6 — DecisionMatrix'in rapor özeti (TF farkları, candidate vs final, blocked_by, paper_action).
      properties:
        suspended: { type: boolean }
        lines:
          type: array
          items: { type: string }
        candidate_vs_final_diffs:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              timeframe: { $ref: "#/components/schemas/Timeframe" }
              candidate: { type: string }
              final: { type: string }
              blocked_by:
                type: array
                items: { type: string }
              reason: { type: string }
        blocked_by_reasons:
          type: array
          items: { type: string }
        paper_actions:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              timeframe: { $ref: "#/components/schemas/Timeframe" }
              paper_action: { type: string }

    LLMMeta:
      type: object
      description: v2.6 — LLM çağrı meta'sı; source=fallback → deterministik narrative.
      properties:
        mode: { type: string, enum: ["off", mock, groq, openrouter, ollama] }
        model: { type: string, nullable: true }
        source: { type: string, enum: [llm, fallback, guard] }
        fallback_reason: { type: string, nullable: true }
        cached: { type: boolean }
        tokens_used: { type: integer }

    ChatTurn:
      type: object
      description: Tek konuşma turu — yalnızca LLM anlatım bağlamı içindir.
      required: [role, text]
      properties:
        role: { type: string, enum: [user, agent] }
        text: { type: string, minLength: 1, maxLength: 500 }

    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        history:
          type: array
          description: >
            Son konuşma turları (eskiden yeniye). Yalnızca LLM anlatım bağlamı
            içindir; karar zincirine girmez. Client son ~6-8 turu gönderir.
          maxItems: 12
          items: { $ref: "#/components/schemas/ChatTurn" }

    VoiceSpeakRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        voice: { type: string, nullable: true, maxLength: 128 }
        provider: { type: string, nullable: true, maxLength: 32 }

    ChatResponse:
      type: object
      description: >
        v2.6 — state-grounded yanıt. refused=true → injection/bypass guard
        devrede. evidence_used yanıtın dayandığı state kanıtları.
      required: [answer, refused]
      properties:
        answer: { type: string }
        refused: { type: boolean }
        evidence_used:
          type: array
          items: { type: string }
        snapshot_id: { type: string }
        llm: { $ref: "#/components/schemas/LLMMeta" }
        mode:
          type: object
          description: Provenance mode bloğu (LIVE/MOCK_MODE/SIMULATION/INSUFFICIENT_DATA).
          additionalProperties: true

    Position:
      type: object
      required: [id, symbol, side, entry_price, size_usd, opened_at]
      properties:
        id: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        entry_price: { type: number }
        current_price: { type: number }
        size_usd: { type: number }
        unrealized_pnl_usd: { type: number }
        sl: { type: number }
        tp: { type: number }
        opened_at: { type: string, format: date-time }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        valid_until:
          type: string
          format: date-time
          nullable: true
          description: T2 — TF time-stop; dolunca TIME_STOP_EXIT. null → time-stop yok.
        time_stop_status:
          type: string
          enum: [NONE, ACTIVE, EXPIRED]
          description: >
            UX1 — time-stop durumu backend'de; negatif geri sayım YOK. EXPIRED →
            exit pending (fiyatla TIME_STOP_EXIT'te kapanır).
        time_stop_seconds_remaining:
          type: integer
          nullable: true
          description: UX1 — kalan saniye (≥0; EXPIRED'da 0, time-stop yoksa null).
        lifecycle_status:
          $ref: "#/components/schemas/PaperLifecycleStatus"
        time_stop_expired:
          type: boolean
          description: P1 — valid_until geçti mi (fiyat gelince TIME_STOP_EXIT).
        pending_exit_reason:
          type: string
          nullable: true
          description: P1 — exit neden bekliyor (fiyat yoksa); ör. TIME_STOP_EXIT / KILL_SWITCH_EXIT.
        open_reason:
          type: string
          nullable: true
          description: P1 — learning handoff; açılış karar gerekçesi.
        snapshot_id:
          type: string
          nullable: true
          description: P1 — learning handoff; açılışın kaynak snapshot'ı.
        scale_in:
          type: boolean
          description: P1 — explicit scale-in pozisyonu (default false).

    PaperLifecycleStatus:
      type: string
      description: >
        P1 — paper pozisyon yaşam döngüsü durumu. Canlı: OPEN /
        EXPIRED_PENDING_PRICE / EXIT_PENDING / ERROR_STATE. Terminal (Trade):
        CLOSED / FORCE_CLOSED.
      enum: [OPEN, EXIT_PENDING, EXPIRED_PENDING_PRICE, CLOSED, FORCE_CLOSED, ERROR_STATE]

    PaperAuditEvent:
      type: object
      description: >
        P1 — paper lifecycle audit olayı (append-only JSONL'den). action bilinen
        değerlerden biri (OPEN_ATTEMPT / OPENED / OPEN_BLOCKED / SIZE_REDUCED /
        TIME_STOP_EXPIRED / EXIT_PENDING / CLOSED / KILL_SWITCH_EXIT /
        RISK_REDUCE_EXIT / STATE_REPAIRED / ERROR). Alanlar additive.
      required: [event_id, timestamp, action]
      additionalProperties: true
      properties:
        event_id: { type: string }
        timestamp: { type: string, format: date-time }
        action: { type: string }
        position_id: { type: string }
        symbol: { type: string }
        timeframe: { type: string }
        reason: { type: string }
        price_used: { type: number }
        size: { type: number }
        pnl: { type: number }
        snapshot_id: { type: string }

    Trade:
      type: object
      required: [id, symbol, side, entry_price, exit_price, pnl_usd, opened_at, closed_at, close_reason]
      properties:
        id: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        entry_price: { type: number }
        exit_price: { type: number }
        pnl_usd: { type: number }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
        close_reason:
          type: string
          enum: [SL_HIT, TP_HIT, SIGNAL_REVERSAL, RISK_REDUCE, MANUAL, TIME_STOP_EXIT, TRAILING_STOP_EXIT, KILL_SWITCH_EXIT]
        fingerprint: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        lifecycle_status:
          $ref: "#/components/schemas/PaperLifecycleStatus"
        open_reason:
          type: string
          nullable: true
          description: P1 — learning handoff; açılış gerekçesi.
        snapshot_id:
          type: string
          nullable: true
          description: P1 — learning handoff; kaynak snapshot.

    PaperTradingState:
      type: object
      required: [equity_usd, realized_pnl_usd, open_positions, recent_trades]
      properties:
        equity_usd: { type: number }
        realized_pnl_usd: { type: number }
        unrealized_pnl_usd: { type: number }
        max_drawdown_pct: { type: number }
        sharpe_30d: { type: number }
        open_positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        recent_trades:
          type: array
          items: { $ref: "#/components/schemas/Trade" }
        new_entries_disabled:
          type: boolean
          description: P1 — aktif halt (KILL_SWITCH/RISK_REDUCE) varsa yeni giriş kapalı.
        duplicate_warning:
          type: array
          description: P1 — aynı (symbol, timeframe) birden fazla açık (normalde boş).
          items:
            type: object
            additionalProperties: true
        audit_summary:
          type: object
          additionalProperties: true
          description: P1 — son audit penceresi özeti (action sayıları).
        recent_audit_events:
          type: array
          items: { $ref: "#/components/schemas/PaperAuditEvent" }
        manual_ready_count:
          type: integer
          description: P2 — owner onayı bekleyen aday sayısı (DEFENSIVE/CRISIS).
        position_rechecks:
          type: array
          description: |
            UX-A14 — tick yan ürünü, her açık pozisyon için fresh karara karşı
            verdict (OK/WATCH/REDUCE/EXIT_RECOMMEND). Read-only öneri; otomatik
            kapatma YOK. Çıkış yine SL/TP veya manuel close üzerinden.
          items: { $ref: "#/components/schemas/PositionRecheck" }
        last_recheck_at:
          type: string
          nullable: true
          description: Son recheck zamanı (ISO-8601 UTC). null → henüz tick atılmadı.

    TradeTicket:
      type: object
      required: [id, symbol, side, timeframe, status, expires_at, ttl_seconds]
      description: |
        Broker'a manuel girmeden önce tek-bakış kart payload'ı. Karar
        zincirinin gözlemleyicisi — yeni karar üretmez. Şema iki katmanlı:
        `summary` (stable field, agent + UI), `technical_detail` (collapsed
        derin veri), `display` (önceden hazırlanmış Türkçe stringler).
      properties:
        id: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        timeframe: { type: string }
        status: { type: string, enum: [active, insufficient_rr, invalid] }
        expires_at: { type: string }
        ttl_seconds: { type: integer }
        summary:
          $ref: "#/components/schemas/TradeTicketSummary"
        technical_detail:
          type: object
          additionalProperties: true
          description: 7 bölüm derin veri (konsensüs/piyasa/geçmiş/güvenlik/sizing/kalibrasyon/audit)
        display:
          $ref: "#/components/schemas/TradeTicketDisplay"

    TradeTicketSummary:
      type: object
      description: Trade ticket stable field'ları (agent + UI direkt kullanır).
      properties:
        entry_price: { type: number }
        stop_loss: { type: number }
        take_profit: { type: number }
        rr_ratio: { type: number }
        rr_source: { type: string }
        size_usd: { type: number }
        size_pct_equity: { type: number }
        risk_usd: { type: number }
        risk_pct_equity: { type: number }
        confidence_calibrated: { type: number }
        confidence_raw: { type: number }
        confidence_label: { type: string }
        consensus_score: { type: number }
        consensus_direction: { type: string, enum: [bullish, bearish, neutral] }
        atr: { type: number }

    TradeTicketDisplay:
      type: object
      description: Önceden hazırlanmış Türkçe display stringleri (UI + agent).
      properties:
        title: { type: string }
        expiry_text: { type: string }
        rr_text: { type: string }
        rr_note: { type: string }
        why_bullets:
          type: array
          items: { type: string }
        safety_lines:
          type: array
          items:
            type: object
            properties:
              level: { type: string, enum: [ok, warn, error] }
              text: { type: string }
        confidence_text: { type: string }

    TradeTicketList:
      type: object
      required: [tickets, total]
      properties:
        tickets:
          type: array
          items: { $ref: "#/components/schemas/TradeTicket" }
        total: { type: integer }
        last_built_at: { type: string, nullable: true }

    Notification:
      type: object
      required: [id, ts, type, priority, title, body_short]
      properties:
        id: { type: string }
        ts: { type: string }
        type:
          type: string
          enum:
            - ticket_created
            - ticket_expiring
            - ticket_expired
            - ticket_blocked
            - recheck_exit_recommend
            - recheck_reduce
            - risk_gate_changed
            - risk_kill_switch
            - catalyst_imminent
            - dqs_dropped
            - position_near_sl
            - position_near_tp
        priority:
          type: string
          enum: [critical, high, medium, low]
        title: { type: string }
        body_short: { type: string }
        body_long: { type: string }
        ticket_id: { type: string, nullable: true }
        position_id: { type: string, nullable: true }
        actions:
          type: array
          items:
            type: object
            additionalProperties: true
        ack: { type: boolean }

    NotificationList:
      type: object
      required: [notifications, unread_count, total]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unread_count: { type: integer }
        total: { type: integer }

    PositionRecheck:
      type: object
      required: [position_id, symbol, timeframe, side, verdict, reason, pnl_pct, checked_at]
      properties:
        position_id: { type: string }
        symbol: { type: string }
        timeframe: { type: string }
        side: { type: string, enum: [long, short] }
        verdict: { type: string, enum: [OK, WATCH, REDUCE, EXIT_RECOMMEND] }
        reason: { type: string }
        fresh_action:
          type: string
          nullable: true
          enum: [open_long, open_short, hold, blocked, null]
        fresh_direction:
          type: string
          nullable: true
          enum: [bullish, bearish, neutral, null]
        fresh_confidence: { type: number, nullable: true }
        pnl_pct: { type: number }
        checked_at: { type: string }

    ManualReadyTrade:
      type: object
      required: [id, symbol, timeframe, side, requested_at, size_multiplier]
      properties:
        id: { type: string }
        symbol: { type: string }
        timeframe: { type: string }
        side: { type: string, description: "long | short" }
        requested_at: { type: string }
        size_multiplier: { type: number }
        requested_price: { type: number }
        reason: { type: string }
        fingerprint: { type: string }
        snapshot_id: { type: string }
        rejected_at: { type: string }

    ManualReadyQueue:
      type: object
      required: [manual_ready, rejected_count]
      properties:
        manual_ready:
          type: array
          items: { $ref: "#/components/schemas/ManualReadyTrade" }
        rejected_count:
          type: integer
          description: Silent-block aktif olan reddedilmiş sinyal sayısı.

    ManualReadyActionResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: "opened | not_found | no_price | blocked | dismissed | rejected"
        position_id: { type: string }
        price: { type: number }
        reason: { type: string }

    TickResult:
      type: object
      required: [tick_at, signals_processed, actions]
      properties:
        tick_at: { type: string, format: date-time }
        signals_processed: { type: integer }
        actions:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              action: { type: string, enum: [open, close, hold, blocked] }
              reason: { type: string }

    CalibrationBin:
      type: object
      required: [bin_lo, bin_hi, predicted, observed, count]
      properties:
        bin_lo: { type: number }
        bin_hi: { type: number }
        predicted: { type: number }
        observed: { type: number }
        count: { type: integer }

    LearningSummary:
      type: object
      required: [total_trades, win_rate, calibration]
      properties:
        total_trades: { type: integer }
        min_sample:
          type: integer
          description: UX1 — Sharpe/win-rate'in istatistiksel anlam eşiği.
        sample_sufficient:
          type: boolean
          description: UX1 — total_trades ≥ min_sample (false → INSUFFICIENT SAMPLE).
        win_rate: { type: number }
        sharpe: { type: number }
        sortino: { type: number }
        max_dd_pct: { type: number }
        walk_forward:
          type: object
          properties:
            train_window: { type: integer }
            test_window: { type: integer }
            test_sharpe: { type: number }
            test_win_rate: { type: number }
        calibration:
          type: array
          items: { $ref: "#/components/schemas/CalibrationBin" }
        module_skew:
          type: object
          additionalProperties: { type: number }
        weights_version: { type: string }
        # L1 — timeframe-aware outcome breakdown'lar (additive). Her bucket:
        # {trades, wins, losses, win_rate, total_pnl, avg_pnl, verified}.
        outcomes_total: { type: integer }
        verified_outcomes: { type: integer }
        by_timeframe:
          type: object
          additionalProperties: { $ref: "#/components/schemas/OutcomeBucket" }
        by_symbol:
          type: object
          additionalProperties: { $ref: "#/components/schemas/OutcomeBucket" }
        by_regime:
          type: object
          additionalProperties: { $ref: "#/components/schemas/OutcomeBucket" }
        by_dominant_module:
          type: object
          additionalProperties: { $ref: "#/components/schemas/OutcomeBucket" }
        by_close_reason:
          type: object
          additionalProperties: { $ref: "#/components/schemas/OutcomeBucket" }
        worker_last_run:
          description: L1 — son learning worker koşusu metadata'sı (yoksa null).
          anyOf:
            - $ref: "#/components/schemas/LearningWorkerRun"
            - type: "null"
        proposal_status:
          type: string
          description: L1 — rebalance proposal durumu (PENDING/APPROVED/REJECTED/NONE).
        cohorts:
          description: >
            Denetim 2026-07-03 additive — AUTO/MANUAL/EXCLUDED kohort ayrımı
            (packages/learning/cohorts.py). Mevcut alanlar tüm outcome'ları
            saymaya devam eder; auto sistemin gerçek performansı buradadır.
          $ref: "#/components/schemas/LearningCohorts"

    LearningCohorts:
      type: object
      required: [auto, manual, excluded]
      properties:
        auto:
          allOf:
            - $ref: "#/components/schemas/CohortStats"
            - type: object
              properties:
                by_timeframe:
                  type: object
                  additionalProperties: { $ref: "#/components/schemas/CohortStats" }
                manual_closed:
                  type: integer
                  description: Auto açılıp owner'ın kapattığı işlem sayısı.
        manual: { $ref: "#/components/schemas/CohortStats" }
        excluded: { $ref: "#/components/schemas/CohortStats" }

    CohortStats:
      type: object
      description: >
        Kohort başına outcome özeti (win_rate paydası kararlı işlemler —
        breakeven ayrı sayılır; F1-2 deseniyle hizalı).
      required: [trades, wins, losses, breakeven, win_rate, total_pnl]
      properties:
        trades: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        breakeven: { type: integer }
        win_rate: { type: number }
        total_pnl: { type: number }

    OutcomeBucket:
      type: object
      description: >
        L1 — timeframe/symbol/regime/module/close_reason kırılımı başına outcome
        özeti (packages/learning/outcomes.py türetir; presentation-only).
      required: [trades, wins, losses, win_rate, total_pnl, avg_pnl, verified]
      properties:
        trades: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        win_rate: { type: number }
        total_pnl: { type: number }
        avg_pnl: { type: number }
        verified: { type: integer }

    LearningWorkerRun:
      type: object
      description: >
        L1 — son learning worker koşusunun metadata'sı (apps/learning_worker
        türetir). Karar üretmez; yalnızca koşu durumunu yüzeye taşır.
      required:
        [run_id, started_at, completed_at, status, outcomes_seen,
         proposals_generated, calibration_status, errors]
      properties:
        run_id: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        status: { type: string }
        skipped_reason: { type: string, nullable: true }
        outcomes_seen: { type: integer }
        proposals_generated: { type: integer }
        calibration_status: { type: string }
        errors:
          type: array
          items: { type: string }

    CorrelationEntry:
      type: object
      required: [symbol_a, symbol_b, rho, source, samples]
      properties:
        symbol_a: { type: string }
        symbol_b: { type: string }
        rho: { type: number }
        # F2-2: computed_price = gerçek 1d fiyat getirisinden (flag açıkken aktif)
        source: { type: string, enum: [computed_price, computed, baseline, neutral] }
        samples: { type: integer }
        # F2-2 salt-gözlem alanları — fiyat-rho flag kapalıyken de hesaplanır;
        # owner aktivasyon kanıtını (baseline/computed vs fiyat ayrışması) izler.
        rho_price: { type: number, nullable: true }
        price_samples: { type: integer }

    ClusterPosition:
      type: object
      description: >
        Risk — bir exposure cluster'ındaki tek açık paper pozisyon
        (packages/risk/correlation.py serileştirir; presentation-only).
      required: [id, symbol, side, size_usd]
      properties:
        id: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        size_usd: { type: number }

    ExposureCluster:
      type: object
      required: [symbols, positions, total_usd, cluster_pct, status]
      properties:
        symbols:
          type: array
          items: { type: string }
        positions:
          type: array
          items: { $ref: "#/components/schemas/ClusterPosition" }
        total_usd: { type: number }
        cluster_pct: { type: number }
        status: { type: string, enum: [OK, WARNING, BREACH] }

    CorrelationState:
      type: object
      required: [threshold, max_cluster_pct, symbols, matrix, clusters]
      properties:
        threshold: { type: number }
        max_cluster_pct: { type: number }
        window_days: { type: integer }
        min_overlap_days: { type: integer }
        # F2-2 — fiyat-getirisi korelasyon flag durumu + aktiflik eşiği
        price_returns_enabled: { type: boolean }
        price_min_overlap_days: { type: integer }
        symbols:
          type: array
          items: { type: string }
        matrix:
          type: array
          items: { $ref: "#/components/schemas/CorrelationEntry" }
        clusters:
          type: array
          items: { $ref: "#/components/schemas/ExposureCluster" }
        open_position_count: { type: integer }
        equity_usd: { type: number }
        insufficient_pairs:
          type: array
          items: { type: string }

    HaltEvent:
      type: object
      required: [id, type, level, started_at, reason, active]
      properties:
        id: { type: string }
        type: { type: string, enum: [DAILY_LOSS, MAX_DRAWDOWN] }
        level: { type: string, enum: [KILL_SWITCH, RISK_REDUCE] }
        started_at: { type: string, format: date-time }
        reason: { type: string }
        evidence:
          type: array
          items: { type: string }
        active: { type: boolean }
        cleared_at: { type: string, format: date-time, nullable: true }
        cleared_by: { type: string, nullable: true }

    HaltMetrics:
      type: object
      required: [equity_usd, daily_pnl_usd, daily_loss_limit_usd, daily_loss_ratio, drawdown_pct, max_drawdown_pct, drawdown_ratio]
      properties:
        equity_usd: { type: number }
        peak_equity_usd: { type: number }
        daily_pnl_usd: { type: number }
        daily_loss_limit_usd: { type: number }
        daily_loss_ratio: { type: number }
        drawdown_pct: { type: number }
        max_drawdown_pct: { type: number }
        drawdown_ratio: { type: number }

    HaltsState:
      type: object
      required: [halt_active, active, timeline, metrics]
      properties:
        halt_active: { type: boolean }
        active:
          type: array
          items: { $ref: "#/components/schemas/HaltEvent" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/HaltEvent" }
        metrics: { $ref: "#/components/schemas/HaltMetrics" }
        reset_hint: { type: string }

    HaltResetResult:
      type: object
      required: [cleared_count, cleared]
      properties:
        cleared_count: { type: integer }
        cleared:
          type: array
          items: { $ref: "#/components/schemas/HaltEvent" }

    Timeframe:
      type: string
      enum: ["15m", "1h", "4h", "1d", "1w"]
      default: "1d"
      description: T0 — sinyal uzayı (symbol, timeframe) ile anahtarlanır.

    CatalystEventType:
      type: string
      description: v2.7 D5 — kural tabanlı (deterministik) catalyst event tipi.
      enum:
        - geopolitical_deescalation
        - geopolitical_escalation
        - inflation_data
        - jobs_data
        - central_bank
        - oil_supply
        - oil_inventory
        - crypto_etf_flow
        - funding_oi_squeeze
        - earnings
        - exchange_outage
        - rumor_unverified
        - unknown

    CatalystActionability:
      type: string
      description: >
        v2.7 D5 — yalnızca kısıtlayıcı taksonomi. CONTEXT_ONLY karar zincirine
        girmez (yalnızca bağlam); WATCH uyarı; CAUTION size ×0.5;
        NO_POSITION_INCREASE yeni pozisyon açılışını durdurur.
      enum: [CONTEXT_ONLY, WATCH, CAUTION, NO_POSITION_INCREASE]

    CatalystImpact:
      type: object
      description: >
        v2.7 D5 — haber → catalyst half-life etkisi. Başlık kural tabanlı
        (deterministik, LLM YOK) bir event_type'a sınıflandırılır; event_type'a
        göre asset × timeframe etki haritası + yarı-ömür + valid_until +
        actionability üretilir. Karar zincirinde YALNIZCA kısıtlayıcı; rumor
        (verified=false) ve yarı-ömrü dolmuş catalyst yalnızca bağlamdır.
      required: [catalyst_id, event_type, actionability, verified]
      properties:
        catalyst_id: { type: string }
        headline_id: { type: string }
        event_type: { $ref: "#/components/schemas/CatalystEventType" }
        surprise_level: { type: number, minimum: -1, maximum: 1 }
        affected_assets:
          type: array
          items: { type: string }
        expected_half_life_minutes: { type: integer }
        affected_timeframes:
          type: array
          items: { $ref: "#/components/schemas/Timeframe" }
        timeframe_bias:
          type: object
          additionalProperties: { type: string, enum: [bullish, bearish, neutral] }
        valid_until: { type: string, format: date-time, nullable: true }
        decay_curve: { type: string, enum: [exponential, linear, step] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        actionability: { $ref: "#/components/schemas/CatalystActionability" }
        verified: { type: boolean }
        source: { type: string }
        region: { type: string, nullable: true }
        freshness: { type: string, enum: [FRESH, RECENT, STALE], nullable: true }
        ts: { type: string, format: date-time }
        evidence:
          type: array
          items: { type: string }

    CatalystSummary:
      type: object
      description: >
        v2.7 D5 — DecisionMatrix banner özeti (yalnızca verified + yarı-ömrü
        dolmamış + kısıtlayıcı catalyst'ler). Etkilenen hücreler ayrıca
        cell.blocked_by="catalyst_risk:*" taşır.
      required: [catalyst_id, event_type, actionability]
      properties:
        catalyst_id: { type: string }
        headline_id: { type: string }
        event_type: { $ref: "#/components/schemas/CatalystEventType" }
        actionability: { $ref: "#/components/schemas/CatalystActionability" }
        affected_assets:
          type: array
          items: { type: string }
        affected_timeframes:
          type: array
          items: { $ref: "#/components/schemas/Timeframe" }
        expected_half_life_minutes: { type: integer }
        valid_until: { type: string, format: date-time, nullable: true }
        surprise_level: { type: number }
        confidence: { type: number }
        verified: { type: boolean }

    TimeframeDecision:
      type: object
      description: >
        T2 — matrix hücresi. candidate_action = consensus niyeti
        (gate'lerden önce); action = final karar; blocked_by hangi kapının
        kestiğini söyler. Rozet (status) backend'de hesaplanır.
      required: [symbol, timeframe, action]
      properties:
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        action: { type: string, enum: [open_long, open_short, hold, blocked, watch] }
        candidate_action: { type: string, enum: [open_long, open_short, hold, blocked, watch] }
        score: { type: number }
        direction: { type: string, enum: [bullish, bearish, neutral] }
        confidence: { type: number }
        size_multiplier: { type: number }
        reason: { type: string }
        blocked_by:
          type: array
          items: { type: string }
        actionable: { type: boolean }
        status: { type: string, enum: [ACTIONABLE, NOT_ACTIONABLE, SUSPENDED] }
        paper_action: { type: string, enum: [open_long, open_short, none] }

    DecisionMatrix:
      type: object
      description: T2 — symbol × timeframe karar matrisi ViewModel.
      required: [generated_at, symbols, timeframes, cells]
      properties:
        generated_at: { type: string, format: date-time }
        symbols:
          type: array
          items: { type: string }
        timeframes:
          type: array
          items: { $ref: "#/components/schemas/Timeframe" }
        regime: { type: string }
        risk_gate:
          type: object
          properties:
            action: { type: string }
            reason: { type: string }
            evidence:
              type: array
              items: { type: string }
        dqs_status: { type: string, enum: [OK, DEGRADED, BLOCKED] }
        suspended:
          type: boolean
          description: KILL_SWITCH / RISK_REDUCE / NO_POSITION_INCREASE / DQS BLOCKED → tüm hücreler SUSPENDED.
        event_risk: { $ref: "#/components/schemas/EventRiskView" }
        derivatives:
          type: array
          description: >
            v2.7 D2 — per-symbol türev özeti (banner). Etkilenen hücreler
            cell.blocked_by="derivatives_risk:*" + reason ile zaten görünür.
          items: { $ref: "#/components/schemas/DerivativesSummary" }
        volatility:
          type: array
          description: >
            v2.7 D4 — per (symbol, timeframe) realized vol özeti (banner).
            Etkilenen hücreler cell.blocked_by="volatility_risk:*" ile görünür.
          items: { $ref: "#/components/schemas/VolatilitySummary" }
        catalysts:
          type: array
          description: >
            v2.7 D5 — verified + yarı-ömrü dolmamış catalyst özeti (banner).
            Etkilenen hücreler cell.blocked_by="catalyst_risk:*" ile görünür.
          items: { $ref: "#/components/schemas/CatalystSummary" }
        options:
          type: array
          description: >
            v2.7 D3 — per-symbol options özeti (banner; rejim ≠ NORMAL).
            Etkilenen hücreler cell.blocked_by="options_risk:*" ile görünür.
          items: { $ref: "#/components/schemas/OptionsSummary" }
        cells:
          type: array
          items: { $ref: "#/components/schemas/TimeframeDecision" }

    OHLCVBar:
      type: object
      description: T1 — tek mum; ts = bar açılış zamanı (UTC).
      required: [symbol, timeframe, ts, open, high, low, close]
      properties:
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        ts: { type: string, format: date-time }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number, nullable: true }
        source: { type: string, description: "resample edilen barlarda resampled:<base_tf>" }
        verified: { type: boolean }

    TechnicalSnapshotTF:
      type: object
      description: >
        T1 — gerçek OHLCV'den hesaplanan TF teknik özeti.
        Bar yetersiz/stale ise alanlar null + status DEGRADED.
      required: [timeframe, score, status]
      properties:
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        rsi: { type: number, nullable: true }
        macd:
          type: number
          nullable: true
          description: MACD(12/26/9) histogramı / close × 100 (normalize).
        atr: { type: number, nullable: true }
        ema_stack:
          type: string
          enum: [bullish, bearish, mixed]
          nullable: true
        score: { type: number }
        direction_score:
          type: number
          nullable: true
          description: >
            Top-down GATED direction (0–100, 50 = neutral) — momentum trigger gated
            by location/pattern/volume evidence. The decision engine (consensus
            `_touche`) consumes this; `score` is the legacy RSI+MACD fallback.
        location_gate:
          type: number
          nullable: true
          description: >
            Location gate multiplier (1.0 neutral, <1 penalty e.g. shorting into
            support, >1 confirm) — how the top-down location/pattern/volume read
            reshaped momentum conviction.
        location_evidence:
          type: array
          items: { type: string }
          description: >
            Compact 'where am I' evidence behind the gate (fib zone / confluence /
            pattern / reversal) — surfaced so the LLM can explain it in plain language.
        status: { type: string, enum: [OK, DEGRADED] }
        source: { type: string }
        bars_used: { type: integer }
        ts: { type: string, format: date-time }

    TechnicalTf:
      description: >
        FE-friendly alias of TechnicalSnapshotTF — the per-(symbol,timeframe)
        cell shape in DataSnapshot.technicals_by_tf. Same fields; named so the
        friendly api.ts type maps to the contract (no schema drift).
      allOf:
        - $ref: "#/components/schemas/TechnicalSnapshotTF"

    # ---------------- OPS — /data/snapshot yüzeyi (read-only) ----------------

    ProviderStatus:
      type: object
      required: [status, calls, fallbacks]
      properties:
        status: { type: string, enum: [ok, degraded, down, unknown] }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        calls: { type: integer }
        fallbacks: { type: integer }

    DqsBreakdown:
      type: object
      required: [score, status, freshness, completeness, drift, reconciliation, decision_usage, fallback_used, notes]
      properties:
        score: { type: number }
        status: { type: string, enum: [OK, DEGRADED, BLOCKED] }
        freshness: { type: number }
        completeness: { type: number }
        drift: { type: number }
        reconciliation: { type: number }
        decision_usage: { type: number }
        fallback_used: { type: boolean }
        notes:
          type: array
          items: { type: string }
        stress_score:
          type: number
          description: >
            Backend-derived presentation value (0-1) for Layer0HumanComputerModel's
            3D pulse animation speed — not a decision/risk input.

    LivePrice:
      type: object
      description: >
        Tek sembol fiyatı. Politika: runtime'da mock fallback yok — live
        başarısız → price=null, verified=false, status=DATA_UNAVAILABLE.
        (status=MOCK yalnızca test fixture modunda.)
      required: [symbol, ts, source, verified, status, fallback]
      properties:
        symbol: { type: string }
        price: { type: number, nullable: true }
        ts: { type: string, format: date-time }
        source: { type: string }
        verified: { type: boolean }
        status: { type: string, enum: [OK, DATA_UNAVAILABLE, MOCK] }
        error: { type: string, nullable: true }
        fallback: { type: boolean }

    ProvenanceMode:
      type: object
      description: Provenance damgası (LIVE / MOCK_MODE / SIMULATION / INSUFFICIENT_DATA).
      required: [mock_mode, mock_warning, test_mock, label]
      properties:
        live_data: { type: boolean }
        mock_mode: { type: boolean }
        mock_warning: { type: boolean }
        test_mock: { type: boolean }
        dqs_status: { type: string }
        label: { type: string }
        advisory: { type: string }

    DataSnapshot:
      type: object
      required: [meta, mode, prices, dqs, provider_status, warnings]
      properties:
        meta:
          type: object
          required: [snapshot_id, generated_at, symbols]
          properties:
            snapshot_id: { type: string }
            generated_at: { type: string, format: date-time }
            symbols:
              type: array
              items: { type: string }
        mode: { $ref: "#/components/schemas/ProvenanceMode" }
        prices:
          type: array
          items: { $ref: "#/components/schemas/LivePrice" }
        dqs: { $ref: "#/components/schemas/DqsBreakdown" }
        provider_status:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ProviderStatus" }
        warnings:
          type: array
          items: { type: string }
        technicals_by_tf:
          type: object
          description: symbol → timeframe → TechnicalSnapshotTF.
          additionalProperties:
            type: object
            additionalProperties: { $ref: "#/components/schemas/TechnicalSnapshotTF" }
        derivatives:
          type: object
          description: >
            v2.7 D2 — kripto türev zekâsı (symbol → DerivativesSnapshot).
            Yalnızca kripto sembolleri. squeeze_proxy GERÇEK liquidation değil.
          additionalProperties: { $ref: "#/components/schemas/DerivativesSnapshot" }
        volatility:
          type: object
          description: >
            v2.7 D4 — realized volatility / rejim (symbol → timeframe →
            VolatilitySnapshot). Mevcut OHLCV cache'inden; yalnızca kısıtlayıcı.
          additionalProperties:
            type: object
            additionalProperties: { $ref: "#/components/schemas/VolatilitySnapshot" }
        options:
          type: object
          description: >
            v2.7 D3 — options IV / skew / term structure (symbol →
            OptionsSnapshot). Yalnızca BTC/ETH; skew_25d proxy (gerçek greeks
            değil). Karar zincirinde yalnızca kısıtlayıcı.
          additionalProperties: { $ref: "#/components/schemas/OptionsSnapshot" }
        catalyst_impacts:
          type: array
          description: >
            v2.7 D5 — haber → catalyst half-life zekâsı (deterministik; LLM yok).
            Yalnızca verified + yarı-ömrü dolmamış impact karar zincirini kısıtlar.
          items: { $ref: "#/components/schemas/CatalystImpact" }

    # ---------------- v2.7 D2 — Crypto Derivatives Intelligence ----------------

    SqueezeLevel:
      type: string
      enum: [NONE, LOW, ELEVATED, HIGH]
      description: squeeze_proxy (0..100) seviyesi — PROXY, gerçek liquidation değil.

    FundingBias:
      type: string
      enum: [crowded_long, crowded_short, neutral]

    DerivativesSnapshot:
      type: object
      description: >
        v2.7 D2 — tek kripto sembol için türev zekâsı (funding / OI / squeeze
        proxy). Karar zincirinde YALNIZCA kısıtlayıcı (CAUTION / size-reduce /
        NO_POSITION_INCREASE) veya bağlam etkisi yapar — asla size artırmaz,
        asla RiskGate/DQS/halt'ı bypass etmez. squeeze_proxy GERÇEK liquidation
        API'si DEĞİLDİR (is_proxy=true). Live başarısız → status=DEGRADED, alanlar
        null (mock yok). Fixture verisi verified=false (karar zincirine girmez).
      required: [symbol, squeeze_proxy, squeeze_level, funding_bias, is_proxy, status, source, verified, dqs, ts]
      properties:
        symbol: { type: string }
        funding_rate: { type: number, nullable: true, description: "8s interval, ondalık (0.0001 = %0.01)" }
        funding_annualized: { type: number, nullable: true }
        open_interest_usd: { type: number, nullable: true }
        oi_change_pct: { type: number, nullable: true }
        price_momentum_pct: { type: number, nullable: true }
        volatility_pct: { type: number, nullable: true }
        squeeze_proxy: { type: number, description: "0..100 — PROXY, gerçek liq değil" }
        squeeze_level: { $ref: "#/components/schemas/SqueezeLevel" }
        funding_bias: { $ref: "#/components/schemas/FundingBias" }
        is_proxy: { type: boolean }
        status: { type: string, enum: [OK, DEGRADED] }
        source: { type: string }
        verified: { type: boolean }
        freshness: { type: string, enum: [FRESH, RECENT, STALE], nullable: true }
        dqs: { type: number }
        ts: { type: string, format: date-time }
        evidence:
          type: array
          items: { type: string }
        error: { type: string, nullable: true }

    DerivativesSummary:
      type: object
      description: >
        v2.7 D2 — matrix banner için per-symbol türev özeti (yalnızca status=OK).
        Etkilenen hücreler ayrıca cell.blocked_by="derivatives_risk:*" taşır.
      required: [symbol, squeeze_level, squeeze_proxy, funding_bias, is_proxy, status, verified]
      properties:
        symbol: { type: string }
        squeeze_level: { $ref: "#/components/schemas/SqueezeLevel" }
        squeeze_proxy: { type: number }
        funding_bias: { $ref: "#/components/schemas/FundingBias" }
        funding_rate: { type: number, nullable: true }
        is_proxy: { type: boolean }
        status: { type: string, enum: [OK, DEGRADED] }
        verified: { type: boolean }

    # ---------------- v2.7 D4 — Realized Volatility / Volatility Regime ----------------

    VolatilityRegime:
      type: string
      enum: [LOW, NORMAL, ELEVATED, EXTREME]
      description: realized vol z-skoru rejimi (yalnızca kısıtlayıcı bağlam).

    VolState:
      type: string
      enum: [normal, squeeze, expansion, shock]
      description: vol squeeze / expansion / shock bağlam bayrağı.

    VolatilitySnapshot:
      type: object
      description: >
        v2.7 D4 — tek (symbol, timeframe) için realized volatility + rejim
        zekâsı. Mevcut OHLCV cache'inden log-getiri tabanlı annualize realized
        vol, rejim ve squeeze/expansion/shock bağlamı. Karar zincirinde YALNIZCA
        kısıtlayıcı (CAUTION / size-reduce / NO_POSITION_INCREASE) veya bağlam
        etkisi yapar — asla size artırmaz, asla RiskGate/DQS/halt'ı bypass etmez.
        Bar yetersiz → status=DEGRADED, alanlar null (mock yok). Fixture barlar
        verified=false (karar zincirine girmez).
      required: [symbol, timeframe, regime, vol_state, status, source, verified, dqs, bars_used, ts]
      properties:
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        realized_vol: { type: number, nullable: true, description: "annualize medium-pencere realized vol (0.65 = %65)" }
        rv_short: { type: number, nullable: true }
        rv_medium: { type: number, nullable: true }
        rv_long: { type: number, nullable: true }
        vol_zscore: { type: number, nullable: true }
        regime: { $ref: "#/components/schemas/VolatilityRegime" }
        vol_state: { $ref: "#/components/schemas/VolState" }
        status: { type: string, enum: [OK, DEGRADED] }
        source: { type: string }
        verified: { type: boolean }
        freshness: { type: string, enum: [FRESH, RECENT, STALE], nullable: true }
        dqs: { type: number }
        bars_used: { type: integer }
        ts: { type: string, format: date-time }
        evidence:
          type: array
          items: { type: string }
        error: { type: string, nullable: true }

    VolatilitySummary:
      type: object
      description: >
        v2.7 D4 — matrix banner için per (symbol, timeframe) vol özeti (yalnızca
        status=OK + dikkat çeken hücreler). Etkilenen hücreler ayrıca
        cell.blocked_by="volatility_risk:*" taşır.
      required: [symbol, timeframe, regime, vol_state, status, verified]
      properties:
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        regime: { $ref: "#/components/schemas/VolatilityRegime" }
        vol_state: { $ref: "#/components/schemas/VolState" }
        realized_vol: { type: number, nullable: true }
        vol_zscore: { type: number, nullable: true }
        status: { type: string, enum: [OK, DEGRADED] }
        verified: { type: boolean }

    # ---------------- v2.7 D3 — Options IV / Skew / Term Structure ----------------

    OptionsRegime:
      type: string
      enum: [NORMAL, RICH_VOL, CHEAP_VOL, PUT_SKEW_STRESS, CALL_SKEW_EUPHORIA, TERM_STRESS]
      description: >
        Options stress rejimi (yalnızca kısıtlayıcı / bağlam). RICH_VOL/CHEAP_VOL
        IV-RV spread; PUT_SKEW_STRESS/CALL_SKEW_EUPHORIA 25Δ skew proxy;
        TERM_STRESS backwardation.

    OptionsStatus:
      type: string
      enum: [OK, DEGRADED, UNAVAILABLE]

    OptionsSnapshot:
      type: object
      description: >
        v2.7 D3 — tek kripto sembol için options (IV / skew / term structure)
        zekâsı. Deribit (veya fixture) chain'inden ATM IV, 25Δ skew proxy,
        put/call OI oranı, term structure ve realized-vs-implied spread. Karar
        zincirinde YALNIZCA kripto (BTC/ETH) + YALNIZCA kısıtlayıcı (CAUTION /
        size-reduce / NO_POSITION_INCREASE) veya bağlam — asla size artırmaz,
        asla RiskGate/DQS/halt'ı bypass etmez. skew_25d GERÇEK 25Δ greeks
        DEĞİLDİR (is_proxy=true; moneyness proxy). Live başarısız →
        status=DEGRADED/UNAVAILABLE, alanlar null (mock yok). Fixture verisi
        verified=false (karar zincirine girmez).
      required: [symbol, contracts_used, regime, is_proxy, status, source, verified, dqs, ts]
      properties:
        symbol: { type: string }
        underlying_price: { type: number, nullable: true }
        atm_iv: { type: number, nullable: true, description: "ön vade ATM IV (annualize ondalık; 0.55 = %55)" }
        realized_vol: { type: number, nullable: true }
        iv_rv_spread: { type: number, nullable: true, description: "atm_iv − realized_vol (pozitif = IV pahalı)" }
        skew_25d: { type: number, nullable: true, description: "risk reversal proxy = call_iv − put_iv (negatif = put skew)" }
        put_call_oi_ratio: { type: number, nullable: true }
        term_front_iv: { type: number, nullable: true }
        term_next_iv: { type: number, nullable: true }
        term_long_iv: { type: number, nullable: true }
        term_slope: { type: number, nullable: true, description: "term_long_iv − term_front_iv (negatif = backwardation)" }
        front_expiry: { type: string, nullable: true }
        next_expiry: { type: string, nullable: true }
        long_expiry: { type: string, nullable: true }
        contracts_used: { type: integer }
        regime: { $ref: "#/components/schemas/OptionsRegime" }
        is_proxy: { type: boolean }
        status: { $ref: "#/components/schemas/OptionsStatus" }
        source: { type: string }
        verified: { type: boolean }
        freshness: { type: string, enum: [FRESH, RECENT, STALE], nullable: true }
        dqs: { type: number }
        ts: { type: string, format: date-time }
        evidence:
          type: array
          items: { type: string }
        error: { type: string, nullable: true }

    OptionsSummary:
      type: object
      description: >
        v2.7 D3 — matrix banner için per-symbol options özeti (yalnızca status=OK
        + rejim ≠ NORMAL). Etkilenen hücreler ayrıca cell.blocked_by=
        "options_risk:*" taşır. skew_25d proxy (gerçek greeks değil).
      required: [symbol, regime, is_proxy, source, status, verified]
      properties:
        symbol: { type: string }
        regime: { $ref: "#/components/schemas/OptionsRegime" }
        atm_iv: { type: number, nullable: true }
        realized_vol: { type: number, nullable: true }
        iv_rv_spread: { type: number, nullable: true }
        skew_25d: { type: number, nullable: true }
        put_call_oi_ratio: { type: number, nullable: true }
        term_slope: { type: number, nullable: true }
        front_expiry: { type: string, nullable: true }
        next_expiry: { type: string, nullable: true }
        long_expiry: { type: string, nullable: true }
        is_proxy: { type: boolean }
        source: { type: string }
        freshness: { type: string, enum: [FRESH, RECENT, STALE], nullable: true }
        status: { $ref: "#/components/schemas/OptionsStatus" }
        verified: { type: boolean }

    # ---------------- OPS — /learning/* yüzeyi (read-only) ----------------

    TfCalibrationRow:
      type: object
      required: [timeframe, strategy, trades, win_rate, trust]
      properties:
        timeframe: { type: string }
        strategy: { type: string }
        trades: { type: integer }
        win_rate: { type: number }
        expectancy: { type: number }
        trust: { type: string, enum: [PRIOR, CALIBRATED] }

    TfWeightDeltaRow:
      type: object
      required: [strategy, timeframe, old, new, delta]
      properties:
        strategy: { type: string }
        timeframe: { type: string }
        old: { type: number }
        new: { type: number }
        delta: { type: number }

    TfWeightsReport:
      type: object
      description: >
        Step 8 per-TF calibration + trust-gated tf_weights proposal. Informational —
        live weights are never moved here (owner approval, never auto-apply).
      required: [tf_weights_trusted, per_timeframe, proposal_status, deltas]
      properties:
        tf_weights_trusted: { type: boolean }
        min_trades_per_tf: { type: integer, nullable: true }
        calibrated_timeframes:
          type: array
          items: { type: string }
        per_timeframe:
          type: array
          items: { $ref: "#/components/schemas/TfCalibrationRow" }
        proposal_status: { type: string }
        deltas:
          type: array
          items: { $ref: "#/components/schemas/TfWeightDeltaRow" }
        note: { type: string }

    CalibrationParams:
      type: object
      required: [a, b, samples, status]
      properties:
        a: { type: number }
        b: { type: number }
        samples: { type: integer }
        fitted_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [identity, fitted, insufficient] }

    CalibrationState:
      type: object
      required: [params, min_required, samples_in_state, bins]
      properties:
        params: { $ref: "#/components/schemas/CalibrationParams" }
        min_required: { type: integer }
        samples_in_state: { type: integer }
        bins:
          type: array
          items: { $ref: "#/components/schemas/CalibrationBin" }
        # F4-1 — TF başına Platt fit'i (a/b/samples/status) + flag durumu.
        # Owner tf_platt aktivasyon kanıtını buradan izler.
        per_timeframe:
          type: object
          additionalProperties: { $ref: "#/components/schemas/CalibrationParams" }
        tf_platt_enabled: { type: boolean }

    MistakeRecord:
      type: object
      required: [fingerprint, trades, wins, losses, win_rate, total_pnl, streak_losses]
      properties:
        fingerprint: { type: string }
        trades: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        win_rate: { type: number }
        total_pnl: { type: number }
        last_seen_at: { type: string, format: date-time, nullable: true }
        streak_losses: { type: integer }

    MistakeVerdict:
      type: object
      required: [fingerprint, action, reason, size_factor, evidence]
      properties:
        fingerprint: { type: string }
        action: { type: string, enum: [NEUTRAL, AVOID, BOOST, WARNING] }
        reason: { type: string }
        size_factor: { type: number }
        evidence:
          type: array
          items: { type: string }

    MistakesState:
      type: object
      required: [thresholds, records, verdicts, flagged_count, total_fingerprints]
      properties:
        thresholds:
          type: object
          additionalProperties: { type: number }
        records:
          type: array
          items: { $ref: "#/components/schemas/MistakeRecord" }
        verdicts:
          type: array
          items: { $ref: "#/components/schemas/MistakeVerdict" }
        flagged_count: { type: integer }
        total_fingerprints: { type: integer }

    WeightDelta:
      type: object
      required: [module, old, new, delta]
      properties:
        module: { type: string }
        old: { type: number }
        new: { type: number }
        delta: { type: number }

    ModulePerf:
      type: object
      required: [module, trades, win_rate]
      properties:
        module: { type: string }
        trades: { type: integer }
        wins: { type: integer }
        win_rate: { type: number }
        avg_pnl: { type: number }
        total_pnl: { type: number }
        score: { type: number }

    RebalanceProposalRecord:
      type: object
      description: G2 — owner onayı bekleyen / geçmiş ağırlık önerisi (additive alanlı).
      required: [status]
      properties:
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, AUTO_APPLIED] }
        from_version: { type: string }
        to_version: { type: string }
        generated_at: { type: string, format: date-time }
        regime: { type: string }
        deltas:
          type: array
          items: { $ref: "#/components/schemas/WeightDelta" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/ModulePerf" }

    WeightAutoApplyEntry:
      type: object
      description: >
        G3 — otomatik-uygulanan ağırlık değişikliği kaydı (izleme + ledger). Alanlar
        olaya göre değişir (AUTO_APPLIED/CONFIRMED/ROLLED_BACK); presentation-only.
      additionalProperties: true
      properties:
        event: { type: string, enum: [AUTO_APPLIED, CONFIRMED, ROLLED_BACK] }
        status: { type: string, enum: [MONITORING, CONFIRMED, ROLLED_BACK] }
        applied_version: { type: string }
        prev_version: { type: string }
        regime: { type: string, nullable: true }
        baseline_expectancy: { type: number }
        baseline_n: { type: integer }
        post_expectancy: { type: number }
        post_n: { type: integer }
        applied_at: { type: string }
        resolved_at: { type: string }

    WeightAutoApplyState:
      type: object
      description: G3 — izlenen aktif otomatik-uygulama + son ledger olayları.
      required: [active, ledger]
      properties:
        active:
          oneOf:
            - { $ref: "#/components/schemas/WeightAutoApplyEntry" }
            - { type: "null" }
        ledger:
          type: array
          items: { $ref: "#/components/schemas/WeightAutoApplyEntry" }

    RebalanceState:
      type: object
      required: [active_version, history]
      properties:
        active_version: { type: string }
        current:
          oneOf:
            - { $ref: "#/components/schemas/RebalanceProposalRecord" }
            - { type: "null" }
        history:
          type: array
          items: { $ref: "#/components/schemas/RebalanceProposalRecord" }
        auto_apply:
          $ref: "#/components/schemas/WeightAutoApplyState"

    # ---------------- R1 — gerçek snapshot replay foundation ----------------
    # Replay = kaydedilmiş gerçek state'in incelenmesi. Sahte backtest / uydurma
    # geçmiş performans YOK. PAPER_SAFE / NO_EXECUTION: replay emir üretmez,
    # paper pozisyon açmaz, RiskGate'i bypass etmez, live provider çağırmaz.

    MainBlocker:
      type: object
      description: >
        UX1 — agent'ın TEK ana engeli ("veya" yok). Öncelik DQS/provider >
        halt/kill-switch > RiskGate kısıtı.
      required: [code, label, detail]
      properties:
        code:
          type: string
          enum: [DQS_BLOCKED, HALT, PROVIDER_DOWN, RISK_GATE, NONE]
        label: { type: string }
        detail: { type: string }

    WatchCondition:
      type: object
      description: UX1 — agent'ın izlediği bir sonraki tetik koşulu (deterministik).
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
        detail: { type: string }

    AgentBriefCandidate:
      type: object
      description: >
        UX1 — AgentBrief.top_candidates'taki tek aday (decision matrix hücresinin
        özet projeksiyonu; packages/decision/cockpit.py türetir). Tüm alanlar
        opsiyonel — backend hücreden `.get()` ile okur. Presentation-only.
      properties:
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        direction: { type: string, enum: [bullish, bearish, neutral] }
        score: { type: number }
        candidate_action: { type: string }
        final_action: { type: string }
        actionable: { type: boolean }
        status: { type: string, enum: [ACTIONABLE, NOT_ACTIONABLE, SUSPENDED] }

    AgentBrief:
      type: object
      description: >
        UX1 — ilk-ekran tek ana kart: agent şu an ne yapabilir, ana engel ne,
        ne izliyor. Tüm türetilmiş alanlar backend'de (frontend hesap yapmaz).
      required: [status, can_act, main_blocker, data_mode, summary, recommended_stance]
      properties:
        status:
          type: string
          enum: [ACTIONABLE, NO_ACTION, WATCHING, FROZEN, BLOCKED]
        can_act: { type: boolean }
        main_blocker: { $ref: "#/components/schemas/MainBlocker" }
        summary: { type: string }
        data_mode:
          type: string
          enum: [LIVE_VERIFIED, LIVE_DEGRADED, PARTIAL_FALLBACK, SIMULATION, BLOCKED]
        regime: { type: string, nullable: true }
        dqs:
          type: object
          additionalProperties: true
        risk:
          type: object
          additionalProperties: true
        open_paper_positions: { type: integer }
        top_blockers:
          type: array
          items: { type: string }
        top_candidates:
          type: array
          items: { $ref: "#/components/schemas/AgentBriefCandidate" }
        next_watch_conditions:
          type: array
          items: { $ref: "#/components/schemas/WatchCondition" }
        recommended_stance: { type: string }
        paper_state_summary:
          type: object
          additionalProperties: true
        generated_at: { type: string, format: date-time }

    DecisionTrace:
      type: object
      description: >
        UX1 — candidate→final karar izi: ne istendi, neye düştü, hangi kapı
        kesti, kanıt referansları. Stored/live state'i açıklar; karar üretmez.
      required: [candidate_decisions, final_decisions, blocked_by]
      properties:
        candidate_decisions:
          type: array
          items:
            type: object
            additionalProperties: true
        final_decisions:
          type: array
          items:
            type: object
            additionalProperties: true
        blocked_by:
          type: array
          items: { type: string }
        risk_gate:
          type: object
          additionalProperties: true
          nullable: true
        restrictive_gates:
          type: array
          items: { type: string }
        paper_action:
          type: array
          items:
            type: object
            additionalProperties: true
        evidence_refs:
          type: array
          items: { type: string }

    CockpitBrief:
      type: object
      description: >
        UX1 — Agent Operating Cockpit özeti (tek çağrı). AgentBrief + DecisionTrace
        ilk-ekranı besler. Read-only; yeni karar/emir/live çağrı YOK. PAPER_SAFE.
      required: [agent_brief, decision_trace]
      properties:
        generated_at: { type: string, format: date-time }
        mode:
          type: object
          additionalProperties: true
        agent_brief: { $ref: "#/components/schemas/AgentBrief" }
        decision_trace: { $ref: "#/components/schemas/DecisionTrace" }

    ReplayStatus:
      type: object
      description: >
        R1 — replay store durumu. status=active (kayıt var) / empty (kayıt yok).
        mode=active_snapshot_replay / insufficient_snapshots /
        reserved_not_active. Rolling backtest motoru aktif değil.
      required: [status, available, mode, snapshot_count]
      properties:
        status: { type: string, enum: [active, empty, reserved_not_active] }
        available: { type: boolean }
        mode:
          type: string
          enum: [active_snapshot_replay, insufficient_snapshots, reserved_not_active]
        snapshot_count: { type: integer }
        latest_snapshot_id: { type: string, nullable: true }
        latest_generated_at: { type: string, format: date-time, nullable: true }
        schema_version: { type: integer }
        reason: { type: string }
        execution: { type: string, enum: [no_live_execution] }

    ReplaySnapshot:
      type: object
      description: >
        R1 — kayıtlı snapshot zarfı. `snapshot` alanı diske yazılmış gerçek
        state'tir (data_snapshot / decision_matrix / risk_state /
        paper_state_summary / provider_status / dqs / mode / schema_version).
      required: [snapshot_id, status, available, snapshot]
      properties:
        snapshot_id: { type: string }
        status: { type: string, enum: [active] }
        available: { type: boolean }
        execution: { type: string, enum: [no_live_execution] }
        snapshot:
          type: object
          additionalProperties: true

    ReplayDecisionTrace:
      type: object
      description: >
        R1 — kayıtlı decision_matrix'ten projekte edilen karar izi. Yalnızca
        stored state'i açıklar; yeni karar hesaplamaz, live provider çağırmaz.
      required: [snapshot_id, available, top_candidates, final_decisions]
      properties:
        snapshot_id: { type: string }
        generated_at: { type: string, format: date-time, nullable: true }
        schema_version: { type: integer }
        available: { type: boolean }
        execution: { type: string, enum: [no_live_execution] }
        note: { type: string }
        mode:
          type: object
          additionalProperties: true
          nullable: true
        dqs:
          type: object
          additionalProperties: true
          nullable: true
        regime: { type: string, nullable: true }
        suspended: { type: boolean }
        risk_gate:
          type: object
          additionalProperties: true
          nullable: true
        top_candidates:
          type: array
          items:
            type: object
            additionalProperties: true
        final_decisions:
          type: array
          items:
            type: object
            additionalProperties: true
        blocked_by_reasons:
          type: array
          items: { type: string }
        paper_actions:
          type: array
          items:
            type: object
            additionalProperties: true
        paper_state_summary:
          type: object
          additionalProperties: true
          nullable: true
        provider_issues:
          type: object
          additionalProperties: true
        deep_data:
          type: object
          additionalProperties: true

    # ---------------- R2 — deterministic rolling backtest ----------------
    # Stored snapshot serisi üzerinde outcome ölçümü. Live refetch / sahte geçmiş
    # YOK; look-ahead yok (yalnızca GERÇEK gelecek snapshot'larla ölçer).
    # PAPER_SAFE / NO_EXECUTION: paper açmaz, decide_matrix yeniden çalışmaz.

    ReplayBacktestMetrics:
      type: object
      description: >
        R2 — bir küme (genel / per-timeframe / per-symbol / per-horizon) için
        outcome metrikleri. Yetersiz örnekte oranlar null (uydurma 0 değil).
      required: [signals_evaluated, suppressed_evaluated]
      properties:
        signals_evaluated: { type: integer }
        hits: { type: integer }
        hit_rate: { type: number, nullable: true }
        false_positive: { type: integer }
        false_positive_rate: { type: number, nullable: true }
        false_negative: { type: integer }
        false_negative_rate: { type: number, nullable: true }
        suppressed_evaluated: { type: integer }
        avg_return: { type: number, nullable: true }
        max_drawdown: { type: number, nullable: true }
        blocked_decision_accuracy: { type: number, nullable: true }

    ReplayBacktest:
      type: object
      description: >
        R2 — deterministik rolling backtest sonucu. status=ok /
        insufficient_snapshots (store boş) / insufficient_future_data (ölçülebilir
        gelecek yok). run_id store üzerinde deterministiktir; sahte geçmiş run
        saklanmaz. execution=no_live_execution.
      required: [run_id, status, available, execution, snapshot_count, metrics]
      properties:
        run_id: { type: string }
        algo_version: { type: integer }
        status:
          type: string
          enum: [ok, insufficient_snapshots, insufficient_future_data]
        available: { type: boolean }
        execution: { type: string, enum: [no_live_execution] }
        reason: { type: string }
        snapshot_count: { type: integer }
        usable_snapshot_count: { type: integer }
        evaluated_snapshots: { type: integer }
        horizons:
          type: array
          items: { type: string }
        window:
          type: object
          additionalProperties: true
          nullable: true
        metrics: { $ref: "#/components/schemas/ReplayBacktestMetrics" }
        per_timeframe:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ReplayBacktestMetrics"
        per_symbol:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ReplayBacktestMetrics"
        per_horizon:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ReplayBacktestMetrics"
        coverage:
          type: object
          additionalProperties: true

    # ── Market sessions (read-only, paper-safe) — backend owns session meaning ──
    MarketSessionStatusView:
      type: object
      description: >
        One market's session status at generated_at. Backend-derived (timezone /
        DST / holidays); the frontend renders these fields and computes nothing.
      required:
        [market_id, label, exchange, timezone, is_open, session_phase,
         liquidity_tone, volatility_window, holiday_verified, diagnostics]
      properties:
        market_id: { type: string }
        label: { type: string }
        exchange: { type: string }
        timezone: { type: string }
        is_open: { type: boolean }
        is_holiday: { type: boolean, nullable: true }
        open_time_utc: { type: string, format: date-time, nullable: true }
        close_time_utc: { type: string, format: date-time, nullable: true }
        minutes_to_open: { type: integer, nullable: true }
        minutes_to_close: { type: integer, nullable: true }
        session_phase:
          type: string
          enum: [closed, pre_open, opening_window, mid_session, closing_window, after_close, unknown]
        liquidity_tone:
          type: string
          enum: [high, normal, thin, closed, unknown]
        volatility_window: { type: boolean }
        holiday_verified:
          type: boolean
          description: false → holidays/early-closes unverified (calendar lib absent); see diagnostics.
        diagnostics:
          type: array
          items: { type: string }

    AssetSessionContextView:
      type: object
      required:
        [asset_code, relevant_markets, any_relevant_market_open, session_risk,
         reason, diagnostics]
      properties:
        asset_code: { type: string }
        relevant_markets:
          type: array
          items: { $ref: "#/components/schemas/MarketSessionStatusView" }
        any_relevant_market_open: { type: boolean }
        primary_market_open: { type: boolean, nullable: true }
        session_risk:
          type: string
          enum: [normal, caution, manual_review, block, unknown]
        reason: { type: string }
        diagnostics:
          type: array
          items: { type: string }

    MarketSessionDecisionView:
      type: object
      description: >
        Restrictive session gate decision. size_multiplier is always ≤ 1.0 —
        market sessions can only reduce size, never boost. RiskGate stays final.
      required: [action, size_multiplier, reason, evidence, diagnostics]
      properties:
        action:
          type: string
          enum: [allow, caution, manual_ready, block]
        size_multiplier: { type: number }
        reason: { type: string }
        reason_code: { type: string, nullable: true }
        evidence:
          type: array
          items: { type: string }
        diagnostics:
          type: array
          items: { type: string }

    MarketSessionsCurrentResponse:
      type: object
      required: [generated_at, markets, diagnostics, paper_safe, no_execution]
      properties:
        generated_at: { type: string, format: date-time }
        markets:
          type: array
          items: { $ref: "#/components/schemas/MarketSessionStatusView" }
        diagnostics:
          type: array
          items: { type: string }
        paper_safe: { type: boolean }
        no_execution: { type: boolean }

    MarketSessionAssetResponse:
      type: object
      required:
        [generated_at, asset_code, asset_context, decision, diagnostics,
         paper_safe, no_execution]
      properties:
        generated_at: { type: string, format: date-time }
        asset_code: { type: string }
        asset_context: { $ref: "#/components/schemas/AssetSessionContextView" }
        decision: { $ref: "#/components/schemas/MarketSessionDecisionView" }
        diagnostics:
          type: array
          items: { type: string }
        paper_safe: { type: boolean }
        no_execution: { type: boolean }

    MarketSessionTradeUniverseAsset:
      type: object
      required: [asset_code, primary_market_open, action, reason]
      properties:
        asset_code: { type: string }
        primary_market_open: { type: boolean, nullable: true }
        action:
          type: string
          enum: [allow, caution, manual_ready, block]
        reason: { type: string }

    MarketSessionsTradeUniverseResponse:
      type: object
      description: >
        Per-asset session gate for the whole trade universe (asset_registry.
        trade_symbols(), incl. custom assets) in one call.
      required: [generated_at, assets, paper_safe, no_execution]
      properties:
        generated_at: { type: string, format: date-time }
        assets:
          type: array
          items: { $ref: "#/components/schemas/MarketSessionTradeUniverseAsset" }
        paper_safe: { type: boolean }
        no_execution: { type: boolean }

    AgentQuorumRow:
      type: object
      required: [symbol, lead_direction, quorum_reached, tally]
      properties:
        symbol: { type: string }
        lead_direction: { type: string, nullable: true }
        quorum_reached: { type: boolean }
        tally:
          type: object
          additionalProperties: { type: integer }

    AgentQuorumMatrixResponse:
      type: object
      description: >
        Agent persona quorum (analyst/risk-officer/macro-strategist) computed
        per-symbol across the trade universe — unlike /dashboard/state.agent_votes,
        not pinned to a single symbol.
      required: [generated_at, symbols]
      properties:
        generated_at: { type: string, format: date-time }
        symbols:
          type: array
          items: { $ref: "#/components/schemas/AgentQuorumRow" }

    StrategyBacktestTrade:
      type: object
      required: [side, entry_ts, entry_price, exit_ts, exit_price, exit_reason, pnl_pct, bars_held]
      properties:
        side: { type: string, enum: [long, short] }
        entry_ts: { type: string, format: date-time }
        entry_price: { type: number }
        exit_ts: { type: string, format: date-time }
        exit_price: { type: number }
        exit_reason: { type: string, enum: [SL_HIT, TP_HIT] }
        pnl_pct: { type: number }
        bars_held: { type: integer }

    StrategyBacktestResult:
      type: object
      description: >
        Pilot — live technical-bias engine replayed over real historical OHLCV
        bars (no look-ahead), trades simulated with the same SL/TP rules paper
        trading uses. scope=technical_only (fundamental/news/sentinel have no
        historical data to replay). status=insufficient_bars when warm-up isn't met.
      required: [status, symbol, timeframe]
      properties:
        status: { type: string, enum: [ok, insufficient_bars] }
        symbol: { type: string }
        timeframe: { type: string }
        scope: { type: string, enum: [technical_only] }
        bars_used: { type: integer }
        bars_available: { type: integer }
        bars_required: { type: integer }
        window:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        total_trades: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        win_rate: { type: number, nullable: true }
        avg_return_pct: { type: number, nullable: true }
        profit_factor: { type: number, nullable: true }
        trades:
          type: array
          items: { $ref: "#/components/schemas/StrategyBacktestTrade" }

    StrategyBacktestAllResult:
      type: object
      description: >
        StrategyBacktestResult for every asset in asset_registry.trade_symbols()
        (incl. custom assets) — symbol list re-read fresh on every call.
      required: [status, timeframe, symbols_evaluated, symbols_total, total_trades, per_symbol]
      properties:
        status: { type: string, enum: [ok, insufficient_bars] }
        timeframe: { type: string }
        scope: { type: string, enum: [technical_only] }
        symbols_evaluated: { type: integer }
        symbols_total: { type: integer }
        total_trades: { type: integer }
        overall_win_rate: { type: number, nullable: true }
        per_symbol:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StrategyBacktestResult"

    LiquidityAssetFlow:
      type: object
      required: [symbol, label, kind, return_pct, volume_change_pct, flow_score, direction]
      properties:
        symbol: { type: string }
        label: { type: string }
        kind: { type: string }
        return_pct: { type: number, nullable: true }
        volume_change_pct: { type: number, nullable: true }
        tvl_change_pct:
          type: number
          nullable: true
          description: Real on-chain TVL change (DefiLlama) — only available for BTCUSD/ETHUSD.
        flow_score: { type: number, minimum: 0, maximum: 100 }
        direction: { type: string, enum: [in, out, neutral] }

    LiquidityWindow:
      type: object
      required: [window, assets, regime, regime_reasons, contradictions]
      properties:
        window: { type: string, enum: ["1D", "7D", "30D"] }
        assets:
          type: array
          items: { $ref: "#/components/schemas/LiquidityAssetFlow" }
        regime:
          type: string
          enum: [RISK_ON, CONTROLLED_RISK_ON, NEUTRAL, RISK_OFF, CRISIS]
        regime_reasons:
          type: array
          items: { type: string }
        contradictions:
          type: array
          items: { type: string }

    LiquidityRotation:
      type: object
      description: >
        Küresel Likidite Rotasyon — fixed liquidity-role basket flow score
        (momentum + volume + macro + vol-penalty + TVL where available),
        observation-only (PAPER_SAFE/NO_EXECUTION).
      required: [windows, basket_size]
      properties:
        windows:
          type: array
          items: { $ref: "#/components/schemas/LiquidityWindow" }
        basket_size: { type: integer }

    # ── F1 — Multi-timeframe Fibonacci (technical evidence; backend-computed) ──
    FibonacciLevel:
      type: object
      required: [ratio, label, price, kind]
      properties:
        ratio: { type: number }
        label: { type: string }
        price: { type: number }
        kind: { type: string, enum: [retracement, extension] }
        role: { type: string, enum: [support, resistance, neutral, unknown] }
        distance_pct: { type: number, nullable: true }

    FibonacciAnalysis:
      type: object
      description: >
        One timeframe's Fibonacci context (1D = HTF swing; 4H = retest). Computed
        from real OHLCV by the backend — the frontend renders, never calculates.
      required: [timeframe, trend_direction, levels, zone, validity, diagnostics]
      properties:
        timeframe: { type: string, enum: ["1D", "4H"] }
        swing_high: { type: number, nullable: true }
        swing_low: { type: number, nullable: true }
        swing_start: { type: string, format: date-time, nullable: true }
        swing_end: { type: string, format: date-time, nullable: true }
        trend_direction: { type: string, enum: [uptrend, downtrend, range, unknown] }
        levels:
          type: array
          items: { $ref: "#/components/schemas/FibonacciLevel" }
        nearest_level:
          anyOf:
            - $ref: "#/components/schemas/FibonacciLevel"
            - type: "null"
        nearest_distance_pct: { type: number, nullable: true }
        zone:
          type: string
          enum: [near_support, near_resistance, breakout, breakdown, mid_range, unknown]
        validity: { type: string, enum: [sane, weak, unavailable] }
        diagnostics:
          type: array
          items: { type: string }

    FibonacciConfluence:
      type: object
      required: [has_confluence, confluence_zone, score, reason, diagnostics]
      properties:
        has_confluence: { type: boolean }
        confluence_zone: { type: string, enum: [support, resistance, mixed, none, unknown] }
        nearest_1d_level:
          anyOf:
            - $ref: "#/components/schemas/FibonacciLevel"
            - type: "null"
        nearest_4h_level:
          anyOf:
            - $ref: "#/components/schemas/FibonacciLevel"
            - type: "null"
        distance_between_levels_pct: { type: number, nullable: true }
        score:
          type: integer
          description: 0–25 confluence sub-score (evidence only; never opens trades).
        reason: { type: string }
        diagnostics:
          type: array
          items: { type: string }

    TechnicalInsight:
      type: object
      description: >
        Per-symbol technical evidence aggregate carrying the Fibonacci layer. It
        does NOT alter the per-TF TechnicalSnapshot score (technical_score) and is
        not consumed by the decision engine / RiskGate.
      required: [symbol, fibonacci_score]
      properties:
        symbol: { type: string }
        fib_1d:
          anyOf:
            - $ref: "#/components/schemas/FibonacciAnalysis"
            - type: "null"
        fib_4h:
          anyOf:
            - $ref: "#/components/schemas/FibonacciAnalysis"
            - type: "null"
        fib_confluence:
          anyOf:
            - $ref: "#/components/schemas/FibonacciConfluence"
            - type: "null"
        fibonacci_score:
          type: integer
          description: 0–25 Fibonacci evidence score (separate from technical_score).

    # ── T-MTF — Per-timeframe technical result (multi-TF feature; backend-computed) ──
    # EVIDENCE only: never opens trades, never a single aggregated score
    # (direction/strength stay separate). The frontend renders, never calculates.
    IndicatorQualityReport:
      type: object
      description: Per-indicator warm-up status (INSUFFICIENT_HISTORY is a diagnostic, never a fake value).
      properties:
        rsi: { type: string, enum: [OK, INSUFFICIENT_HISTORY] }
        macd: { type: string, enum: [OK, INSUFFICIENT_HISTORY] }
        ema200: { type: string, enum: [OK, INSUFFICIENT_HISTORY] }
        atr: { type: string, enum: [OK, INSUFFICIENT_HISTORY] }
        adx: { type: string, enum: [OK, INSUFFICIENT_HISTORY] }

    TechnicalDataQuality:
      type: object
      properties:
        status: { type: string, enum: [OK, DEGRADED] }
        bars_used: { type: integer }
        stale: { type: boolean }
        indicator_quality: { $ref: "#/components/schemas/IndicatorQualityReport" }
        warnings:
          type: array
          items: { type: string }

    TechnicalScoreOverview:
      type: object
      description: >
        Two SEPARATE axes (architecture rule). null = insufficient data — never a
        neutral 50 (DATA_POLICY).
      properties:
        direction_score: { type: number, nullable: true }
        strength_score: { type: number, nullable: true }
        location_gate_multiplier:
          type: number
          nullable: true
          description: >
            Diagnostic (NOT a collapsed score): how much the top-down location/
            pattern/volume gate scaled momentum conviction. 1.0 neutral, <1 penalty
            (e.g. longing into resistance), >1 mild confirm.

    TechnicalKeyLevels:
      type: object
      properties:
        support: { type: number, nullable: true }
        resistance: { type: number, nullable: true }
        atr: { type: number, nullable: true }
        atr_percent: { type: number, nullable: true }
        stop_reference: { type: number, nullable: true }
        target_reference: { type: number, nullable: true }

    TechnicalTrendStrength:
      type: object
      description: ADX-band trend reality (NOT direction); adx < adx_trend_min → weak trend.
      properties:
        adx: { type: number, nullable: true }
        plus_di: { type: number, nullable: true }
        minus_di: { type: number, nullable: true }
        is_trending: { type: boolean }
        label: { type: string, enum: [TRENDING, WEAK, UNKNOWN] }

    TechnicalConfluenceZone:
      type: object
      required: [price, kind]
      properties:
        price: { type: number }
        kind: { type: string, enum: [support, resistance] }
        components:
          type: array
          items: { type: string }

    ConfirmationSignal:
      type: object
      description: A TIMING gate (fired/not) — separate from scoring (no double count).
      required: [name]
      properties:
        name: { type: string }
        fired: { type: boolean }
        detail: { type: string }

    TechnicalTimeframeSummary:
      type: object
      properties:
        bias: { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        evidence:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }

    ReversalSignal:
      type: object
      required: [type, detected]
      properties:
        type:
          type: string
          enum:
            - rsi_bullish_divergence
            - rsi_bearish_divergence
            - macd_bullish_divergence
            - macd_bearish_divergence
            - double_bottom
            - double_top
        detected: { type: boolean }
        detail: { type: string }

    TechnicalReversalSignals:
      type: object
      description: >
        Reversal cues (momentum divergence + double formations) read from real closed
        bars; bias is the net direction (NEUTRAL when none/conflicting). EVIDENCE only.
      properties:
        signals:
          type: array
          items: { $ref: "#/components/schemas/ReversalSignal" }
        bias: { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }

    ChartPattern:
      type: object
      required: [name]
      properties:
        name: { type: string, enum: [uptrend_structure, downtrend_structure, ranging] }
        detail: { type: string }

    TechnicalChartPatterns:
      type: object
      description: Swing-structure read (HH/HL vs LH/LL) from real closed bars — EVIDENCE only.
      properties:
        active_patterns:
          type: array
          items: { $ref: "#/components/schemas/ChartPattern" }
        bias: { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }

    TechnicalTimeframeResult:
      type: object
      description: >
        Canonical per-(symbol, timeframe) technical result (one structured opinion
        per closed-candle timeframe). EVIDENCE only — never opens trades, never a
        single aggregated score. Backend computes from real closed OHLCV.
      required: [symbol, timeframe]
      properties:
        symbol: { type: string }
        timeframe: { type: string, enum: ["15m", "1h", "4h", "1d", "1w"] }
        data_quality: { $ref: "#/components/schemas/TechnicalDataQuality" }
        score_overview: { $ref: "#/components/schemas/TechnicalScoreOverview" }
        key_levels: { $ref: "#/components/schemas/TechnicalKeyLevels" }
        confirmation_signals:
          type: array
          items: { $ref: "#/components/schemas/ConfirmationSignal" }
        trend_strength: { $ref: "#/components/schemas/TechnicalTrendStrength" }
        volatility_regime:
          type: string
          enum: [TRENDING, RANGING, SQUEEZE, EXPANSION, UNKNOWN]
        confluence_zones:
          type: array
          items: { $ref: "#/components/schemas/TechnicalConfluenceZone" }
        timeframe_summary: { $ref: "#/components/schemas/TechnicalTimeframeSummary" }
        fibonacci_analysis:
          anyOf:
            - $ref: "#/components/schemas/FibonacciAnalysis"
            - type: "null"
        reversal_signals:
          anyOf:
            - $ref: "#/components/schemas/TechnicalReversalSignals"
            - type: "null"
        chart_pattern_analysis:
          anyOf:
            - $ref: "#/components/schemas/TechnicalChartPatterns"
            - type: "null"
        status: { type: string, enum: [OK, DEGRADED] }
        source: { type: string }
        ts: { type: string, format: date-time }

    # ── T2 — TechnicalAgent output (one structured opinion per symbol) ─────────
    TechnicalInvalidation:
      type: object
      properties:
        timeframe: { type: string, enum: ["15m", "1h", "4h", "1d", "1w"], nullable: true }
        price: { type: number, nullable: true }
        reason: { type: string }

    TechnicalAgentOutput:
      type: object
      description: >
        One structured TechnicalAgent opinion per symbol. EVIDENCE only — never
        opens trades, never sizes; per_timeframe detail stays authoritative and
        consensus does the strategy-specific combination.
      required: [agent, symbol]
      properties:
        agent: { type: string, enum: [technical] }
        symbol: { type: string }
        per_timeframe:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TechnicalTimeframeResult" }
        stance: { type: string, enum: [ALLOW, CAUTION, ABSTAIN, DEGRADED] }
        direction_score: { type: number, nullable: true }
        strength_score: { type: number, nullable: true }
        used_observations:
          type: array
          items: { type: string }
        invalidation:
          anyOf:
            - $ref: "#/components/schemas/TechnicalInvalidation"
            - type: "null"
        missing_data:
          type: array
          items: { type: string }
        ts: { type: string, format: date-time }

    # ── T2 — Cross-timeframe consensus snapshot (TF + agent aggregation) ───────
    # SEPARATE axes (direction/strength/agreement/alignment) — never one collapsed
    # score for all strategies. NEUTRAL dilutes alignment; countertrend conditional.
    CrossTimeframeConfluenceZone:
      type: object
      required: [price, kind]
      properties:
        price: { type: number }
        kind: { type: string, enum: [support, resistance] }
        timeframes:
          type: array
          items: { type: string }
        components:
          type: array
          items: { type: string }

    ConsensusSnapshot:
      type: object
      required: [asset]
      properties:
        asset: { type: string }
        per_timeframe_bias:
          type: object
          additionalProperties: { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        alignment_status: { type: string, enum: [ALIGNED, PARTIAL, COUNTERTREND, CONFLICTED] }
        alignment_score: { type: number }
        cross_timeframe_confluence:
          type: array
          items: { $ref: "#/components/schemas/CrossTimeframeConfluenceZone" }
        direction_score: { type: number, nullable: true }
        strength_score: { type: number, nullable: true }
        agreement_score: { type: number }
        is_countertrend: { type: boolean }
        confirmed_count: { type: integer }
        pending_count: { type: integer }
        blocking_count: { type: integer }
        evidence:
          type: array
          items: { type: string }
        ts: { type: string, format: date-time }

    # ── T2 — AgentDecision (deterministic action; RiskGate stays final) ───────
    AgentDecision:
      type: object
      description: >
        Deterministic high-level decision bridging consensus evidence to one action
        + entry timeframe. Never opens trades; risk_gate_required is always true;
        upper TF only scales down (size_multiplier ≤ 1.0); 1w yields bias only.
      required: [asset, action]
      properties:
        asset: { type: string }
        action:
          type: string
          enum: [NO_TRADE, WATCH, SCOUT_ALLOWED, CONFIRMATION_REQUIRED, RISK_REDUCE, KILL_SWITCH]
        entry_timeframe: { type: string, enum: ["15m", "1h", "4h", "1d", "1w"], nullable: true }
        size_multiplier: { type: number }
        confidence: { type: number }
        reason: { type: string }
        supporting_agents:
          type: array
          items: { type: string }
        blocking_agents:
          type: array
          items: { type: string }
        required_confirmations:
          type: array
          items: { type: string }
        manual_ready_required: { type: boolean }
        risk_gate_required: { type: boolean }
        ts: { type: string, format: date-time }

    # ── T2 step 6 — per-trade cost + R:R gate output (RiskGate-side overlay) ──
    TradeEconomics:
      type: object
      description: >
        Per-trade economics gate result (cost + risk:reward). Only ever restrictive:
        allow is true only when rr ≥ min_rr AND net_edge_bps ≥ min_net_edge_bps.
      required: [allow, reason]
      properties:
        allow: { type: boolean }
        reason:
          type: string
          enum: [ok, bad_rr, below_cost, insufficient_levels, invalid_entry, invalid_stop]
        rr: { type: number, nullable: true }
        reward_bps: { type: number, nullable: true }
        risk_bps: { type: number, nullable: true }
        cost_bps: { type: number }
        net_edge_bps: { type: number, nullable: true }
        evidence:
          type: array
          items: { type: string }

    # ── T2 step 7 — composed per-symbol agent pipeline row ────────────────────
    AgentMatrixRow:
      type: object
      required: [symbol, stance, consensus, decision]
      properties:
        symbol: { type: string }
        stance: { type: string, enum: [ALLOW, CAUTION, ABSTAIN, DEGRADED] }
        consensus: { $ref: "#/components/schemas/ConsensusSnapshot" }
        decision: { $ref: "#/components/schemas/AgentDecision" }
        economics:
          anyOf:
            - $ref: "#/components/schemas/TradeEconomics"
            - type: "null"
        reversal_bias: { type: string, enum: [BULLISH, BEARISH, NEUTRAL], nullable: true }
        pattern: { type: string, nullable: true }
        per_timeframe:
          type: array
          description: >
            Per-TF gated direction + location-gate diagnostic (visibility). EVIDENCE
            only — the gate already shaped direction_score and bias; this surfaces the
            'where am I' read per timeframe alongside the aggregated consensus.
          items: { $ref: "#/components/schemas/AgentTimeframeCell" }

    AgentTimeframeCell:
      type: object
      required: [timeframe, bias]
      properties:
        timeframe: { type: string, enum: ["15m", "1h", "4h", "1d", "1w"] }
        direction_score: { type: number, nullable: true }
        strength_score: { type: number, nullable: true }
        bias: { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        location_gate: { type: number, nullable: true }

    AgentMatrix:
      type: object
      description: >
        Read-only multi-TF agent pipeline matrix (steps 1–6). Global RiskGate action
        is applied first; the per-trade cost + R:R gate is final. Frontend renders only.
      required: [timeframes, symbols]
      properties:
        risk_action: { type: string, nullable: true }
        timeframes:
          type: array
          items: { type: string, enum: ["15m", "1h", "4h", "1d", "1w"] }
        symbols:
          type: array
          items: { $ref: "#/components/schemas/AgentMatrixRow" }

    ShadowTfCalibration:
      type: object
      required: [timeframe, strategy, trades, win_rate, trust]
      properties:
        timeframe: { type: string }
        strategy: { type: string }
        trades: { type: integer }
        win_rate: { type: number }
        trust: { type: string, enum: [PRIOR, CALIBRATED] }

    ShadowCalibration:
      type: object
      description: tf_weights trust verdict — PRIOR/untrusted until per-TF calibration validates.
      required: [tf_weights_trusted, calibrated_timeframes, per_timeframe]
      properties:
        tf_weights_trusted: { type: boolean }
        calibrated_timeframes:
          type: array
          items: { type: string }
        min_trades_per_tf: { type: integer, nullable: true }
        per_timeframe:
          type: array
          items: { $ref: "#/components/schemas/ShadowTfCalibration" }

    ShadowAgreementSummary:
      type: object
      description: Per-tick counts of how live and shadow intents agreed (observation only).
      required: [agree_entry, agree_flat, disagree_direction, live_only_entry, shadow_only_entry]
      properties:
        agree_entry: { type: integer }
        agree_flat: { type: integer }
        disagree_direction: { type: integer }
        live_only_entry: { type: integer }
        shadow_only_entry: { type: integer }

    ShadowRow:
      type: object
      required: [symbol, agreement, live_wants_entry, shadow_wants_entry]
      properties:
        symbol: { type: string }
        agreement:
          type: string
          enum: [AGREE_ENTRY, AGREE_FLAT, DISAGREE_DIRECTION, LIVE_ONLY_ENTRY, SHADOW_ONLY_ENTRY]
        live_wants_entry: { type: boolean }
        live_action: { type: string, nullable: true }
        live_direction: { type: string, nullable: true }
        live_timeframe: { type: string, nullable: true }
        shadow_wants_entry: { type: boolean }
        shadow_action: { type: string, nullable: true }
        shadow_direction: { type: string, nullable: true }
        shadow_entry_timeframe: { type: string, nullable: true }
        shadow_stance: { type: string, nullable: true }
        # Additive — bkz. packages/decision/shadow.py::_evidence_for_symbol.
        # Karar zincirini etkilemez; yalnızca gözlem amaçlı ek kanıt.
        elliott_scenario: { type: string, nullable: true }
        elliott_confidence: { type: number, nullable: true }
        elliott_bias: { type: string, nullable: true }
        historical_edge_sample_count: { type: integer, nullable: true }
        historical_edge_win_rate: { type: number, nullable: true }
        historical_edge_confidence: { type: string, nullable: true }

    ShadowComparison:
      type: object
      description: >
        Step 9 controlled activation (observation mode). Latest comparison of the live
        decide_matrix engine vs the NEW agent pipeline running in shadow. affected_paper
        is always false in Phase A — the shadow never moves paper; this is read-only.
      required: [available, affect_decision, affected_paper, summary, calibration, rows]
      properties:
        available: { type: boolean }
        recorded_at: { type: string, nullable: true }
        snapshot_id: { type: string, nullable: true }
        risk_action: { type: string, nullable: true }
        affect_decision: { type: boolean }
        affected_paper: { type: boolean }
        summary: { $ref: "#/components/schemas/ShadowAgreementSummary" }
        calibration: { $ref: "#/components/schemas/ShadowCalibration" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ShadowRow" }

    ConflictGateRouteStats:
      type: object
      description: Faz 9A — bir (trade_profile, route) hücresinin gerçekleşmiş trade istatistiği.
      required: [n, win_rate, avg_pnl]
      properties:
        n: { type: integer }
        win_rate: { type: number }
        avg_pnl: { type: number }

    ConflictGateStatus:
      type: object
      description: Faz 8 — Conflict Gate config durumu (read-only; karar zincirine etkisi enabled flag'iyle koşullu).
      required: [enabled, profile_modes]
      properties:
        enabled: { type: boolean }
        profile_modes:
          type: object
          additionalProperties: { type: string, enum: ["OFF", "SOFT", "SOFT_PLUS", "HARD", "HARD_MANUAL"] }

    AgentModeConfigValues:
      type: object
      description: Faz 3 — Agent Mode etkin değerleri (profil/strateji izinleri).
      required:
        - enabled_trade_profiles
        - disabled_trade_profiles
        - allow_counter_context_trades
        - allow_reversal_trades
        - allow_trend_follow_trades
        - allow_range_trades
        - allow_breakout_trades
        - watch_disabled_profiles
        - close_disabled_profile_positions
        - close_requires_riskgate_pass
      properties:
        enabled_trade_profiles: { type: array, items: { type: string } }
        disabled_trade_profiles: { type: array, items: { type: string } }
        focus_mode: { type: string, nullable: true }
        allow_counter_context_trades: { type: boolean }
        allow_reversal_trades: { type: boolean }
        allow_trend_follow_trades: { type: boolean }
        allow_range_trades: { type: boolean }
        allow_breakout_trades: { type: boolean }
        watch_disabled_profiles: { type: boolean }
        close_disabled_profile_positions: { type: boolean }
        close_requires_riskgate_pass: { type: boolean }

    AgentModeConfigUpdate:
      type: object
      description: Faz 3 — Owner override payload (tümü opsiyonel; bilinmeyen anahtar/profil sunucuda reddedilir).
      properties:
        enabled_trade_profiles: { type: array, items: { type: string } }
        disabled_trade_profiles: { type: array, items: { type: string } }
        focus_mode: { type: string, nullable: true }
        allow_counter_context_trades: { type: boolean }
        allow_reversal_trades: { type: boolean }
        allow_trend_follow_trades: { type: boolean }
        allow_range_trades: { type: boolean }
        allow_breakout_trades: { type: boolean }
        watch_disabled_profiles: { type: boolean }
        close_disabled_profile_positions: { type: boolean }
        close_requires_riskgate_pass: { type: boolean }

    AgentModeConfigView:
      type: object
      description: Faz 3 — Agent Mode görüntüsü (etkin config + profil listesi + ham override + etki alanı).
      required: [trade_profiles, config, overrides, applies_to]
      properties:
        trade_profiles: { type: array, items: { type: string } }
        config: { $ref: "#/components/schemas/AgentModeConfigValues" }
        overrides: { type: object, additionalProperties: true }
        applies_to: { type: string }

    MissedOpportunityOutcomes:
      type: object
      description: Faz 2 — sonuç sayıları (TP önce=missed_win, SL önce=avoided_loss, TTL=expired).
      properties:
        missed_win: { type: integer }
        avoided_loss: { type: integer }
        expired: { type: integer }

    MissedOpportunityActive:
      type: object
      description: Faz 2 — şu an izlenen (henüz çözülmemiş) açılmamış setup.
      required: [symbol, timeframe, side]
      properties:
        symbol: { type: string }
        timeframe: { type: string }
        side: { type: string }
        trade_profile: { type: string, nullable: true }
        setup_type: { type: string, nullable: true }
        entry: { type: number, nullable: true }
        sl: { type: number, nullable: true }
        tp: { type: number, nullable: true }
        opened_at: { type: string, nullable: true }

    MissedOpportunitiesView:
      type: object
      description: Faz 2 — Missed Opportunity özeti (read-only, paper-safe; açılmayan valid setup'ların TTL sonucu).
      required: [available, outcomes, by_profile, active, recent]
      properties:
        available: { type: boolean }
        enabled: { type: boolean }
        outcomes: { $ref: "#/components/schemas/MissedOpportunityOutcomes" }
        by_profile:
          type: object
          additionalProperties: { $ref: "#/components/schemas/MissedOpportunityOutcomes" }
        active:
          type: array
          items: { $ref: "#/components/schemas/MissedOpportunityActive" }
        recent:
          type: array
          items: { type: object, additionalProperties: true }

    CalibrationGuardrailStatus:
      type: object
      description: Calibration inflation guardrail (otomatik kısma) flag durumu.
      required: [enabled, max_inflation_delta]
      properties:
        enabled: { type: boolean }
        max_inflation_delta: { type: number }

    CalibrationJumpRow:
      type: object
      description: Tek açılışın kalibrasyon sıçraması kaydı (raw→fitted + faktörler).
      properties:
        ts: { type: string, nullable: true }
        position_id: { type: string, nullable: true }
        symbol: { type: string, nullable: true }
        timeframe: { type: string, nullable: true }
        side: { type: string, nullable: true }
        raw_confidence: { type: number, nullable: true }
        fitted_confidence: { type: number, nullable: true }
        inflation_delta: { type: number, nullable: true }
        confidence_source: { type: string, nullable: true }
        platt_a: { type: number, nullable: true }
        platt_b: { type: number, nullable: true }
        platt_status: { type: string, nullable: true }
        platt_samples: { type: integer, nullable: true }
        score: { type: number, nullable: true }
        dominant_module: { type: string, nullable: true }
        direction: { type: string, nullable: true }
        confluence_aligned: { type: boolean, nullable: true }
        regime: { type: string, nullable: true }
        tier: { type: string, nullable: true }
        size_usd: { type: number, nullable: true }
        fingerprint: { type: string, nullable: true }

    CalibrationJumpsView:
      type: object
      description: Calibration jump ledger özeti (read-only/observe) + guardrail durumu.
      required: [guardrail, count, fitted_count, capped_count, by_tier, by_dominant_module, top_jumps, recent]
      properties:
        guardrail: { $ref: "#/components/schemas/CalibrationGuardrailStatus" }
        count: { type: integer }
        fitted_count: { type: integer }
        capped_count: { type: integer }
        avg_inflation_delta: { type: number, nullable: true }
        max_inflation_delta: { type: number, nullable: true }
        by_tier:
          type: object
          additionalProperties: { type: integer }
        by_dominant_module:
          type: object
          additionalProperties: { type: integer }
        top_jumps:
          type: array
          items: { $ref: "#/components/schemas/CalibrationJumpRow" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/CalibrationJumpRow" }

    TfTargetParams:
      type: object
      description: TF başına SL/TP geometri parametreleri (compute_tf_targets okur).
      required: [sl_atr_mult, rr, sl_pct_floor, sl_pct_cap]
      properties:
        sl_atr_mult:  { type: number }
        rr:           { type: number }
        sl_pct_floor: { type: number }
        sl_pct_cap:   { type: number }

    TfTargetGuardrailBand:
      type: object
      required: [min, max]
      properties:
        min: { type: number }
        max: { type: number }

    TfTargetsView:
      type: object
      description: >
        Faz B — TF-aware SL/TP öğrenmesinin durumu. `effective` o anki canlı
        değerleri (config → store override) gösterir; `pending` bekleyen
        owner-onayını taşır.
      required: [enabled, auto_apply_band_pct, guardrail, effective, store_current, history]
      properties:
        enabled: { type: boolean }
        auto_apply_band_pct: { type: number }
        guardrail:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TfTargetGuardrailBand" }
        effective:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TfTargetParams" }
        store_current:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TfTargetParams" }
        pending:
          nullable: true
          type: object
          additionalProperties: true
        history:
          type: array
          items:
            type: object
            additionalProperties: true
        coverage:
          description: >
            TF-başı eğitim kapsamı (denetim 2026-07-03, additive) — trainer'ın
            hangi TF'lerde yeterli AUTO kanıtı olduğu; 1d gibi eksik TF'ler
            dürüstçe UNTRAINED görünür (kanıt havuzlama/eşik indirme YOK).
          type: object
          additionalProperties: { $ref: "#/components/schemas/TfTargetCoverage" }
        trainer_inputs:
          description: Trainer girdi-hijyen flag'lerinin o anki durumu (gözlem).
          type: object
          properties:
            auto_only_enabled: { type: boolean }
            forensics_nudge_enabled: { type: boolean }

    TfTargetCoverage:
      type: object
      description: Bir TF'in trainer kanıt kapsamı (AUTO kohort sayımı).
      required: [auto_n, verified_n, min_required, status]
      properties:
        auto_n: { type: integer }
        verified_n: { type: integer }
        min_required: { type: integer }
        status: { type: string, enum: [TRAINED, UNTRAINED] }

    ExitForensicsView:
      type: object
      description: >
        Çıkış Otopsisi (denetim 2026-07-03) — AUTO kohort çıkış kalitesi.
        MFE/MAE yalnız pozisyon açıkken kaydedilir; kapanış-sonrası hiçbir şey
        hesaplanmaz. $ alanları tahminidir (size_usd ya da notional çıkarımı).
      required: [generated_at, cohort, total, usable, min_bucket, buckets, top_costs, excluded, limits]
      properties:
        generated_at: { type: string }
        cohort: { type: string }
        total: { type: integer }
        usable: { type: integer }
        min_bucket: { type: integer }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/ExitForensicsBucket" }
        top_costs:
          type: array
          items: { $ref: "#/components/schemas/ExitCostCard" }
        excluded:
          type: object
          properties:
            manual: { type: integer }
            non_auto: { type: integer }
            no_excursion: { type: integer }
        limits:
          type: array
          items: { type: string }
        history_tail:
          description: Son snapshot trend noktaları (capture/toplam maliyet).
          type: array
          items:
            type: object
            additionalProperties: true

    ExitForensicsBucket:
      type: object
      description: TF × kapanış-kategorisi çıkış istatistiği (AUTO kohort).
      required: [timeframe, category, n, total_pnl, avg_pnl]
      properties:
        timeframe: { type: string }
        category: { type: string, enum: [sl, tp, time_stop, trailing, manual, other] }
        n: { type: integer }
        total_pnl: { type: number }
        avg_pnl: { type: number }
        avg_capture: { type: number, nullable: true }
        avg_give_back_pct: { type: number, nullable: true }
        give_back_usd_est_total: { type: number, nullable: true }
        avg_missed_capture_pct: { type: number, nullable: true }
        missed_usd_est_total: { type: number, nullable: true }
        sl_roundtrip: { type: integer }
        sl_straight: { type: integer }
        sl_gray: { type: integer }
        never_worked: { type: integer }
        no_excursion: { type: integer }
        usd_est_covered_n: { type: integer }
        avg_mfe_pct: { type: number, nullable: true }
        top_module: { type: string, nullable: true }

    ExitCostCard:
      type: object
      description: En pahalı çıkış hatası kartı (Türkçe düz-dil, en fazla 3).
      required: [kind, timeframe, n, label]
      properties:
        kind: { type: string, enum: [TRAILING_GIVEBACK, SL_ROUNDTRIP, TIMESTOP_MISSED] }
        timeframe: { type: string }
        n: { type: integer }
        cost_usd_est: { type: number, nullable: true }
        label: { type: string }

    DiscoveryView:
      type: object
      description: >
        Keşif tarayıcısı (K serisi) — "analiz sabit, varlık değişken". Geniş
        evren (yükselen sektör ETF'leri + kripto top-50) canlı analiz
        çekirdeğinden geçer ama işlem AÇILMAZ; tüm hükümler hipotetik. flag
        DISCOVERY_SCAN_ENABLED kapalıysa enabled=false + boş tablo döner.
      required: [enabled, honesty, universe, scan, shadow, candidates]
      properties:
        enabled: { type: boolean }
        generated_at: { type: string, nullable: true }
        engine: { type: string, nullable: true }
        regime: { type: string, nullable: true }
        honesty: { type: string }
        universe: { $ref: "#/components/schemas/DiscoveryUniverse" }
        scan: { $ref: "#/components/schemas/DiscoveryScan" }
        shadow: { $ref: "#/components/schemas/DiscoveryShadowSummary" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/DiscoveryCandidate" }

    DiscoveryUniverse:
      type: object
      required: [results_n, crypto, sectors]
      properties:
        results_n: { type: integer }
        crypto:
          type: object
          required: [status, count]
          properties:
            status: { type: string }
            count: { type: integer }
            fetched_at: { type: string, nullable: true }
        sectors:
          type: object
          required: [rising_n, symbols]
          properties:
            rising_n: { type: integer }
            symbols: { type: array, items: { type: string } }

    DiscoveryScan:
      type: object
      required: [cursor, signals_n, signal_symbols]
      properties:
        cursor: { type: integer }
        signals_n: { type: integer }
        signal_symbols: { type: array, items: { type: string } }

    DiscoveryShadowSummary:
      type: object
      description: Bu koşunun gölge defteri sayaçları + aktif izleme sayısı.
      required: [active_n, tracked_new, resolved, active]
      properties:
        active_n: { type: integer }
        tracked_new: { type: integer }
        resolved: { type: integer }
        active: { type: integer }

    DiscoveryCandidate:
      type: object
      description: >
        Bir aday — güncel "açılırdı" hükmü + biriken K-2 gölge karnesi. Tüm
        hipotetik: cf_win_rate = missed_win/(missed_win+avoided_loss), avg_r
        gerçekleşen hipotetik R (expired paydaya girmez).
      required: [symbol, kind, verdict, reasons, shadow_signals, shadow_resolved, shadow_timeframes]
      properties:
        symbol: { type: string }
        kind: { type: string }
        verdict: { type: string }
        entry_timeframe: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        expected_value: { type: number, nullable: true }
        rr: { type: number, nullable: true }
        direction_score: { type: number, nullable: true }
        reasons: { type: array, items: { type: string } }
        checked_at: { type: string, nullable: true }
        shadow_signals: { type: integer }
        shadow_resolved: { type: integer }
        missed_win: { type: integer }
        avoided_loss: { type: integer }
        cf_win_rate: { type: number, nullable: true }
        avg_r: { type: number, nullable: true }
        shadow_timeframes: { type: array, items: { type: string } }
        last_signal_at: { type: string, nullable: true }

    TfTargetsActionResult:
      type: object
      properties:
        approved: { type: boolean }
        rejected: { type: boolean }
        record:
          nullable: true
          type: object
          additionalProperties: true

    ConflictGateValidationReport:
      type: object
      description: >
        trade_profile (SCALP/INTRADAY/TACTICAL/SWING/POSITION) → route
        (open/open_reduced/manual_ready/block) → ConflictGateRouteStats.
        `_unmatched_no_shadow_data` ayrı bir tamsayı sayaçtır.
      properties:
        _unmatched_no_shadow_data: { type: integer }
      additionalProperties:
        type: object
        additionalProperties: { $ref: "#/components/schemas/ConflictGateRouteStats" }

    AgentBriefingHeadline:
      type: object
      description: Raporcu agent tek başlığı (deterministik; karar vermez).
      required: [tone, category, title]
      properties:
        tone: { type: string, enum: [ok, info, warn, alert] }
        category: { type: string }
        title: { type: string }
        detail: { type: string, nullable: true }

    AgentBriefingEngine:
      type: object
      description: Karar motorunun (tick worker) gerçek tazeliği — render zamanı değil.
      required: [status, stale]
      properties:
        status: { type: string }
        age_seconds: { type: number, nullable: true }
        cycle_count: { type: integer }
        stale: { type: boolean }

    AgentBriefingExecutive:
      type: object
      description: >
        Genel müdür → CEO brifingi. Deterministik sentez; tek cümle sonuç +
        kısa anlatı + tavsiye + önceliklendirilmiş risk bayrakları. Karar vermez.
      required: [stance, stance_label, tone, headline, narrative, recommendation, flags]
      properties:
        stance:
          type: string
          enum: [halt, stale, blocked, data_gap, signal, watching, calm]
        stance_label: { type: string }
        tone: { type: string, enum: [ok, info, warn, alert] }
        headline: { type: string }
        narrative: { type: string }
        recommendation: { type: string }
        flags:
          type: array
          items: { type: string }

    AgentBriefingDqs:
      type: object
      required: [score, status]
      properties:
        score: { type: number }
        status: { type: string }

    AgentBriefing:
      type: object
      description: >
        Raporcu agent — sistem state'ini her cycle tarayıp yönetici özeti +
        başlık başlık özet üretir. LLM gerektirmez; karar vermez (observer).
      required: [generated_at, headlines]
      properties:
        generated_at: { type: string }
        snapshot_id: { type: string, nullable: true }
        regime_label: { type: string, nullable: true }
        stale: { type: boolean }
        executive: { $ref: "#/components/schemas/AgentBriefingExecutive" }
        engine: { $ref: "#/components/schemas/AgentBriefingEngine" }
        dqs: { $ref: "#/components/schemas/AgentBriefingDqs" }
        headlines:
          type: array
          items: { $ref: "#/components/schemas/AgentBriefingHeadline" }

    GovernorProposalType:
      type: string
      enum: [WEIGHT_CHANGE, MODE_CHANGE, THRESHOLD_CHANGE, RISK_POLICY_CHANGE, DATA_PROVIDER_CHANGE, TF_TARGET_CHANGE, STRATEGY_ENABLE, STRATEGY_DISABLE, DASHBOARD_ALERT]

    GovernorProposalStatus:
