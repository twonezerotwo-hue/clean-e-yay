openapi: 3.1.0
info:
  title: Clean E-yAy API
  version: 2.0.0
  description: |
    Sözleşme-önce API. Pydantic ve TypeScript tipleri buradan üretilir.
    `make codegen` ile yenilenir. Manuel düzenleme yok.
servers:
  - url: http://127.0.0.1:8000
    description: Local dev
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/regime-report/current:
    get:
      operationId: getRegimeReportCurrent
      summary: En güncel rejim raporu
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegimeReport"

  /api/v1/dashboard/state:
    get:
      operationId: getDashboardState
      summary: Canonical dashboard state — risk gate + agent votes + module health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardState"

  /api/v1/ai-report/current:
    get:
      operationId: getAIReportCurrent
      summary: En güncel AI analist raporu (LLM özetli)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIReport"

  /api/v1/chat:
    post:
      operationId: postChat
      summary: v2.6 — state-grounded soru-cevap (LLM karar vermez, sadece açıklar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /api/v1/paper-trading/state:
    get:
      operationId: getPaperTradingState
      summary: Açık pozisyonlar + son tick PnL (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperTradingState"

  /api/v1/paper-trading/tick:
    post:
      operationId: postPaperTradingTick
      summary: Manuel tick (yan etkili — açma/kapatma yapabilir)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickResult"

  /api/v1/learning/summary:
    get:
      operationId: getLearningSummary
      summary: Walk-forward + kalibrasyon özeti
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSummary"

  /api/v1/risk/correlation:
    get:
      operationId: getRiskCorrelation
      summary: G4 — korelasyon matrisi + aynı yönlü cluster exposure (read-only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrelationState"

  /api/v1/risk/halts:
    get:
      operationId: getRiskHalts
      summary: G5 — aktif halt + timeline + daily-loss/max-DD gauge metrikleri
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaltsState"

  /api/v1/risk/halts/reset:
    post:
      operationId: postRiskHaltsReset
      summary: G5 — owner reset (tek manuel çıkış; otomatik reset yok)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaltResetResult"

  /api/v1/decision/matrix:
    get:
      operationId: getDecisionMatrix
      summary: T2 — (symbol × timeframe) karar matrisi; hücre rozetleri backend'de
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionMatrix"

components:
  schemas:
    Health:
      type: object
      required: [status, version, uptime_sec]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        uptime_sec: { type: number }

    SnapshotMeta:
      type: object
      required: [snapshot_id, generated_at]
      properties:
        snapshot_id: { type: string }
        generated_at: { type: string, format: date-time }
        dqs_score: { type: number, minimum: 0, maximum: 100 }
        fallback_used: { type: boolean }

    RegimeLayer:
      type: object
      required: [name, score, direction]
      properties:
        name: { type: string }
        score: { type: number }
        direction: { type: string, enum: [bullish, bearish, neutral] }
        evidence:
          type: array
          items: { type: string }

    AssetSignal:
      type: object
      required: [symbol, score, direction, status]
      properties:
        symbol: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        direction: { type: string, enum: [bullish, bearish, neutral] }
        status: { type: string, enum: [BLOCKING, PENDING, CONFIRMED] }
        confluence_aligned: { type: boolean }
        dominant_module: { type: string }
        win_rate_signal: { type: string, enum: [AVOID, NORMAL, BOOST, INSUFFICIENT_DATA] }

    RegimeReport:
      type: object
      required: [meta, regime_label, layers, assets]
      properties:
        meta: { $ref: "#/components/schemas/SnapshotMeta" }
        regime_label: { type: string, enum: [OFFENSIVE, NEUTRAL, DEFENSIVE, CRISIS] }
        layers:
          type: array
          items: { $ref: "#/components/schemas/RegimeLayer" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/AssetSignal" }
        headlines:
          type: array
          items: { $ref: "#/components/schemas/NewsHeadline" }
        catalysts:
          type: array
          items: { $ref: "#/components/schemas/Catalyst" }
        event_risk: { $ref: "#/components/schemas/EventRiskView" }

    NewsHeadline:
      type: object
      required: [id, source, ts, title]
      properties:
        id: { type: string }
        source: { type: string }
        region: { type: string }
        ts: { type: string, format: date-time }
        title: { type: string }
        title_tr: { type: string }
        sentiment: { type: string, enum: [bullish, bearish, neutral] }
        asset_impact:
          type: object
          additionalProperties: { type: number }
        # P0 — haber yalnızca bağlam; sembol etkisi varsa actionable, yoksa context-only.
        actionable: { type: boolean }
        freshness: { type: string, enum: [FRESH, RECENT, STALE] }

    Catalyst:
      type: object
      required: [id, ts, title]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        title: { type: string }
        importance: { type: string, enum: [low, medium, high, critical] }
        region: { type: string }
        hours_until: { type: number }
        days_until: { type: integer }
        # P0 — bu olayın tetiklediği event riski seviyesi (yalnızca kısıtlayıcı).
        event_level: { type: string, enum: [NONE, WATCH, NO_POSITION_INCREASE] }

    EventRiskView:
      type: object
      description: >
        P0 — Olay riski özeti. YALNIZCA kısıtlayıcı: yaklaşan doğrulanmış yüksek
        etkili takvim olayı yeni pozisyon açılışını kısar. RiskGate/DQS/KillSwitch/
        halt gate'lerini bypass etmez, size artırmaz.
      required: [level, restrictive]
      properties:
        level: { type: string, enum: [NONE, WATCH, NO_POSITION_INCREASE] }
        action: { type: string, enum: [WATCH, NO_POSITION_INCREASE], nullable: true }
        reason: { type: string }
        evidence:
          type: array
          items: { type: string }
        restrictive: { type: boolean }
        triggers:
          type: array
          items: { $ref: "#/components/schemas/EventRiskTrigger" }

    EventRiskTrigger:
      type: object
      required: [id, title, importance, level]
      properties:
        id: { type: string }
        title: { type: string }
        importance: { type: string }
        hours_until: { type: number }
        days_until: { type: integer, nullable: true }
        level: { type: string, enum: [WATCH, NO_POSITION_INCREASE] }

    RiskGate:
      type: object
      required: [action, reason]
      properties:
        action: { type: string, enum: [HOLD, WATCH, HEDGE_INCREASE, NO_POSITION_INCREASE, RISK_REDUCE, KILL_SWITCH] }
        reason: { type: string }
        evidence:
          type: array
          items: { type: string }

    AgentVote:
      type: object
      required: [persona, direction, confidence]
      properties:
        persona: { type: string, enum: [analyst, risk_officer, macro_strategist] }
        direction: { type: string, enum: [bullish, bearish, neutral] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        narrative: { type: string }

    ModuleHealth:
      type: object
      additionalProperties:
        type: object
        properties:
          status: { type: string, enum: [ok, degraded, down] }
          last_success_at: { type: string, format: date-time }
          notes: { type: string }

    DashboardState:
      type: object
      required: [meta, risk_gate, agent_votes, module_health]
      properties:
        meta: { $ref: "#/components/schemas/SnapshotMeta" }
        risk_gate: { $ref: "#/components/schemas/RiskGate" }
        agent_votes:
          type: array
          items: { $ref: "#/components/schemas/AgentVote" }
        quorum_reached: { type: boolean }
        module_health: { $ref: "#/components/schemas/ModuleHealth" }
        warnings:
          type: array
          items: { type: string }

    AIReport:
      type: object
      required: [meta, verdict, narrative]
      properties:
        meta: { $ref: "#/components/schemas/SnapshotMeta" }
        verdict: { type: string, enum: [bullish, bearish, neutral, no_trade] }
        narrative: { type: string }
        key_signals:
          type: array
          items: { type: string }
        token_usage:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }
            cached: { type: boolean }
        # v2.6 additive — persona katmanı (narrative-only; decision path'e yazmaz)
        no_actionable_decision: { type: boolean }
        timeframe_summary: { $ref: "#/components/schemas/TimeframeSummary" }
        personas:
          type: array
          items: { $ref: "#/components/schemas/PersonaSection" }
        llm: { $ref: "#/components/schemas/LLMMeta" }

    PersonaSection:
      type: object
      description: >
        v2.6 — persona bölümü. evidence_used HER ZAMAN backend'de
        deterministik doldurulur (LLM kanıt uyduramaz). source=fallback →
        LLM'siz deterministik narrative.
      required: [persona, title, summary]
      properties:
        persona: { type: string, enum: [analyst, risk_officer, macro_strategist] }
        title: { type: string }
        summary: { type: string }
        concerns:
          type: array
          items: { type: string }
        evidence_used:
          type: array
          items: { type: string }
        missing_data:
          type: array
          items: { type: string }
        actionability: { type: string }
        what_would_change_my_mind: { type: string }
        source: { type: string, enum: [llm, fallback] }
        model: { type: string, nullable: true }

    TimeframeSummary:
      type: object
      description: v2.6 — DecisionMatrix'in rapor özeti (TF farkları, candidate vs final, blocked_by, paper_action).
      properties:
        suspended: { type: boolean }
        lines:
          type: array
          items: { type: string }
        candidate_vs_final_diffs:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              timeframe: { $ref: "#/components/schemas/Timeframe" }
              candidate: { type: string }
              final: { type: string }
              blocked_by:
                type: array
                items: { type: string }
              reason: { type: string }
        blocked_by_reasons:
          type: array
          items: { type: string }
        paper_actions:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              timeframe: { $ref: "#/components/schemas/Timeframe" }
              paper_action: { type: string }

    LLMMeta:
      type: object
      description: v2.6 — LLM çağrı meta'sı; source=fallback → deterministik narrative.
      properties:
        mode: { type: string, enum: [off, mock, groq] }
        model: { type: string, nullable: true }
        source: { type: string, enum: [llm, fallback, guard] }
        fallback_reason: { type: string, nullable: true }
        cached: { type: boolean }
        tokens_used: { type: integer }

    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }

    ChatResponse:
      type: object
      description: >
        v2.6 — state-grounded yanıt. refused=true → injection/bypass guard
        devrede. evidence_used yanıtın dayandığı state kanıtları.
      required: [answer, refused]
      properties:
        answer: { type: string }
        refused: { type: boolean }
        evidence_used:
          type: array
          items: { type: string }
        snapshot_id: { type: string }
        llm: { $ref: "#/components/schemas/LLMMeta" }
        mode:
          type: object
          description: Provenance mode bloğu (LIVE/MOCK_MODE/SIMULATION/INSUFFICIENT_DATA).
          additionalProperties: true

    Position:
      type: object
      required: [id, symbol, side, entry_price, size_usd, opened_at]
      properties:
        id: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        entry_price: { type: number }
        current_price: { type: number }
        size_usd: { type: number }
        unrealized_pnl_usd: { type: number }
        sl: { type: number }
        tp: { type: number }
        opened_at: { type: string, format: date-time }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        valid_until:
          type: string
          format: date-time
          nullable: true
          description: T2 — TF time-stop; dolunca TIME_STOP_EXIT. null → time-stop yok.

    Trade:
      type: object
      required: [id, symbol, side, entry_price, exit_price, pnl_usd, opened_at, closed_at, close_reason]
      properties:
        id: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        entry_price: { type: number }
        exit_price: { type: number }
        pnl_usd: { type: number }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
        close_reason:
          type: string
          enum: [SL_HIT, TP_HIT, SIGNAL_REVERSAL, RISK_REDUCE, MANUAL, TIME_STOP_EXIT, KILL_SWITCH_EXIT]
        fingerprint: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }

    PaperTradingState:
      type: object
      required: [equity_usd, realized_pnl_usd, open_positions, recent_trades]
      properties:
        equity_usd: { type: number }
        realized_pnl_usd: { type: number }
        unrealized_pnl_usd: { type: number }
        max_drawdown_pct: { type: number }
        sharpe_30d: { type: number }
        open_positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        recent_trades:
          type: array
          items: { $ref: "#/components/schemas/Trade" }

    TickResult:
      type: object
      required: [tick_at, signals_processed, actions]
      properties:
        tick_at: { type: string, format: date-time }
        signals_processed: { type: integer }
        actions:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              action: { type: string, enum: [open, close, hold, blocked] }
              reason: { type: string }

    CalibrationBin:
      type: object
      required: [bin_lo, bin_hi, predicted, observed, count]
      properties:
        bin_lo: { type: number }
        bin_hi: { type: number }
        predicted: { type: number }
        observed: { type: number }
        count: { type: integer }

    LearningSummary:
      type: object
      required: [total_trades, win_rate, calibration]
      properties:
        total_trades: { type: integer }
        win_rate: { type: number }
        sharpe: { type: number }
        sortino: { type: number }
        max_dd_pct: { type: number }
        walk_forward:
          type: object
          properties:
            train_window: { type: integer }
            test_window: { type: integer }
            test_sharpe: { type: number }
            test_win_rate: { type: number }
        calibration:
          type: array
          items: { $ref: "#/components/schemas/CalibrationBin" }
        module_skew:
          type: object
          additionalProperties: { type: number }
        weights_version: { type: string }

    CorrelationEntry:
      type: object
      required: [symbol_a, symbol_b, rho, source, samples]
      properties:
        symbol_a: { type: string }
        symbol_b: { type: string }
        rho: { type: number }
        source: { type: string, enum: [computed, baseline, neutral] }
        samples: { type: integer }

    ExposureCluster:
      type: object
      required: [symbols, positions, total_usd, cluster_pct, status]
      properties:
        symbols:
          type: array
          items: { type: string }
        positions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              symbol: { type: string }
              side: { type: string, enum: [long, short] }
              size_usd: { type: number }
        total_usd: { type: number }
        cluster_pct: { type: number }
        status: { type: string, enum: [OK, WARNING, BREACH] }

    CorrelationState:
      type: object
      required: [threshold, max_cluster_pct, symbols, matrix, clusters]
      properties:
        threshold: { type: number }
        max_cluster_pct: { type: number }
        window_days: { type: integer }
        min_overlap_days: { type: integer }
        symbols:
          type: array
          items: { type: string }
        matrix:
          type: array
          items: { $ref: "#/components/schemas/CorrelationEntry" }
        clusters:
          type: array
          items: { $ref: "#/components/schemas/ExposureCluster" }
        open_position_count: { type: integer }
        equity_usd: { type: number }
        insufficient_pairs:
          type: array
          items: { type: string }

    HaltEvent:
      type: object
      required: [id, type, level, started_at, reason, active]
      properties:
        id: { type: string }
        type: { type: string, enum: [DAILY_LOSS, MAX_DRAWDOWN] }
        level: { type: string, enum: [KILL_SWITCH, RISK_REDUCE] }
        started_at: { type: string, format: date-time }
        reason: { type: string }
        evidence:
          type: array
          items: { type: string }
        active: { type: boolean }
        cleared_at: { type: string, format: date-time, nullable: true }
        cleared_by: { type: string, nullable: true }

    HaltMetrics:
      type: object
      required: [equity_usd, daily_pnl_usd, daily_loss_limit_usd, daily_loss_ratio, drawdown_pct, max_drawdown_pct, drawdown_ratio]
      properties:
        equity_usd: { type: number }
        peak_equity_usd: { type: number }
        daily_pnl_usd: { type: number }
        daily_loss_limit_usd: { type: number }
        daily_loss_ratio: { type: number }
        drawdown_pct: { type: number }
        max_drawdown_pct: { type: number }
        drawdown_ratio: { type: number }

    HaltsState:
      type: object
      required: [halt_active, active, timeline, metrics]
      properties:
        halt_active: { type: boolean }
        active:
          type: array
          items: { $ref: "#/components/schemas/HaltEvent" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/HaltEvent" }
        metrics: { $ref: "#/components/schemas/HaltMetrics" }
        reset_hint: { type: string }

    HaltResetResult:
      type: object
      required: [cleared_count, cleared]
      properties:
        cleared_count: { type: integer }
        cleared:
          type: array
          items: { $ref: "#/components/schemas/HaltEvent" }

    Timeframe:
      type: string
      enum: ["15m", "1h", "4h", "1d", "1w"]
      default: "1d"
      description: T0 — sinyal uzayı (symbol, timeframe) ile anahtarlanır.

    CatalystImpact:
      type: object
      description: >
        T0 contract seed — half-life motoru v2.7 deep data ile implement
        edilir. Şimdilik hiçbir endpoint üretmez/tüketmez.
      required: [catalyst_id, event_type]
      properties:
        catalyst_id: { type: string }
        event_type: { type: string }
        surprise_level: { type: number, minimum: -1, maximum: 1 }
        affected_assets:
          type: array
          items: { type: string }
        expected_half_life_minutes: { type: integer }
        affected_timeframes:
          type: array
          items: { $ref: "#/components/schemas/Timeframe" }
        timeframe_bias:
          type: object
          additionalProperties: { type: string, enum: [bullish, bearish, neutral] }
        valid_until: { type: string, format: date-time, nullable: true }
        decay_curve: { type: string, enum: [exponential, linear, step] }
        confidence: { type: number, minimum: 0, maximum: 1 }

    TimeframeDecision:
      type: object
      description: >
        T2 — matrix hücresi. candidate_action = consensus niyeti
        (gate'lerden önce); action = final karar; blocked_by hangi kapının
        kestiğini söyler. Rozet (status) backend'de hesaplanır.
      required: [symbol, timeframe, action]
      properties:
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        action: { type: string, enum: [open_long, open_short, hold, blocked, watch] }
        candidate_action: { type: string, enum: [open_long, open_short, hold, blocked, watch] }
        score: { type: number }
        direction: { type: string, enum: [bullish, bearish, neutral] }
        confidence: { type: number }
        size_multiplier: { type: number }
        reason: { type: string }
        blocked_by:
          type: array
          items: { type: string }
        actionable: { type: boolean }
        status: { type: string, enum: [ACTIONABLE, NOT_ACTIONABLE, SUSPENDED] }
        paper_action: { type: string, enum: [open_long, open_short, none] }

    DecisionMatrix:
      type: object
      description: T2 — symbol × timeframe karar matrisi ViewModel.
      required: [generated_at, symbols, timeframes, cells]
      properties:
        generated_at: { type: string, format: date-time }
        symbols:
          type: array
          items: { type: string }
        timeframes:
          type: array
          items: { $ref: "#/components/schemas/Timeframe" }
        regime: { type: string }
        risk_gate:
          type: object
          properties:
            action: { type: string }
            reason: { type: string }
            evidence:
              type: array
              items: { type: string }
        dqs_status: { type: string, enum: [OK, DEGRADED, BLOCKED] }
        suspended:
          type: boolean
          description: KILL_SWITCH / RISK_REDUCE / NO_POSITION_INCREASE / DQS BLOCKED → tüm hücreler SUSPENDED.
        event_risk: { $ref: "#/components/schemas/EventRiskView" }
        cells:
          type: array
          items: { $ref: "#/components/schemas/TimeframeDecision" }

    OHLCVBar:
      type: object
      description: T1 — tek mum; ts = bar açılış zamanı (UTC).
      required: [symbol, timeframe, ts, open, high, low, close]
      properties:
        symbol: { type: string }
        timeframe: { $ref: "#/components/schemas/Timeframe" }
        ts: { type: string, format: date-time }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number, nullable: true }
