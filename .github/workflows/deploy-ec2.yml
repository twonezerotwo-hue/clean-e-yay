name: Deploy EC2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: [self-hosted, clean-e-yay-ec2]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Run local deploy on EC2
        env:
          # T2 — API yazma-istekleri kilidi. Repo Settings → Secrets → Actions
          # altinda API_AUTH_TOKEN tanimlanmadikca bos gecer (kilit kapali kalir).
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          # Benzinga haber API anahtari (owner, 2026-11-13). Secret yoksa bos gecer,
          # haber saglayicisi kapali kalir.
          BENZINGA_API_KEY: ${{ secrets.BENZINGA_API_KEY }}
          # Yedek fiyat zinciri anahtarlari (owner, 2026-11-23). Secret yoksa bos
          # gecer, ilgili yedek kaynak kapali kalir.
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Resmi makro kaynak anahtarlari (owner, 2026-11-25): FRED, EIA, BLS. Secret
          # yoksa bos gecer, ilgili kaynak kapali kalir.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: /opt/clean-e-yay/scripts/deploy-from-github.sh
