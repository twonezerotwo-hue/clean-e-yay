name: Deploy EC2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: [self-hosted, clean-e-yay-ec2]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Run local deploy on EC2
        env:
          # T2 — API yazma-istekleri kilidi. Repo Settings → Secrets → Actions
          # altinda API_AUTH_TOKEN tanimlanmadikca bos gecer (kilit kapali kalir).
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
        run: /opt/clean-e-yay/scripts/deploy-from-github.sh
