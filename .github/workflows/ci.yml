name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pytest fastapi httpx pydantic pyyaml
      - run: ruff check packages apps/api apps/tick_worker apps/learning_worker apps/supervisor
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pnpm install --no-frozen-lockfile
      # Sözleşme-önce (Iron Law #4): openapi.yaml -> TS tipleri senkron olmalı.
      # Python job'unda node olmadığı için bu kontrol orada skip ediliyordu.
      - name: Contract drift (openapi -> TS)
        working-directory: .
        run: python3 scripts/codegen.py --check
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
