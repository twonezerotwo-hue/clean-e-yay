[project]
name = "clean-e-yay"
version = "2.0.0"
description = "Clean rewrite of E_YAY CODEX — paper-trading decision-support with calibrated heuristic learning"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["contracts/codegen", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
