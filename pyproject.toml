[project]
name = "clean-e-yay"
version = "2.0.0"
description = "Clean rewrite of E_YAY CODEX — paper-trading decision-support with calibrated heuristic learning"
requires-python = ">=3.11"
readme = "README.md"
# Runtime dependencies the backend imports directly. Versions pinned to known-good
# floors; upgrades stay non-breaking by contract-first (openapi → codegen) discipline.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

# This repo runs from PYTHONPATH=repo_root (apps/ + packages/ as top-level imports).
# It is NOT pip-packaged — `pip install -e .` is used only to resolve runtime deps,
# not to make `apps`/`packages` installable. Tell setuptools to skip discovery.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["contracts/codegen", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# RUF001/002/003: Türkçe karakterleri (ı, ş, ğ, ö, ç) "ambiguous" sayar — kapatıyoruz.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
