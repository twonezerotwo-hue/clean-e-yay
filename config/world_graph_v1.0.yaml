# Static topology only.  This file does not describe today's conflict status;
# it records bounded, reviewable capabilities and dependencies used to expand
# verified events into causal hypotheses.  Runtime headlines remain the only
# source of current event severity.
version: "world-graph-v1.0"
entities:
  - id: country:yemen
    type: COUNTRY
    name: Yemen
    aliases: [yemen, yemeni]
    attributes: {region: red_sea, asset_symbols: [BRENT], factor_channels: [shipping_risk, energy_supply_risk, trade_risk]}
  - id: actor:houthi
    type: MILITARY_GROUP
    name: Houthi movement
    aliases: [houthi, houthis, ansar allah]
