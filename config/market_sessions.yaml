# Global market sessions / exchange opening hours.
#
# Backend owns market-session meaning (frontend renders only). The engine reads
# this config + the market's local timezone (DST-correct via stdlib zoneinfo) to
# derive open/close, session phase and gating context.
#
# `kind`:
#   exchange        — a real exchange with a regular weekday session. Holidays /
#                     early closes are verified ONLY when an exchange-calendar
#                     library is installed (pandas_market_calendars /
#                     exchange_calendars). Without it the engine falls back to
#                     regular weekday sessions, marks holiday_verified=false and
#                     emits diagnostic `exchange_calendar_missing:<exchange>`.
#   continuous      — 24/7 market (crypto). No holidays; always open.
#   futures_global  — near-24h futures (energy/metals). Without a futures calendar
#                     the engine uses a broad weekday session, holiday_verified=
#                     false, diagnostic `exchange_calendar_missing:<exchange>`.
#
# regular_open / regular_close are LOCAL times in the market's timezone (HH:MM).
# Tokyo's lunch break is intentionally not modelled (treated as one session).

session_thresholds:
  opening_pre_minutes: 15      # closed-but-imminent: opening_window starts 15m before open
  opening_post_minutes: 30     # opening_window lasts 30m after open
  closing_pre_minutes: 30      # closing_window starts 30m before close
  pre_open_watch_minutes: 120  # closed but next open within 120m -> pre_open

markets:
