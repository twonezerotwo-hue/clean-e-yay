version: "1.0.0"
created_at: "2026-06-11"
description: |
  Consensus module weights per regime. Auto-tuned versions are written as
  weights_v1.x.yaml. Baseline must not be mutated in place — audit trail.

regimes:
  OFFENSIVE:
    touche: 0.30
    fundamental: 0.20
    news: 0.15
    sentinel: 0.10
    quantum: 0.15
    chart_pattern: 0.10
  NEUTRAL:
    touche: 0.25
    fundamental: 0.25
    news: 0.15
    sentinel: 0.15
    quantum: 0.10
    chart_pattern: 0.10
  DEFENSIVE:
    touche: 0.15
    fundamental: 0.25
    news: 0.15
    sentinel: 0.30
    quantum: 0.10
    chart_pattern: 0.05
  CRISIS:
    touche: 0.10
    fundamental: 0.15
    news: 0.10
    sentinel: 0.50
    quantum: 0.10
    chart_pattern: 0.05

constraints:
  min_module_floor: 0.02
  max_delta_per_module: 0.03
  max_total_drift: 0.10

# Step 8 — per-strategy timeframe weights (PRIOR). Consensus may weight TF signals
# by strategy; these START as PRIOR and stay untrusted until per-TF calibration
# validates them (packages/learning/tf_calibration.py — "don't trust weights until
# calibration validates"). Attribution-based auto-tune is deferred, not faked.
tf_weights:
  swing:    { d1: 0.50, h4: 0.35, h1: 0.15, m15: 0.00 }
  intraday: { d1: 0.15, h4: 0.35, h1: 0.35, m15: 0.15 }
  scalp:    { d1: 0.00, h4: 0.15, h1: 0.35, m15: 0.50 }
