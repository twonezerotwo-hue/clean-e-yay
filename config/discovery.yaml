# Keşif motoru (K serisi) — "analiz sabit, varlık değişken".
# Owner kararları 2026-07-04: kripto top-50; hisse/ETF sektör-güdümlü;
# v1 aday = yükselen sektörün ETF'si (yalnız LONG); sektör ETF'leri likidite
# rotasyonuna EKLENMEZ (canlı konsensüs korunur — bu ayrı bir alt katmandır).
#
# Çalışma DISCOVERY_SCAN_ENABLED env flag'ine bağlıdır (DEFAULT OFF) —
# kapalıyken hiçbir tarama/yazım olmaz, learning koşusu bayt-eşdeğerdir.
# NOT: kripto evreni + tarama kotası bölümleri K-1 diliminde (okuyucu kodla
# BİRLİKTE) eklenir — okunmayan config anahtarı bırakılmaz (Kural 2 / M6).
version: "1.0.0"

# K-1 — kripto evreni (owner kararı: top-50). API bütçesi dürüstlüğü:
# CoinGecko ücretsiz plan aylık ~10k çağrı ve canlı sistem (BTC/ETH OHLCV)
# bunu ZATEN kullanıyor. Bu yüzden 50 coin'e kör OHLCV ÇEKİLMEZ: tek
# `markets` liste çağrısı (50 coin'in fiyat+momentum verisi tek cevapta)
# ön-süzgeçtir; tam analiz yalnız kısa listeye (shortlist_n) yapılır.
crypto:
  top_n: 50
  # 24s hacmi bunun altındaki coin aday olamaz (likidite tabanı).
  min_total_volume_usd: 20000000
  # Tam analiz kısa listesi: momentum (0.6×30g + 0.4×7g, yalnız pozitif —
  # v1 LONG-only) sıralamasının ilk N'i.
  shortlist_n: 5
  # markets liste çağrısı önbelleği (sn) — saatte 1 liste yeter.
  markets_ttl_sec: 3600

# K-1 — tarama adımı: learning worker koşusu başına bütçe.
scan:
  interval_sec: 900     # tarayıcı en sık 15 dk'da bir koşar
  per_run: 5            # koşu başına tam-analiz aday kotası (round-robin)
  min_bars: 60          # TF başına asgari doğrulanmış bar (altı NO_DATA)
  # Aday yeniden-analiz tazeliği (sn): sonucu bundan taze aday ATLANIR.
  # Kritik API-bütçe kapısı — learning worker tek-seferlik süreç olduğundan
  # CoinGecko'nun bellek-içi TTL cache'i koşular arası YAŞAMAZ; bu kapı
  # olmadan kripto adayları 30 dk'da bir gerçek çağrıyla taranırdı
  # (~14k çağrı/ay = limit aşımı). 4 saat: ~60 çağrı/gün, bütçeye sığar.
  result_ttl_sec: 14400

# K-2 — gölge kanıt defteri: "açılırdı" hükmü TP/SL'e değmeden bu süreyi
# aşarsa "expired" (net sonuç yok, karneye girmez). missed_opportunity TTL
# tablosuyla aynı değerler (keşifte 15m/1w dilimi yok).
shadow:
  ttl_hours:
    "1h": 24
    "4h": 72
    "1d": 240

# K-4 — terfi kriteri: bir adayın gölge karnesi bu eşikleri geçerse governor
# defterine OWNER ÖNERİ paketi olur (custom_assets'e ekleme ÖNERİSİ; OTOMATİK
# ekleme YOK — kırmızı çizgi). F5-2 champion/challenger deseninin aday-evrenine
# uyarlaması. cf_win_rate %95 Wilson ALT sınırı > 0.5 sabit kriterdir (şans
# değil kanıtı); aşağıdakiler owner-ayarlanabilir hacim/çeşitlilik eşikleri.
promotion:
  min_resolved_decisive: 20   # ≥20 çözülmüş kararlı sinyal (missed_win+avoided_loss; expired hariç)
  min_timeframes: 2           # ≥2 farklı TF'de sinyal (tek-TF şansı elenir)

# Emtia evreni (owner kararı 2026-10-05). Yahoo vadeli kontrat/ETF ticker'ları
# (mevcut ohlcv/yfinance.fetch_by_ticker). Sıralama: günlük barlardan 30g/7g
# momentum harmanı (kripto kısa listesiyle aynı mantık; yalnız pozitif → LONG-only).
# API bütçesi: ranking_ttl_sec içinde liste yeniden kullanılır (saatte ~14 çağrı).
# Canlı evrendeki XAU/XAG/BRENT burada TEKRAR EDİLMEZ. keywords: haber eşlemesi
# (kelime sınırıyla aranır; "mısır" Türkçede ülke adı da olduğu için kullanılmaz).
commodities:
  shortlist_n: 4
  ranking_ttl_sec: 3600
  items:
    COPPER:    { ticker: "HG=F", label: "Bakır",          keywords: ["copper", "bakır"] }
    NATGAS:    { ticker: "NG=F", label: "Doğalgaz",       keywords: ["natural gas", "lng", "henry hub", "doğalgaz"] }
    WTI:       { ticker: "CL=F", label: "WTI petrol",     keywords: ["wti", "crude oil", "oil prices", "ham petrol"] }
    PLATINUM:  { ticker: "PL=F", label: "Platin",         keywords: ["platinum", "platin"] }
    PALLADIUM: { ticker: "PA=F", label: "Paladyum",       keywords: ["palladium", "paladyum"] }
    WHEAT:     { ticker: "ZW=F", label: "Buğday",         keywords: ["wheat", "buğday"] }
    CORN:      { ticker: "ZC=F", label: "Mısır (tahıl)",  keywords: ["corn"] }
    SOYBEAN:   { ticker: "ZS=F", label: "Soya",           keywords: ["soybean", "soybeans", "soya"] }
    COFFEE:    { ticker: "KC=F", label: "Kahve",          keywords: ["coffee", "arabica", "kahve"] }
    SUGAR:     { ticker: "SB=F", label: "Şeker",          keywords: ["sugar prices", "raw sugar", "şeker fiyat"] }
    COCOA:     { ticker: "CC=F", label: "Kakao",          keywords: ["cocoa", "kakao"] }
    COTTON:    { ticker: "CT=F", label: "Pamuk",          keywords: ["cotton", "pamuk"] }
    URANIUM:   { ticker: "URA",  label: "Uranyum (ETF)",  keywords: ["uranium", "uranyum"] }
    LITHIUM:   { ticker: "LIT",  label: "Lityum (ETF)",   keywords: ["lithium", "lityum"] }

# Haber güdümlü keşif (owner kararı 2026-10-05, ikinci tur) — packages/discovery/news_discovery.py.
# SALT-GÖZLEM: tüm haber akışından yerel YZ (Ollama) olay → sonuç → etkilenen varlık
# çıkarır; sembol Yahoo'da doğrulanır (var mı, tür, ad, likidite). İşlem evrenine girmez.
# YZ yalnız yerelde koşar, ortak LLM bütçesini harcamaz; yerel model yoksa adım atlanır.
news_discovery:
  enabled: true
  feed_refresh_min: 15          # ham akış yenileme (tüm RSS + konu kaynakları)
  per_feed: 15                  # kaynak başına başlık
  max_headline_age_hours: 12
  headlines_per_call: 15        # bir YZ çağrısında taranan başlık (ölçüm: ~12 sn)
  calls_per_run: 1              # öğrenme turu başına (5 dk) → saatte ~180 başlık
  max_calls_per_day: 300
  max_output_tokens: 700
  max_events_per_call: 4
  max_assets_per_event: 3
  max_new_resolutions_per_run: 12  # Yahoo doğrulama çağrısı sınırı (önbellekli; artan sonraki tura)
  candidate_ttl_hours: 72
  half_life_hours: 24
  max_candidates: 15
  min_scan_strength: 20         # teknik analize girmek için en düşük haber gücü (yukarı yön)
  min_dollar_volume: 5000000    # hisse/ETF/kripto günlük işlem hacmi alt sınırı ($)
  # Konu kaynakları — 2026-10-05'te repo'nun kendi fetch+parse'ıyla canlı test edildi
  # (hepsi taze başlık döndürdü; DATA_POLICY: çalışmayan eklenmez).
  extra_feeds:
    - { source: "Tarım", url: "https://news.google.com/rss/search?q=when:1d+(drought+OR+harvest+OR+crop+OR+frost)+(wheat+OR+corn+OR+coffee+OR+cocoa+OR+sugar+OR+soybean)&hl=en-US&gl=US&ceid=US:en" }
    - { source: "Madencilik", url: "https://news.google.com/rss/search?q=when:1d+(mine+OR+mining+OR+smelter+OR+strike)+(copper+OR+lithium+OR+nickel+OR+cobalt+OR+aluminum+OR+uranium)&hl=en-US&gl=US&ceid=US:en" }
    - { source: "Enerji arzı", url: "https://news.google.com/rss/search?q=when:1d+(OPEC+OR+refinery+OR+pipeline+OR+LNG)+(outage+OR+supply+OR+output)&hl=en-US&gl=US&ceid=US:en" }
    - { source: "Nakliye", url: "https://news.google.com/rss/search?q=when:1d+(shipping+OR+freight+OR+port+OR+%22supply+chain%22)+(disruption+OR+strike+OR+closure)&hl=en-US&gl=US&ceid=US:en" }
    - { source: "Yarı iletken", url: "https://news.google.com/rss/search?q=when:1d+(semiconductor+OR+chip)+(export+OR+ban+OR+shortage+OR+tariff)&hl=en-US&gl=US&ceid=US:en" }
    - { source: "İlaç", url: "https://news.google.com/rss/search?q=when:1d+(FDA+approval+OR+drug+trial+OR+outbreak)&hl=en-US&gl=US&ceid=US:en" }
    - { source: "Ticaret politikası", url: "https://news.google.com/rss/search?q=when:1d+(tariff+OR+sanctions+OR+%22export+ban%22)&hl=en-US&gl=US&ceid=US:en" }
    - { source: "Google Business", url: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-US&gl=US&ceid=US:en" }

# Haber → karar GÖLGE girdisi (owner kararı 2026-10-05, üçüncü tur) —
# packages/discovery/news_decision_shadow.py. Canlı aday işlem × haber öngörüsü
# teyit/çelişki fiyatla çözülür. ETKİSİZ: affect_decision kodda sabit false; karara
# bağlanması karne + owner onayı ister (CP5).
news_decision_shadow:
  enabled: true
  min_strength: 20        # bu güçten zayıf haber öngörüsü sayılmaz
  horizons_hours: [4, 24]
  dedupe_hours: 4         # aynı sembol/TF/yön/ilişki için tekrar damgalama aralığı
  flat_pct: 0.1

# İnceleme tavsiyesi bildirimi (owner kararı 2026-10-05, üçüncü tur) — packages/discovery/ideas.py.
# Haberden bulunmuş fikir + haber öngörüsü yukarı (güç ≥ min_news_strength) + teknik
# WOULD_OPEN_LONG → zil + anlık uyarı; varlık başına cooldown_hours'ta bir. İşlem önerisi değildir.
review:
  min_news_strength: 40
  cooldown_hours: 24

# Haber öngörüsü (owner kararı 2026-10-05) — packages/discovery/news_forecast.py.
# SALT-GÖZLEM: karar/boyut/RiskGate'e girmez; fikir panosu + öngörü karnesi besler.
# Başlıklar: son snapshot'ların doğrulanmış RSS başlıkları + sınırlı web araması
# (Tavily; en güçlü adaylar, aday başına min_interval_hours'da bir).
# Ağırlık: kaynak güvenilirliği (news_event_study kova isabeti) × tazelik (yarı-ömür).
news_forecast:
  window_hours: 72
  half_life_hours: 24
  snapshots_per_run: 12
  min_track_strength: 25      # karneye yazılacak en zayıf yönlü öngörü (0-100)
  resolve_hours: [4, 24, 72]
  web_search:
    max_assets_per_run: 5
    min_interval_hours: 6
    max_results: 5
  sector_keywords:
    XLK:  ["tech stocks", "technology stocks", "chipmakers", "semiconductor stocks", "chip stocks"]
    XLE:  ["energy stocks", "oil stocks", "oil majors"]
    XLF:  ["bank stocks", "banking stocks", "financial stocks", "lenders"]
    XLV:  ["healthcare stocks", "pharma stocks", "drugmakers", "biotech stocks"]
    XLI:  ["industrial stocks", "industrials", "manufacturing activity"]
    XLY:  ["consumer discretionary", "retail stocks", "retailers"]
    XLP:  ["consumer staples", "staples stocks"]
    XLU:  ["utility stocks", "utilities stocks"]
    XLB:  ["materials stocks", "chemical stocks", "miners"]
    XLRE: ["real estate stocks", "reits", "property stocks"]
    XLC:  ["communication services", "media stocks", "telecom stocks"]
    IYT:  ["transport stocks", "airlines", "railroads", "trucking stocks"]

sector_rotation:
  # Göreli güç kıyas çıpası (assets.yaml'daki S&P 500 — OHLCV'de zaten var).
  benchmark: SP500
  # Motor koşum aralığı (sn) — sektörler dakikada bir dönmez; saatte 1 yeter.
  interval_sec: 3600
  # Hüküm eşiği: bileşik göreli-güç skoru bu yüzdenin üstünde → RISING,
  # altında (−) → FALLING, arada → NEUTRAL.
  verdict_threshold_pct: 1.0
  # Karne çözüm ufku: damgadan ~5 işlem günü (7 takvim günü) sonra hüküm
  # gerçekleşen göreli getiriyle kıyaslanır. NEUTRAL puanlanmaz (F1-2 ilkesi).
  resolve_after_days: 7
  # Çözümlenemeden bu yaşı aşan damga düşürülür (süresiz bekleme olmaz).
  pending_max_age_days: 30
  # 12 sektör ETF'si (Yahoo ticker = sembol; OHLCV yfinance haritasında).
  sectors:
    XLK:  { label: "Teknoloji" }
    XLE:  { label: "Enerji" }
    XLF:  { label: "Finans" }
    XLV:  { label: "Sağlık" }
    XLI:  { label: "Sanayi" }
    XLY:  { label: "Tüketim (seçmeli)" }
    XLP:  { label: "Tüketim (temel)" }
    XLU:  { label: "Altyapı" }
    XLB:  { label: "Hammadde" }
    XLRE: { label: "Emlak" }
    XLC:  { label: "İletişim" }
    IYT:  { label: "Ulaşım" }
