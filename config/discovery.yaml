# Keşif motoru (K serisi) — "analiz sabit, varlık değişken".
# Owner kararları 2026-07-04: kripto top-50; hisse/ETF sektör-güdümlü;
# v1 aday = yükselen sektörün ETF'si (yalnız LONG); sektör ETF'leri likidite
# rotasyonuna EKLENMEZ (canlı konsensüs korunur — bu ayrı bir alt katmandır).
#
# Çalışma DISCOVERY_SCAN_ENABLED env flag'ine bağlıdır (DEFAULT OFF) —
# kapalıyken hiçbir tarama/yazım olmaz, learning koşusu bayt-eşdeğerdir.
# NOT: kripto evreni + tarama kotası bölümleri K-1 diliminde (okuyucu kodla
# BİRLİKTE) eklenir — okunmayan config anahtarı bırakılmaz (Kural 2 / M6).
version: "1.0.0"

# K-1 — kripto evreni (owner kararı: top-50). API bütçesi dürüstlüğü:
# CoinGecko ücretsiz plan aylık ~10k çağrı ve canlı sistem (BTC/ETH OHLCV)
# bunu ZATEN kullanıyor. Bu yüzden 50 coin'e kör OHLCV ÇEKİLMEZ: tek
# `markets` liste çağrısı (50 coin'in fiyat+momentum verisi tek cevapta)
# ön-süzgeçtir; tam analiz yalnız kısa listeye (shortlist_n) yapılır.
crypto:
  top_n: 50
  # 24s hacmi bunun altındaki coin aday olamaz (likidite tabanı).
  min_total_volume_usd: 20000000
  # Tam analiz kısa listesi: momentum (0.6×30g + 0.4×7g, yalnız pozitif —
  # v1 LONG-only) sıralamasının ilk N'i.
  shortlist_n: 5
  # markets liste çağrısı önbelleği (sn) — saatte 1 liste yeter.
  markets_ttl_sec: 3600

# K-1 — tarama adımı: learning worker koşusu başına bütçe.
scan:
  interval_sec: 900     # tarayıcı en sık 15 dk'da bir koşar
  per_run: 5            # koşu başına tam-analiz aday kotası (round-robin)
  min_bars: 60          # TF başına asgari doğrulanmış bar (altı NO_DATA)
  # Aday yeniden-analiz tazeliği (sn): sonucu bundan taze aday ATLANIR.
  # Kritik API-bütçe kapısı — learning worker tek-seferlik süreç olduğundan
  # CoinGecko'nun bellek-içi TTL cache'i koşular arası YAŞAMAZ; bu kapı
  # olmadan kripto adayları 30 dk'da bir gerçek çağrıyla taranırdı
  # (~14k çağrı/ay = limit aşımı). 4 saat: ~60 çağrı/gün, bütçeye sığar.
  result_ttl_sec: 14400

# K-2 — gölge kanıt defteri: "açılırdı" hükmü TP/SL'e değmeden bu süreyi
# aşarsa "expired" (net sonuç yok, karneye girmez). missed_opportunity TTL
# tablosuyla aynı değerler (keşifte 15m/1w dilimi yok).
shadow:
  ttl_hours:
    "1h": 24
    "4h": 72
    "1d": 240

# K-4 — terfi kriteri: bir adayın gölge karnesi bu eşikleri geçerse governor
# defterine OWNER ÖNERİ paketi olur (custom_assets'e ekleme ÖNERİSİ; OTOMATİK
# ekleme YOK — kırmızı çizgi). F5-2 champion/challenger deseninin aday-evrenine
# uyarlaması. cf_win_rate %95 Wilson ALT sınırı > 0.5 sabit kriterdir (şans
# değil kanıtı); aşağıdakiler owner-ayarlanabilir hacim/çeşitlilik eşikleri.
promotion:
  min_resolved_decisive: 20   # ≥20 çözülmüş kararlı sinyal (missed_win+avoided_loss; expired hariç)
  min_timeframes: 2           # ≥2 farklı TF'de sinyal (tek-TF şansı elenir)

sector_rotation:
  # Göreli güç kıyas çıpası (assets.yaml'daki S&P 500 — OHLCV'de zaten var).
  benchmark: SP500
  # Motor koşum aralığı (sn) — sektörler dakikada bir dönmez; saatte 1 yeter.
  interval_sec: 3600
  # Hüküm eşiği: bileşik göreli-güç skoru bu yüzdenin üstünde → RISING,
  # altında (−) → FALLING, arada → NEUTRAL.
  verdict_threshold_pct: 1.0
  # Karne çözüm ufku: damgadan ~5 işlem günü (7 takvim günü) sonra hüküm
  # gerçekleşen göreli getiriyle kıyaslanır. NEUTRAL puanlanmaz (F1-2 ilkesi).
  resolve_after_days: 7
  # Çözümlenemeden bu yaşı aşan damga düşürülür (süresiz bekleme olmaz).
  pending_max_age_days: 30
  # 12 sektör ETF'si (Yahoo ticker = sembol; OHLCV yfinance haritasında).
  sectors:
    XLK:  { label: "Teknoloji" }
    XLE:  { label: "Enerji" }
    XLF:  { label: "Finans" }
    XLV:  { label: "Sağlık" }
    XLI:  { label: "Sanayi" }
    XLY:  { label: "Tüketim (seçmeli)" }
    XLP:  { label: "Tüketim (temel)" }
    XLU:  { label: "Altyapı" }
    XLB:  { label: "Hammadde" }
    XLRE: { label: "Emlak" }
    XLC:  { label: "İletişim" }
    IYT:  { label: "Ulaşım" }
