version: "1.0.0"
created_at: "2026-06-11"
description: |
  Veri kaynakları kaydı. Her kaynak `decision_usage` ile etiketlenir:
  - verified_required: stratejik karar için zorunlu
  - simulation_only: paper trading için yeterli, gerçek kararda gate
  - analytics_only: sadece raporlama

  Runtime yönlendirme için tek kaynak provider modülleridir:
  `packages/data/providers/price/*` ve `packages/data/providers/news/rss.py`.
  Bu dosya politika/provenance kaydıdır; aşağıdaki feed listesi örnek değil,
  karar politikasına giren kaynak ailelerini tanımlar. Tam güncel feed sayısı
  snapshot `news_consensus.feed_inventory` alanından okunur.

sources:
  - id: btcusd_coingecko
    kind: price
    asset: BTCUSD
    fetcher: coingecko
    cadence_sec: 180
    decision_usage: verified_required
    fallback_to_mock: false

  - id: ethusd_coingecko
    kind: price
    asset: ETHUSD
    fetcher: coingecko
    cadence_sec: 180
    decision_usage: verified_required
    fallback_to_mock: false

