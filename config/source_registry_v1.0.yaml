version: "1.0.0"
created_at: "2026-06-11"
description: |
  Veri kaynakları kaydı. Her kaynak `decision_usage` ile etiketlenir:
  - verified_required: stratejik karar için zorunlu
  - simulation_only: paper trading için yeterli, gerçek kararda gate
  - analytics_only: sadece raporlama

  Runtime yönlendirme için tek kaynak provider modülleridir:
  `packages/data/providers/*`. Bu dosya politika/provenance kaydıdır; aşağıdaki
  envanter runtime modüllerinin gerçek kaynağını ve beklenen sayısını gösterir.
  Snapshot `news_consensus.feed_inventory` alanı aynı kayıtları canlı sayar.

sources:
  - id: btcusd_coingecko
    kind: price
    asset: BTCUSD
    fetcher: coingecko
    cadence_sec: 180
    decision_usage: verified_required
    fallback_to_mock: false

  - id: ethusd_coingecko
    kind: price
    asset: ETHUSD
    fetcher: coingecko
    cadence_sec: 180
    decision_usage: verified_required
    fallback_to_mock: false

  - id: xauusd_yfinance
    kind: price
    asset: XAUUSD
    fetcher: yfinance
    cadence_sec: 180
    decision_usage: verified_required
    fallback_to_mock: false

  - id: xagusd_yfinance
    kind: price
    asset: XAGUSD
    fetcher: yfinance
    cadence_sec: 180
    decision_usage: verified_required
    fallback_to_mock: false

  - id: brent_yfinance
    kind: price
    asset: BRENT
    fetcher: yfinance
    cadence_sec: 180
    decision_usage: verified_required
    fallback_to_mock: false

  - id: dxy_fred
    kind: macro
    asset: DXY
    fetcher: fred
    cadence_sec: 3600
    decision_usage: verified_required
    fallback_to_mock: false

  - id: us10y_fred
    kind: macro
    asset: US10Y
    fetcher: fred
    cadence_sec: 3600
    decision_usage: verified_required
    fallback_to_mock: false

  - id: vix_yfinance
    kind: macro
    asset: VIX
    fetcher: yfinance
    cadence_sec: 180
    decision_usage: verified_required
    fallback_to_mock: false

  - id: sp500_yfinance
    kind: macro
    asset: SP500
    fetcher: yfinance
    cadence_sec: 180
    decision_usage: analytics_only
    fallback_to_mock: false

  - id: us02y_fred
    kind: macro
    asset: US02Y
    fetcher: fred
    cadence_sec: 3600
    decision_usage: verified_required
    fallback_to_mock: false

  - id: cpi_fred
    kind: macro
    asset: CPI
    fetcher: fred
    cadence_sec: 3600
    decision_usage: verified_required
    fallback_to_mock: false

  # ─── Rotasyon bacakları (P0) ─────────────────────────────────
  # Sermaye rotasyonu motorunun çapraz-oran/sınıf akışı bacakları. Karar
  # zincirine consensus "quantum" modülü üzerinden girer (rotation skoru).
  # simulation_only: rotation evidence'ı sağlar ama tek başına stratejik karar
  # vermez; veri yoksa rotation UNAVAILABLE + redistribute (mock yok).
  - id: tlt_yfinance
    kind: rotation
    asset: TLT
    fetcher: yfinance
    cadence_sec: 3600
    decision_usage: simulation_only
    fallback_to_mock: false

  - id: hyg_yfinance
    kind: rotation
    asset: HYG
    fetcher: yfinance
    cadence_sec: 3600
    decision_usage: simulation_only
    fallback_to_mock: false

  - id: lqd_yfinance
    kind: rotation
    asset: LQD
    fetcher: yfinance
    cadence_sec: 3600
    decision_usage: simulation_only
    fallback_to_mock: false

  # ─── Teknik bar sağlayıcıları ─────────────────────────────────
  # Kraken yalnızca BTC/ETH için herkese açık, salt-okunur birincil canlı
  # kaynaktır. CoinGecko, Kraken başarısız olduğunda ikincil kaynaktır.
  - id: btcusd_ohlcv_kraken
    kind: ohlcv
    asset: BTCUSD
    fetcher: kraken
    cadence_sec: 900
    decision_usage: verified_required
    fallback_to_mock: false

  - id: ethusd_ohlcv_kraken
    kind: ohlcv
    asset: ETHUSD
    fetcher: kraken
    cadence_sec: 900
    decision_usage: verified_required
    fallback_to_mock: false

  - id: btcusd_ohlcv_coingecko
    kind: ohlcv
    asset: BTCUSD
    fetcher: coingecko
    cadence_sec: 2400
    decision_usage: verified_required
    fallback_to_mock: false

  - id: ethusd_ohlcv_coingecko
    kind: ohlcv
    asset: ETHUSD
    fetcher: coingecko
    cadence_sec: 2400
    decision_usage: verified_required
    fallback_to_mock: false

  - id: ohlcv_yfinance
    kind: ohlcv
    asset: "trade universe"
    fetcher: yfinance
    cadence_sec: 900
    decision_usage: verified_required
    fallback_to_mock: false

  # Salt-okuma türev göstergeleri; tek başına işlem sinyali üretmez.
  - id: derivatives_binance
    kind: derivatives
    asset: "BTCUSD,ETHUSD"
    fetcher: binance
    cadence_sec: 300
    decision_usage: analytics_only
    fallback_to_mock: false

  - id: options_deribit
    kind: options
    asset: "BTCUSD,ETHUSD"
    fetcher: deribit
    cadence_sec: 300
    decision_usage: analytics_only
    fallback_to_mock: false

  - id: news_general_rss
    kind: news
    fetcher: rss
    cadence_sec: 60
    decision_usage: analytics_only
    feed_registry: packages/data/providers/news/rss.py:MARKET_FEEDS

  - id: news_geo_rss
    kind: news_geo
    fetcher: rss
    cadence_sec: 60
    decision_usage: analytics_only
    feed_registry: packages/data/providers/news/rss.py:GEO_FEEDS

# Runtime ile registry arasında sessiz kopma olmaması için makine-okunur
# envanter. Count değerleri testte provider modüllerinden doğrulanır.
runtime_inventory:
  news:
    market_rss:
      count: 23
      registry: packages/data/providers/news/rss.py:MARKET_FEEDS
    geo_rss:
      count: 12
      registry: packages/data/providers/news/rss.py:GEO_FEEDS
    discovery_topic_feeds:
      count: 8
      registry: config/discovery.yaml:news_discovery.extra_feeds
  providers:
    ohlcv: [ohlcv_kraken, ohlcv_coingecko, ohlcv_yfinance]
    derivatives: [derivatives_binance]
    options: [options_deribit]
