    kind: price
    asset: BTCUSD
    fetcher: yfinance
    cadence_sec: 180
    decision_usage: verified_required
    fallback_to_mock: false

  - id: ethusd_yfinance
    kind: price
    asset: ETHUSD
    fetcher: yfinance
    cadence_sec: 180
    decision_usage: verified_required
    fallback_to_mock: false

