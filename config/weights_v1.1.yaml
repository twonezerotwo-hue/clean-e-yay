version: "1.1.0"
created_at: "2026-06-20"
description: |
  v1.1 — Touche (TF-aware technical) ağırlığı +0.10..+0.15 artırıldı.
  v1.0'da TF-aware tek modül %25 ağırlıkla seyreltiliyordu; TF
  segmentasyonu fiili sinyal farkı üretemiyordu (4×5 hücrenin hepsi
  ~53.8 nötr bantta kilitleniyordu). Bu sürüm touche'ye gerçek söz
  hakkı veriyor — diğer modüller hâlâ TF-agnostic, ama touche'nin payı
  yeterince yüksek ki teknik bir oversold/overbought TF'de yön çevirsin.
  M5 (2026-07-02): ölü chart_pattern slotu (0.00) kaldırıldı — davranış aynı.

regimes:
  OFFENSIVE:
    touche: 0.45
    fundamental: 0.15
    news: 0.15
    sentinel: 0.10
    quantum: 0.15
  NEUTRAL:
    touche: 0.40
    fundamental: 0.20
    news: 0.15
    sentinel: 0.15
    quantum: 0.10
  DEFENSIVE:
    touche: 0.30
    fundamental: 0.20
    news: 0.15
    sentinel: 0.25
    quantum: 0.10
  CRISIS:
    touche: 0.20
    fundamental: 0.15
    news: 0.10
    sentinel: 0.45
    quantum: 0.10

constraints:
  min_module_floor: 0.02
  max_delta_per_module: 0.03
  max_total_drift: 0.10

# tf_weights — strategy-level TF priors. v1.0'dan değişmedi.
tf_weights:
  swing:    { d1: 0.50, h4: 0.35, h1: 0.15, m15: 0.00 }
  intraday: { d1: 0.15, h4: 0.35, h1: 0.35, m15: 0.15 }
  scalp:    { d1: 0.00, h4: 0.15, h1: 0.35, m15: 0.50 }
