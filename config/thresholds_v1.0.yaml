version: "1.0.0"
created_at: "2026-06-11"

consensus:
  # 2026-06-20: 60/40 → 55/45 (strong 70/30 → 65/35). Sebep: TF
  # segmentasyonu 4×5=20 hücre üretiyordu ama hepsi 50-55 bandında
  # kilitleniyordu; eşik geçilemiyor, sinyal yok. weights_v1.1'le
  # touche ağırlığı arttı, bu eşik bandıyla TF'ler yön çevirebilir.
  bullish_min: 55
  bearish_max: 45
  strong_bullish_min: 65
  strong_bearish_max: 35
  # Minimum kalibre-güven tabanı (p(win) ∈ [0,1]). Skor eşiği geçilse bile
  # kalibre güven bunun altındaysa pozisyon AÇILMAZ (hold). Düşük-güvenli
  # nötr sinyallerle pozisyon açılmasını engeller. Owner-tunable; 0 = kapalı.
  min_open_confidence: 0.20
  # 2026-07-02: AÇILDI (owner kararı). Haber modülü sembol-ilişkili skorlama:
  # yalnız headline.asset_impact[symbol] taşıyan VERIFIED başlıklar o sembolün
  # news skorunu oynatır (yön sembole özgü impact'ten; hawkish Fed → DXY +1).
  # Eskiden TÜM başlıkların global sentiment'i her sembole aynı giriyordu —
  # BTC haberi XAGUSD skorunu oynatıyordu. İlgili başlığı olmayan sembol
  # (örn. custom hisseler) nötr 50 alır. false → eski davranış birebir.
  news_symbol_filter: true
  # M3 — fundamental v2. false (DEFAULT) → v1 birebir: fundamental = ortalama(
  # Likidite, Kripto Momentum, Rotasyon) — BTC teknik skoru hem touche'ta hem
  # burada sayılıyor (çifte sayım, 2026-07-02 denetimi). true → v2: Kripto
  # Momentum hariç (saf makro: Likidite + Rotasyon). İki varyant her hücrede
  # `fundamental_v2_observe:v1=..:v2=..` warning satırıyla yan yana izlenir;
  # owner ayrışmayı görüp bu flag'i tarihli kararla açar.
  fundamental_v2: false

# M1 — haber sentiment sınıflandırıcı sürümü. false (DEFAULT) → v1 birebir
# (tam-kelime eşleşme; "Bitcoin rebounds…" gibi çekimli başlıklar neutral kalır).
# true → v2: çekim-eki normalizasyonu ("rebounds"/"surges"/"plunges" eşleşir)
# + ≥6 harfli kök-prefix ("escalat" → escalates/escalation). Her başlıkta v2
# okuması `sentiment_v2` alanına HER ZAMAN yazılır (salt-gözlem); owner
# regime-report'taki v1/v2 ayrışmasını izleyip bu flag'i tarihli kararla açar.
# Etki alanı: news modül skoru + asset_impact yönü + catalyst/surprise motoru.
news:
  sentiment_v2: false

# F2-3 — rejim katmanı veri dürüstlüğü. false (DEFAULT) → eski davranış birebir:
# eksik makro veri sabit default'la doldurulur (US10Y yoksa 4.3 varsayılır —
# 2026-07-02 denetiminde bu "sessiz sahte skor" Likidite katmanını 96.2'ye şişirip
# konsensüsü ~4 puan oynatıyordu). true → veri olmayan katman skor üretmez, DÜŞER
# (regime-report `dropped_layers`); fundamental/sentinel katmansız kalırsa consensus
# modülü de düşer ve ağırlığı redistribute edilir (quantum deseni; DATA_POLICY).
# Snapshot warnings'e `macro_data_missing` her durumda yazılır (M2, flag'siz gözlem).
regime:
  drop_unavailable_layers: false

# F4-1 — TF-bazlı Platt kalibrasyonu. false (DEFAULT) → global tek fit birebir
# (bayt-aynı). true → karar anında o TF'in KENDİ fit'i kullanılır (kaynak
# "fitted_tf"); TF'in örneği MIN_SAMPLES(10) altındaysa global fit'e düşer
# (sahte TF parametresi uydurulmaz). Şişme guardrail'i fitted_tf'e de uygulanır.
# Gözlem: GET /learning/calibration `per_timeframe` (TF başına a/b/samples/
# status) + learning worker log `tf_fitted=[..]`; owner TF örnek sayıları
# yeterince ayrışınca bu flag'i tarihli kararla açar.
calibration:
  tf_platt: false

# F4-2 — EV/Kelly p(win) kaynağı. enabled=false (DEFAULT) → EV kapısı ve Kelly
# sizing skor-türevi kalibre güveni kullanır (bayt-aynı); ampirik (tf|rejim)
# hit-rate her kararda SALT-GÖZLEM olarak damgalanır (cell.p_win_empirical /
# expected_value_empirical). true → yeterli örnekli hücrelerde EV+Kelly
# GERÇEKLEŞMİŞ isabet oranıyla hesaplanır (hücre yoksa kalibre güvene düşer —
# sahte p uydurulmaz). Hiyerarşi: tf|rejim → tf. Tabloyu learning worker yazar
# (data/runtime/empirical_pwin.json). min_samples: hücrenin sayılması için
# gereken kazanç+kayıp adedi (başabaş paydaya girmez, F1-2).
# F5-1 — blend_counterfactual: false (DEFAULT) → yalnız gerçek outcome'lar
# (bayt-aynı); counterfactual'lar tabloda AYRI kanalda gözlem olarak durur
# (cf_by_tf + /learning/missed-opportunities by_timeframe). true → gerçek
# kanıtı YETERSİZ TF'lerde son-çare fallback: gerçek+counterfactual sayımları
# harmanlanır (kaynak "tf_blend_cf"). Gerekçe: bloklanan TF gerçek outcome
# üretmez (geri-besleme kör noktası); counterfactual o TF'i ölçmeye devam eder.
empirical_pwin:
  enabled: false
  min_samples: 20
  blend_counterfactual: false

# F4-3 — Partial-TP + breakeven stop. enabled=false (DEFAULT) → davranış
# bayt-aynı; her pozisyonda SHADOW gözlemi yine işler: kâr ilk kez
# trigger_r×|entry−SL|'e değince damgalanır, sonrasında fiyat girişe dönerse
# breakeven senaryosu işaretlenir; TAM kapanışta hipotetik strateji PnL'i
# Trade.ptp_shadow_pnl_usd'ye yazılır. Owner GET /learning/partial-tp-shadow
# özetindeki shadow-vs-actual farkını izleyip bu flag'i tarihli kararla açar.
# true → tetikte close_fraction kadar kısmi kapat (PARTIAL_TP_EXIT) +
# breakeven=true ise kalan yarının SL'i girişe çekilir (yalnız SIKILAŞTIRIR).
# Not: eski ölü `paper_trading.partial_tp1_pct` anahtarı bu bölümle değiştirildi.
partial_tp:
  enabled: false
  trigger_r: 1.0
  close_fraction: 0.5
  breakeven: true

# M4 — sentinel v2: tek-gösterge VIX yerine çok-girdili stres kompoziti (0-100,
# yüksek = sakin / risk iştahı). enabled false (DEFAULT) → v1 birebir (yalnız
# VIX katmanı; CRISIS'te 0.45 ağırlığı tek sayı taşır — 2026-07-02 denetimi bunu
# kırılgan buldu). true → v2: VIX + realized-vol z-skoru + kripto squeeze proxy +
# options stres rejimi kompoziti. Girdiler snapshot'ta ZATEN hesaplanıyor (yeni ağ
# çağrısı yok); yalnız verified + status OK girdiler sayılır (DATA_POLICY), eksik
# girdinin ağırlığı kalanlara redistribute edilir (quantum deseni). İki varyant her
# hücrede `sentinel_v2_observe:v1=..:v2=..` warning satırıyla yan yana izlenir;
# owner ayrışmayı görüp bu flag'i tarihli kararla açar.
sentinel_v2:
  enabled: false
  weights: { vix: 0.5, volatility: 0.25, derivatives: 0.15, options: 0.10 }

# F5 — EV (beklenen değer) kapısı. Olasılık + ödül/risk BİRLİKTE pozitif değilse açma:
# EV = p(win)×RR − (1−p(win))×1 − cost_r (R-katı). RR timeframe_targets'tan. EV her
# zaman hesaplanır (decision.expected_value gözlem); enabled iken EV<min_ev → hold.
# Ayrı ekonomik filtre — RiskGate'i bypass etmez. DEFAULT KAPALI (önce shadow izle).
ev_gate:
  enabled: true
  min_ev: 0.0       # R-katı; <bu beklenen değerli trade açılmaz
  cost_r: 0.1       # round-trip maliyet (spread/fee) R cinsinden

# F5 — Kelly sizing. Boyutu ölçülen edge'e oransal CAP'ler: $ = fraction × f* × equity
# (f* = (p×RR−(1−p))/RR). Yalnız KÜÇÜLTÜR (no-AI-boost). DEFAULT KAPALI.
kelly_sizing:
  enabled: true
  fraction: 0.25    # fractional Kelly (¼) — tam Kelly çok agresif (varyans)

dqs:
  min_for_decision: 55
  limited_analysis_min: 40

# DATA_POLICY sert uygulaması (owner kontrollü). Varsayılan: KAPALI →
# mevcut davranış birebir korunur (stale TF consensus'ta ×0.70 nötre çekilir,
# bkz. packages/consensus/engine.py _degraded_direction_score).
# block_stale_ohlcv_for_trade=true olduğunda: karar timeframe'inin son barı TF
# stale eşiğini aşmışsa (bkz. packages/data/providers/technical STALE_AFTER_SEC)
# o (symbol, tf) için AÇILIŞ bloklanır — "eski veriyle trade açma" kuralı.
# Yalnızca decide_for_symbol açılış yolunu etkiler; dampening/dashboard değişmez.
data_policy:
  block_stale_ohlcv_for_trade: false

# Calibration inflation guardrail — Platt kalibrasyonunun ZAYIF ham sinyali
# aşırı güvene şişirmesini sınırlar (örn. raw 0.11 → fitted 0.55 → STRONG kademe →
# büyük pozisyon). enabled=false iken HİÇ çalışmaz (passthrough; mevcut davranış
# birebir). enabled=true iken: fitted - raw > max_inflation_delta ise fitted =
# raw + max_inflation_delta'ya kıstırılır, kaynak "fitted_capped" damgalanır.
# Yalnızca KISITLAR — fitted'i asla artırmaz. Her açılışta calibration_audit
# ledger'ı sıçramayı + faktörleri (score/dominant/regime/tier/size) kaydeder.
calibration_guardrail:
  # 2026-06-29: AÇILDI. Zayıf ham sinyalin (örn. raw 0.13) Platt ile STRONG
  # kademe eşiğine (0.45) şişip büyük pozisyon açmasını engeller; fitted - raw
  # bu deltayı aşarsa fitted = raw + max_inflation_delta'ya kıstırılır.
  enabled: true
  max_inflation_delta: 0.25

risk_gates:
  max_daily_loss_pct: 0.02      # equity'nin %2'si
  max_drawdown_pct: 0.08        # peak'ten %8
  correlation_threshold: 0.7
  correlation_window_days: 30
  correlation_min_overlap_days: 5    # bunun altında computed (PnL) rho kullanılmaz
  # F2-2 (2026-07-02) — fiyat-getirisi korelasyonu. false (DEFAULT) → aktif rho
  # zinciri eski davranışla birebir (trade-PnL computed → baseline → neutral);
  # fiyat-rho her girdide `rho_price`/`price_samples` SALT-GÖZLEM alanı olarak
  # yine hesaplanır (/risk/correlation matrisinde). true → gerçek 1d fiyat
  # getirisinden hesaplanan rho zincirin BAŞINA geçer (computed_price). Kaynak:
  # OHLCV disk cache (ağ çağrısı yok, yalnız verified barlar — DATA_POLICY).
  # Gerekçe: trade-PnL rho'su seyrek/gürültülü (iki sembolde aynı gün kapanmış
  # trade ister), baseline elle yazılmış sabit — fiyat serisi tek dürüst kaynak.
  # Owner gözlem sonrası tarihli kararla açar.
  correlation_price_returns: false
  correlation_price_min_overlap_days: 20   # bunun altında ortak günle fiyat-rho AKTİF olamaz (gözlemde görünür)
  max_cluster_pct: 0.30              # aynı risk cluster'ın toplam %equity tavanı
  vol_regime_zscore: 2.0
  # M6 (2026-07-02): ölü `position_cap_per_asset_pct` (%25) KALDIRILDI — hiçbir
  # kod yolu okumuyordu. Per-asset tavan zaten iki CANLI mekanizmayla sıkı:
  # paper_trading.max_position_usd (sizing'de enforce) + book_audit.
  # concentration_guard.max_symbol_pct (%5, çok daha sıkı).

# T0 — timeframe risk politikası (contract seed; T2'de decision/paper
# katmanı uygular). risk_multiplier yalnızca küçültür (≤1.0) —
# RiskGate/halt/DQS gate'lerini hiçbir şekilde etkilemez.
# paper_execution=false → o TF doğrudan paper trade AÇAMAZ (sadece bias).
timeframe_risk:
  "15m": { role: scout,        risk_multiplier: 0.25, paper_execution: true,  time_stop_hours: 6 }
  "1h":  { role: confirmation, risk_multiplier: 0.50, paper_execution: true,  time_stop_hours: 48 }
  "4h":  { role: tactical,     risk_multiplier: 1.00, paper_execution: true,  time_stop_hours: 168 }
  "1d":  { role: swing,        risk_multiplier: 1.00, paper_execution: true,  time_stop_hours: 672 }
  # 1w strategic = SADECE BIAS (paper_execution=false). Haftalık sinyalle
  # 2 haftalık pozisyon açmak paper sistemde yanlış; 1w yönü alt TF'leri
  # ölçeklemek için kullanılır (decide_matrix 1w_bias_conflict). Bu
  # deliberate invariant — değiştirme (test_timeframe_* korur).
  "1w":  { role: strategic,    risk_multiplier: 0.00, paper_execution: false, time_stop_hours: 0 }

# TF-duyarlı SL/TP geometrisi — açılış-anı stop/target mesafelerini timeframe'in
# gerçek volatilitesine (ATR) çapalar. enabled:false → mevcut compute_fixed_targets
# birebir korunur (geri dönüş anında, risksiz). Faz B'de ayrı onayla true'ya çekilir.
# ATR varsa: SL_mesafe = ATR × sl_atr_mult × tier.sl_mult, [sl_pct_floor, sl_pct_cap] kıstır
# ATR yoksa: paper_trading.sl_pct[symbol] × tf scale × tier.sl_mult (dürüst fallback)
# TP_mesafe = SL_mesafe × rr (her iki durumda).
# Not: 15m rr=1.5, trade_economics.min_rr (1.5) ile dahili tutarlı.
timeframe_targets:
  enabled: true
  "15m": { sl_atr_mult: 1.0, rr: 1.5, sl_pct_floor: 0.005, sl_pct_cap: 0.020 }
  "1h":  { sl_atr_mult: 1.2, rr: 1.8, sl_pct_floor: 0.010, sl_pct_cap: 0.035 }
  "4h":  { sl_atr_mult: 1.5, rr: 2.0, sl_pct_floor: 0.015, sl_pct_cap: 0.050 }
  "1d":  { sl_atr_mult: 1.5, rr: 2.5, sl_pct_floor: 0.020, sl_pct_cap: 0.080 }

# P0 — Olay riski (event risk) yalnızca KISITLAYICIDIR. Yaklaşan, doğrulanmış
# (verified) yüksek etkili takvim olayı varsa yeni pozisyon açılışını kısar;
# ASLA size artırmaz, ASLA RiskGate/DQS/KillSwitch/halt gate'lerini gevşetmez.
# RiskEngine'e ek kısıtlayıcı candidate olarak girer (max-priority seçilir),
# yani DQS KILL_SWITCH / halt her zaman event riskini ezer (bypass yok).
#   block_window_hours : critical/high olay bu pencere içindeyse → NO_POSITION_INCREASE
#   watch_window_hours : high bu pencerede VEYA medium block penceresinde → WATCH
#   high_importance    : "yüksek etkili" sayılan importance seviyeleri
event_risk:
  block_window_hours: 24
  watch_window_hours: 72
  high_importance: [high, critical]

# v2.7 D2 — Crypto Derivatives Intelligence. Funding rate / open interest /
# squeeze proxy YALNIZCA kripto sembolleri için ve YALNIZCA kısıtlayıcı
# (CAUTION / size-reduce / NO_POSITION_INCREASE) veya bağlam etkisi yapar;
# ASLA size artırmaz, ASLA RiskGate/DQS/KillSwitch/halt'ı bypass etmez.
# squeeze_proxy GERÇEK liquidation API'si DEĞİLDİR — açıkça "proxy" etiketlidir.
#   funding_crowded_long/short : |funding| bu eşikleri aşarsa kalabalık pozisyon
#   funding_extreme            : squeeze proxy'ye güçlü funding katkısı eşiği
#   oi_surge_pct               : OI artışı squeeze baskısı katkı referansı
#   squeeze_low/elevated/high  : squeeze_proxy (0..100) seviye eşikleri
#   weights                    : squeeze proxy bileşen ağırlıkları (toplam 1.0)
#   max_age_sec                : bunun üstü STALE → DEGRADED (karar dışı)
#   timeframe_weight           : 15m/1h reaksiyon için yüksek, 1d düşük, 1w yok
derivatives:
  funding_crowded_long: 0.0005
  funding_crowded_short: -0.0005
  funding_extreme: 0.0010
  oi_surge_pct: 0.05
  squeeze_low: 35
  squeeze_elevated: 55
  squeeze_high: 75
  weights: { funding: 0.35, oi_change: 0.30, momentum: 0.20, volatility: 0.15 }
  max_age_sec: 900
  timeframe_weight:
    "15m": 1.0
    "1h": 1.0
    "4h": 0.75
    "1d": 0.5
    "1w": 0.0

# v2.7 D4 — Realized Volatility / Volatility Regime Intelligence. Mevcut OHLCV
# cache'inden (ekstra ağ yok) log-getiri tabanlı annualize realized volatility,
# rejim ve squeeze/expansion/shock bağlamı üretilir. YALNIZCA kısıtlayıcı
# (CAUTION / size-reduce / NO_POSITION_INCREASE) veya bağlam; ASLA size artırmaz,
# ASLA RiskGate/DQS/KillSwitch/halt'ı bypass etmez.
#   windows         : rolling realized-vol pencereleri (bar sayısı)
#   zscore_lookback : rv_short z-skoru dağılımı için örnek penceresi (bar)
#   min_samples     : z-skoru dağılımı için minimum rv_short örneği (altı → DEGRADED)
#   regime_z        : z-skoru rejim eşikleri (low / elevated / extreme)
#   squeeze_ratio   : rv_short/rv_long bunun ALTI → squeeze (sıkışma)
#   expansion_ratio : rv_short/rv_long bunun ÜSTÜ → expansion (genişleme)
#   shock_ratio     : rv_short/rv_long bunun ÜSTÜ → shock
#   shock_sigma     : son bar |log-getiri| ≥ shock_sigma × stdev(medium) → shock
#   max_age_sec     : TF tazelik (üstü STALE → DEGRADED, dqs düşer)
#   timeframe_weight: 15m/1h shock daha etkili (tam), 1d/1w rejim bağlamı (düşük)
volatility:
  windows: { short: 10, medium: 20, long: 60 }
  zscore_lookback: 60
  min_samples: 20
  regime_z: { low: -1.0, elevated: 1.0, extreme: 2.0 }
  squeeze_ratio: 0.70
  expansion_ratio: 1.30
  shock_ratio: 2.00
  shock_sigma: 3.0
  max_age_sec:
    "15m": 1800
    "1h": 7200
    "4h": 28800
    "1d": 172800
    "1w": 864000
  timeframe_weight:
    "15m": 1.0
    "1h": 1.0
    "4h": 0.75
    "1d": 0.5
    "1w": 0.0

# v2.7 D3 — Options IV / Skew / Term Structure Intelligence (yalnızca BTC/ETH).
# Deribit (veya fixture) options chain'inden ATM IV, 25Δ skew proxy, put/call OI,
# term structure ve realized-vs-implied spread → options stress rejimi. YALNIZCA
# kısıtlayıcı (CAUTION / size-reduce / NO_POSITION_INCREASE) veya bağlam; ASLA
# size artırmaz, ASLA RiskGate/DQS/KillSwitch/halt'ı bypass etmez.
#   rich_vol_spread   : atm_iv − realized ≥ bunu → RICH_VOL (pahalı vol)
#   cheap_vol_spread  : atm_iv − realized ≤ bunu (negatif) → CHEAP_VOL (bağlam)
#   put_skew_stress   : 25Δ skew proxy ≤ bunu (negatif) → PUT_SKEW_STRESS
#   call_skew_euphoria: 25Δ skew proxy ≥ bunu → CALL_SKEW_EUPHORIA
#   term_stress_slope : (long − front) IV ≤ bunu (negatif) → TERM_STRESS
#   max_age_sec       : chain tazelik (üstü STALE → dqs düşer)
#   timeframe_weight  : options 4h/1d/1w bağlamı (tam); 15m/1h düşük ağırlık
options:
  rich_vol_spread: 0.10
  cheap_vol_spread: -0.05
  put_skew_stress: -0.03
  call_skew_euphoria: 0.03
  term_stress_slope: -0.02
  max_age_sec: 900
  timeframe_weight:
    "15m": 0.25
    "1h": 0.4
    "4h": 0.75
    "1d": 1.0
    "1w": 1.0

# G4 — trade PnL verisi yetersizken kullanılan deterministik korelasyon
# baseline'ı. Çiftler simetrik okunur; listede olmayan çift → neutral (rho=0,
# insufficient_correlation_data uyarısı, size adjustment yok).
correlation_baseline:
  BTCUSD:
    ETHUSD: 0.75
    QQQ: 0.60
  ETHUSD:
    QQQ: 0.55
  XAUUSD:
    XAGUSD: 0.80
    DXY: -0.65
  XAGUSD:
    DXY: -0.55

paper_trading:
  initial_equity_usd: 100000
  max_position_usd: 25000
  # Intra-batch yığılma koruması: decide_matrix tek pass'te aynı sembolün birden
  # çok TF'sini açabilir (XAGUSD 15m/1h/4h short); pass-başı snapshot'ı donduğu için
  # kardeşler birbirini görmez → correlation cluster cap ateşlenemiyor. true iken
  # pass içinde açılan kardeşler sentetik pozisyon olarak sonraki hücrelere beslenir
  # → cap (aynı sembol rho=1.0) onları görür.
  # 2026-06-29: AÇILDI (owner politika kararı). Eşik = mevcut max_cluster_pct (%30):
  # aynı sembolün tüm TF'lerinin tek-pass toplam exposure'ı, diğer korelasyonlu
  # pozisyonlarla birlikte equity'nin %30'unu aşamaz (XAGUSD-tarzı 15m/1h/4h yığını
  # artık cap'lenir). Risk-azaltıcı (yalnız küçültür/bloklar); fazla sıkarsa false ile
  # geri alınır.
  intra_batch_cluster_guard: true
  sl_pct:
    BTCUSD: 0.04
    ETHUSD: 0.05
    XAUUSD: 0.03
    XAGUSD: 0.04
  tp_rr_ratio: 2.0
  trailing_stop_enabled: true

# Strateji-farkında işlem şekillendirme (Faz 4) — her setup tipi (TREND/REVERSAL/
# RANGE/BREAKOUT/PULLBACK/SCALP) kendi risk profiliyle açılsın: TREND geniş trailing'le
# kazananı sürsün, REVERSAL yakın stopla (S/R belli), RANGE dar hedefle, SCALP hızlı
# gir-çık. Çarpanlar TABAN geometriye (TF-bazlı) uygulanır → birleşir. size_mult ≤ 1.0
# (no-boost invariant: yalnız küçültür). enabled:false → şekillendirme YOK (bayt-aynı);
# setup_type bilinmiyorsa da nötr (hepsi 1.0). Guardrail: tüm çarpanlar [0.5, 1.5].
strategy_shaping:
  enabled: false
  profiles:
    #                    stop_mult  tp_rr_mult  trail_mult  size_mult
    TREND:              { stop: 1.0,  tp_rr: 1.15, trail: 1.25, size: 1.0 }   # trendi sür: geniş trailing + yüksek TP
    BREAKOUT:           { stop: 1.0,  tp_rr: 1.15, trail: 1.10, size: 1.0 }   # teyitli hareket, koş
    REVERSAL_CONFIRMED: { stop: 0.85, tp_rr: 1.0,  trail: 1.0,  size: 1.0 }   # dönüş noktası belli → yakın stop
    REVERSAL_WATCH:     { stop: 0.85, tp_rr: 0.9,  trail: 0.85, size: 0.7 }   # onaysız → temkinli, küçük
    RANGE:              { stop: 0.85, tp_rr: 0.8,  trail: 0.8,  size: 0.7 }   # yatay → dar hedef, küçük
    PULLBACK:           { stop: 0.9,  tp_rr: 1.0,  trail: 1.0,  size: 1.0 }   # trende dönüş, kontrollü
    SCALP:              { stop: 0.75, tp_rr: 0.8,  trail: 0.75, size: 0.7 }   # hızlı gir-çık, çok sıkı

# Açık kitap yapısal denetimi (packages/learning/book_audit.py). Canlı açık
# pozisyon kitabını tarar; KAPANIŞ BEKLEMEDEN yapısal mantık hatalarını (aynı
# sembolde zıt yön, tek varlıkta yoğunlaşma, aynı sinyalin TF'lere kopyalanması,
# tek-yön kitap) kullanıcı-odaklı "ders" olarak Conscious paneline yüzeyler.
# mistake_memory yalnız KAPALI trade fingerprint'lerini öğrendiği için bu boşluğu
# kapatır. Observe-only — eşikler yalnız ders üretimini ayarlar.
book_audit:
  concentration_pct_of_book: 0.30   # tek sembol kitabın %30'unu aşarsa yoğunlaşma dersi
  one_way_pct: 0.80                 # tek yön kitabın %80'ini aşarsa tek-yön dersi
  stack_min_timeframes: 2           # aynı sembol+yön ≥2 TF → kopya yığını dersi
  # Aktif self-conflict guard: aynı sembolde zaten açık ZIT yöne yeni aday
  # açılışını engeller (BRENT short+long tarzı kendine-karşı pozisyonu önler).
  # 2026-06-30: AÇILDI (owner kararı). Yalnız KISITLAYICI — bu sistemde kasıtlı
  # aynı-sembol hedge yok, dolayısıyla meşru karşı-örneği yoktur; en güvenli
  # guard. Her kararda self_conflict_report gözlemlenir; yanlışsa false ile
  # anında geri alınır (flag-rollback). NOT: canlı tick_worker'a yansıması için
  # yeniden başlatma gerekir (AWS deploy worker'ları zaten restart eder).
  self_conflict_guard:
    enabled: true
  # Aktif concentration guard: aynı sembolde zaten açık AYNI yöne yeni leg eklenmesini
  # sınırlar (DODO 1h+4h gibi TEK sinyalin TF'lere kopyalanıp riski 2x'lemesi). book_
  # audit yalnız "kopya yığını dersi" üretiyordu (observe-only, stack_min_timeframes);
  # bu onu CANLI giriş kapısına terfi eder. G4 correlation cluster'ından FARKLI: G4
  # equity'nin %30'unda tetikler (tek sembol için çok gevşek — DODO 2 leg = equity'nin
  # %9'u, G4 hiç görmedi); bu guard tek-sembol yığınına sıkı sınır koyar. enabled default
  # FALSE (shadow-first; her kararda concentration_report gözlemlenir, davranış değişmez).
  # CP3 kasası (guard_safety) canlıda kötü bulup kill-override yazarsa enabled zorla False.
  # 2026-07-01: AÇILDI (owner kararı, Grup B). Yalnız KISITLAYICI — aynı-sinyalin
  # TF'lere kopyalanıp riski 2x'lemesini (DODO 1h+4h −692) engeller; meşru karşı-örneği
  # yok. CP3 kasası (guard_safety) izliyor; expectancy düşerse oto-kapatır. Yanlışsa
  # false ile anında geri alınır (flag-rollback). Canlı tick_worker restart gerekir
  # (AWS deploy zaten restart eder).
  concentration_guard:
    enabled: true
    max_same_dir_legs: 1    # aynı sembol+yönde zaten ≥ bu kadar açık leg varsa yeni aday bloklanır (yığın 2'de başlar; stack_min_timeframes ile hizalı)
    max_symbol_pct: 0.05    # aynı sembol+yön açık exposure equity'nin bu oranını aşarsa blokla (G4 %30 cluster'ından çok daha sıkı)

# Price sanity guard — cross-pair contamination + absurd-price protection.
# Phase 2 port from e-yay-codex paper_trading_service._is_price_sane.
price_sanity:
  max_jump_pct: 30.0          # reddet: |Δ| önceki sane fiyata göre > %30
  max_open_deviation_pct: 10.0  # OPEN-time: |Δ| sembolün kendi son OHLCV close'una göre > %10 → reddet
  bounds:                     # mutlak [lo, hi]; listede olmayan sembol → yalnız pozitiflik
    BTCUSD: [20000, 500000]
    XAUUSD: [1500, 7000]
    XAGUSD: [15, 150]
    BRENT: [30, 200]

# State anomaly guard — bozuk equity/realized/daily PnL → YENİ açılışı durdur
# (mevcut pozisyon yönetimi/kapanışı engellenmez). base = paper_trading.initial_equity_usd.
state_anomaly:
  equity_multiplier: 3.0      # |realized| veya equity > base*M → anomali
  daily_pnl_fraction: 0.5     # |daily_pnl| > base*F → anomali

learning:
  min_samples_for_signal: 3
  avoid_win_rate: 0.30
  boost_win_rate: 0.70
  boost_size_multiplier: 1.3
  retrain_every_n_closes: 5
  walk_forward_train_ratio: 0.7

# Historical Edge Engine (packages/learning/historical_edge.py) — fuzzy-similarity
# geçmiş setup performansı. mistake_memory.py'nin (exact fingerprint match) AYRI ve
# tamamlayıcısı; read-only, hiçbir karar zincirine bağlı değil. similarity_weights
# toplamı 1.0 olmalı; sample-count bandları similarity_similar_min eşiğine göre sayılır.
historical_edge:
  similarity_weights:
    symbol: 0.25
    timeframe: 0.20
    regime: 0.15
    direction: 0.15
    score_bucket: 0.15
    confluence: 0.05
    dominant_module: 0.05
  similarity_similar_min: 0.70
  similarity_strong_min: 0.85
  min_sample_observe_only: 20
  min_sample_usable: 50
  min_sample_strong: 100
  strong_negative_winrate_max: 0.45

# Elliott Wave Scenario Engine (packages/elliott/) — EVIDENCE only, read-only API
# (GET /technical/elliott/{asset_code}). Hiçbir karar zincirine bağlı değil. Fraktal
# pivot penceresi + fib projeksiyon oranları buradan okunur (kod içinde hardcode değil).
elliott:
  pivot_left: 3
  pivot_right: 3
  fib_projection: [0.618, 1.0, 1.618]

# Zone Engine (packages/zones/) — EVIDENCE only, read-only API
# (GET /technical/zones/{asset_code}). Hiçbir karar zincirine bağlı değil.
# Genel support/resistance zone kümeleme; supply/demand bu sürümün kapsamı
# DIŞINDA (bilinçli olarak eklenmedi — bkz. packages/zones/engine.py docstring).
zones:
  lookback_bars: 120
  min_bars: 20
  pivot_left: 3
  pivot_right: 3
  cluster_proximity_pct: 1.0

# Volume Validation Engine (packages/volume/) — EVIDENCE only, read-only API
# (GET /technical/volume/{asset_code}). Hiçbir karar zincirine bağlı değil.
volume_validation:
  lookback_bars: 20
  min_bars: 10
  climax_ratio: 2.0
  confirmation_ratio: 1.2
  weakening_ratio: 0.7

# VWAP / Anchored VWAP Engine (packages/vwap/) — EVIDENCE only, read-only API
# (GET /technical/vwap/{asset_code}). Hiçbir karar zincirine bağlı değil.
vwap:
  lookback_bars: 60
  min_bars: 10
  neutral_eps: 0.0015
  deviation_extreme_pct: 2.0
  cross_lookback_bars: 5

# Liquidity Sweep Engine (packages/liquidity/sweep.py) — EVIDENCE only,
# read-only API (GET /technical/liquidity-sweep/{asset_code}). Hiçbir karar
# zincirine bağlı değil. packages/liquidity/rotation.py'dan ayrı/bağımsız.
liquidity_sweep:
  lookback_bars: 40
  recent_bars: 5
  min_bars: 15

# Exhaustion Score (packages/scoring/exhaustion.py) — EVIDENCE only, yön
# skoru DEĞİLDİR (spec §17). Hiçbir karar zincirine bağlı değil.
exhaustion:
  min_bars: 20
  return_lookback_bars: 5
  rsi_extreme_high: 70.0
  rsi_extreme_low: 30.0
  return_extreme_pct: 5.0

# Location Score (packages/scoring/location.py) — EVIDENCE only (spec §18).
# Zone Engine + Fibonacci + VWAP + Liquidity Sweep birleşimi.
location_score:
  good_location_min: 70.0
  mid_range_min: 40.0

# Trigger Engine (packages/scoring/trigger.py) — EVIDENCE only (spec §22).
trigger_engine:
  min_bars: 3
  confirmed_min: 70.0
  pin_bar_wick_ratio: 2.0

# Agent Mode Control (packages/mode/) — spec §5/§40. Henüz HİÇBİR karar
# zincirine bağlı değil (yalnızca shadow gözlem kaydında okunur). Default'lar
# bilinçli olarak muhafazakâr: hiçbir profili/stratejiyi kısıtlamaz — bu
# config aktive edilene kadar davranış DEĞİŞMEZ.
agent_mode_control:
  enabled_trade_profiles: []   # boş = hepsi serbest (allowlist değil)
  disabled_trade_profiles: []
  focus_mode: null
  allow_counter_context_trades: true
  allow_reversal_trades: true
  allow_trend_follow_trades: true
  allow_range_trades: true
  allow_breakout_trades: true
  watch_disabled_profiles: true
  close_disabled_profile_positions: false
  close_requires_riskgate_pass: true

agent:
  personas: [analyst, risk_officer, macro_strategist]
  quorum_required: 2          # 3'ten en az 2 hemfikir
  groq_daily_token_budget: 1000000

# T-MTF — Multi-timeframe technical feature (per closed-candle TF). EVIDENCE only:
# TechnicalTimeframeResult üretir; ASLA trade açmaz, ASLA RiskGate/DQS/halt'ı
# bypass etmez ve TEK aggregate skor ÜRETMEZ (direction/strength ayrı eksen).
#   bias_cuts        : direction_score → BULLISH (>bull) / BEARISH (<bear) / NEUTRAL
#   adx_trend_min    : ADX ≥ bu → trend gerçek (trend-follow); altı → level/reversal ağırlığı
#   warmup_min_bars  : indikatör başına minimum bar; altı → INSUFFICIENT_HISTORY (fake yok)
#   volatility       : bb_width(%) eşikleri → SQUEEZE / EXPANSION rejimi
#   swing_pivot      : fraktal pivot pencereleri (key_levels + confluence)
#   stop_atr_mult/target_rr : key_levels stop/target referansı (yalnızca evidence)
technical:
  bias_cuts: { bull: 60, bear: 40 }
  adx_trend_min: 20
  warmup_min_bars: { rsi: 30, macd: 60, ema200: 220, atr: 30, adx: 40 }
  volatility:
    bb_squeeze_pct: 4.0
    bb_expansion_pct: 12.0
  swing_pivot: { left: 3, right: 3 }
  stop_atr_mult: 1.5
  target_rr: 2.0
  # Top-down location gate: momentum (RSI/MACD/EMA) yön tetiğidir; konum (fib/S-R),
  # formasyon ve hacim YALNIZCA güveni eğer. Asimetrik — uyum hafif teyit (×≤1.15),
  # çelişki ("dirence long / premium'dan alım") sert ceza (×≥0.60). Nötr momentumdan
  # asla yön ÜRETMEZ (DATA_POLICY). Ağırlıklar mevcut olan kanıt üzerinde normalize.
  direction_tilt:
    location: 0.60      # fib zone + swing confluence (neredeyim / ucuz mu)
    pattern: 0.25       # reversal + chart pattern bias
    volume: 0.15        # VWAP teyidi (yalnız intraday)
    confirm_gain: 0.15  # kanıt momentumla uyumluysa max +%15 güven
    penalty_gain: 0.40  # kanıt çelişiyorsa max −%40 güven

  # Faz 2 — chop guard (yön kalitesi). ADX düşükse (gerçek trend yok) momentum
  # yönünü nötre çeker → chop'ta üretilen zayıf/sahte yön sinyalleri sönümlenir.
  # enabled=false (varsayılan) → HİÇ etki yok, mevcut skor birebir. Açıkken:
  # trendde (adx≥adx_chop_floor) çarpan 1.0 (dokunmaz); chop'ta skor mesafesi
  # 50'ye doğru ×[chop_min_mult..1.0] kısılır. Yön ASLA çevrilmez, yalnız sönümler.
  # 2026-06-29: CANLIYA ALINDI (owner). Risk-azaltıcı (yalnız sönümler); fazla
  # temkinli olursa chop_guard_multiplier loglarından görülür, enabled:false ile
  # anında geri alınır. Öğrenme katmanı bunu OTOMATİK izlemez → manuel takip.
  trend_quality:
    enabled: true
    adx_chop_floor: 20.0
    chop_min_mult: 0.5

  # Faz 3a — exhaustion guard. Momentum, tükenmenin AYNI yönüne (climax) kovalıyorsa
  # sönümler: exh_score≥exh_high (upside tükenmesi) iken long, ≤exh_low (downside
  # tükenmesi) iken short kovalaması 50'ye doğru kısılır. Momentum ters yöndeyse
  # (reversal'ı sürüyorsa) DOKUNMAZ; yön ASLA çevrilmez, size ASLA artmaz.
  # enabled=false → etki yok; çarpan yine de gözlem (shadow) loglanır.
  # 2026-06-29: CANLIYA ALINDI (owner). Exhaustion artık volume climax + liquidity
  # sweep ile besleniyor (RSI+getiri'ye ek climax kanıtı). Risk-azaltıcı (yalnız
  # sönümler, yön çevirmez); fazla temkinli olursa exhaustion_guard_multiplier'dan
  # görülür, enabled:false ile anında geri alınır. Öğrenme katmanı izlemez → manuel.
  exhaustion_guard:
    enabled: true
    exh_high: 70.0
    exh_low: 30.0
    exh_min_mult: 0.5

  # Faz 3b — reversion (mean-reversion): momentum UÇTA tükenmiş + reversal teyidi
  # TERS yönü işaret ediyorsa touche yönünü ÇEVİRİR (oversold+bullish reversal →
  # LONG; overbought+bearish reversal → SHORT). Senin baştan beri aradığın "skor çok
  # düşünce fiyat dönebilir → long" mantığı. Yalnız reversal.bias teyit ederse (uç
  # exhaustion tek başına yetmez). RİSK-YARATIR (counter-trend) → DEFAULT KAPALI;
  # enabled OFF iken reversion_score gözlem (shadow) loglanır. Not: touche bir modül,
  # consensus ağırlığında seyrelir → magnitude güçlü (diğer modüller sert karşı
  # çıkmadıkça geçer); canlıya almadan önce shadow'da reversion_score izlenmeli ve
  # ROADMAP'e göre ilk aşama manual_ready (oto-açma değil) düşünülmeli.
  reversion:
    enabled: true
    exh_rev_low: 20.0
    exh_rev_high: 80.0
    rev_magnitude: 25.0

# T2 — AgentDecision (deterministic). ConsensusSnapshot + RiskGate aksiyonu →
# tek yüksek-seviye aksiyon + entry_timeframe. EVIDENCE→aksiyon köprüsü; trade
# AÇMAZ (paper open matrix/RiskGate işi). Kurallar: RiskGate her zaman final
# (risk_gate_required=true); ÜST TF yalnızca KÜÇÜLTÜR (asla scale-up); 1w giriş
# üretmez (yalnız bias); countertrend asla otomatik full giriş.
#   strength_min        : consensus strength_score < bu → SCOUT yerine CONFIRMATION/WATCH
#   scout_alignment_min : alignment_score ≥ bu + confirmed → SCOUT_ALLOWED
#   countertrend_size_cap: countertrend ek size kısıtı (≤1.0, yalnız küçültür)
decision:
  strength_min: 40
  scout_alignment_min: 60
  countertrend_size_cap: 0.5

# Step 6 — Per-trade ekonomi kapısı (cost + R:R). RiskGate'in parçası; YALNIZCA
# kısıtlayıcı: asla giriş üretmez, asla size artırmaz. Önerilen girişin maliyet
# sonrası net edge'i veya risk:reward'ı yetersizse girişi BLOCK eder.
#   costs            : round-trip maliyet bileşenleri (bps).
#                      round_trip = 2×taker_fee + spread + slippage
#   min_net_edge_bps : reward_bps − round_trip_cost_bps bunun altındaysa giriş bloklanır
#   min_rr           : reward:risk bunun altındaysa giriş bloklanır
# TF size cap zaten `timeframe_risk.risk_multiplier` (≤1.0) ile gelir; burada tekrar tanımlanmaz.
trade_economics:
  costs: { taker_fee_bps: 10, est_spread_bps: 2, est_slippage_bps: 3 }
  min_net_edge_bps: 20
  min_rr: 1.5

# Step 9 — controlled activation. The NEW agent pipeline (agent_pipeline) runs in
# OBSERVATION mode alongside the live decide_matrix engine: each tick its decision is
# logged next to the live decision for comparison, but affect_decision:false means it
# NEVER mutates paper. Owner watches the shadow log, then flips affect_decision:true
# (Phase B) to let it influence — still RiskGate-final, manual_ready_only, scale-down.
#   enabled         : run the shadow pipeline each tick (observe-only side effect: a log line)
#   affect_decision : false → pure observation; true (Phase B) → shadow may route entries
#                     to manual_ready (never auto-open). Until Phase B is wired, true is a no-op.
#   manual_ready_only: when activated, shadow entries ONLY queue to manual_ready (never attempt_open)
shadow:
  enabled: true
  affect_decision: false
  manual_ready_only: true

# Faz 7 — Conflict Resolver'ın kontrollü aktivasyonu (spec v2.3 §28).
# `shadow.affect_decision`'dan TAMAMEN BAĞIMSIZ, ayrı bir aktivasyon kapısı.
# enabled=false (varsayılan) → packages/decision/conflict_resolver_activation.py
# her çağrıda boş liste döner, manual_ready'e HİÇBİR ŞEY eklenmez. Owner'ın
# açık onayı (bu config'i elle true yapması) olmadan davranış DEĞİŞMEZ.
conflict_resolver_activation:
  enabled: false

# Missed Opportunity motoru (learning yakıtı; spec v2.3). Açılmayan valid
# setup'ları (conflict_final_action=CANDIDATE_OPEN ama canlı açmadı) TTL boyunca
# izler: fiyat önce TP'ye mi (missed_win) SL'e mi (avoided_loss) değdi?
# PAPER_SAFE — paper'a ASLA dokunmaz, yalnızca shadow kaydı + cached barlardan
# ölçer. enabled=false (varsayılan) → inert. Gözlem amaçlı; açmak risksiz, Faz 4
# (conflict-gate genişletme) kararına veri toplar. Owner true yapınca toplanır.
missed_opportunity:
  # 2026-06-29: AÇILDI. INTRADAY/TACTICAL conflict_gate HARD'a alındığı için
  # bloklanan NO_TRADE/WATCH setup'larının gerçekte TP'ye mi (missed_win) SL'e mi
  # (avoided_loss) gideceğini ölçer — fazla-bloklama olup olmadığını izler.
  # PAPER_SAFE: paper'a dokunmaz, yalnızca cached barlardan ölçer.
  enabled: true
  min_rr: 1.0
  ttl_hours: { "15m": 6, "1h": 24, "4h": 72, "1d": 240, "1w": 0 }

# Faz 8 — Conflict Gate (spec v2.3 §28 devamı): eski decide_matrix önerisini
# yeni Conflict Resolver'ın verdict'iyle, trade_profile bazlı KADEMELİ sıkılıkla
# süzer (conflict_resolver_activation'dan FARKLI — bkz. packages/decision/conflict_gate.py
# docstring). enabled=false (varsayılan) → her zaman fail-open, eski sistemin
# açılış davranışı DEĞİŞMEZ. Owner'ın açık onayı olmadan etkisizdir.
# 2026-06-26: POSITION pilotu başlatıldı (owner onayı, ARCHITECTURE.md §7.5).
# HARD_MANUAL hiçbir zaman otomatik açmaz — yalnızca manual_ready'e kuyruklar,
# owner onaylamadan paper'a hiçbir şey girmez. YAML'da quote ZORUNLU, bare
# OFF/ON YAML 1.1'de boolean'a parse olur (bkz. openapi.yaml'daki aynı hata).
# 2026-06-29: INTRADAY (15m/1h) + TACTICAL (4h) HARD'a alındı (owner onayı). Sebep:
# eski engine score<=45'te zayıf/geçersiz setup'lara short açıyordu; HARD'da
# resolver NO_TRADE/WATCH/BLOCKED derse paper açılışı BLOKLANIR, yalnız
# CANDIDATE_OPEN açılır (gerçek tetiklenmiş + geçerli RR/size). Fazla-bloklama
# riski missed_opportunity (yukarıda AÇIK) ile izleniyor. SCALP/SWING henüz OFF.
conflict_gate:
  enabled: true
  profile_modes:
    SCALP: "OFF"
    INTRADAY: "HARD"
    TACTICAL: "HARD"
    SWING: "OFF"
    POSITION: "HARD_MANUAL"
