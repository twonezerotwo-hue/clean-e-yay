version: "1.0.0"
created_at: "2026-06-11"

consensus:
  bullish_min: 60
  bearish_max: 40
  strong_bullish_min: 70
  strong_bearish_max: 30

dqs:
  min_for_decision: 55
  limited_analysis_min: 40

risk_gates:
  max_daily_loss_pct: 0.02      # equity'nin %2'si
  max_drawdown_pct: 0.08        # peak'ten %8
  correlation_threshold: 0.7
  correlation_window_days: 30
  correlation_min_overlap_days: 5    # bunun altında computed rho kullanılmaz
  max_cluster_pct: 0.30              # aynı risk cluster'ın toplam %equity tavanı
  vol_regime_zscore: 2.0
  position_cap_per_asset_pct: 0.25   # equity'nin %25'i

# T0 — timeframe risk politikası (contract seed; T2'de decision/paper
# katmanı uygular). risk_multiplier yalnızca küçültür (≤1.0) —
# RiskGate/halt/DQS gate'lerini hiçbir şekilde etkilemez.
# paper_execution=false → o TF doğrudan paper trade AÇAMAZ (sadece bias).
timeframe_risk:
  "15m": { role: scout,        risk_multiplier: 0.25, paper_execution: true,  time_stop_hours: 6 }
  "1h":  { role: confirmation, risk_multiplier: 0.50, paper_execution: true,  time_stop_hours: 48 }
  "4h":  { role: tactical,     risk_multiplier: 1.00, paper_execution: true,  time_stop_hours: 168 }
  "1d":  { role: swing,        risk_multiplier: 1.00, paper_execution: true,  time_stop_hours: 672 }
  "1w":  { role: strategic,    risk_multiplier: 0.00, paper_execution: false, time_stop_hours: 0 }

# P0 — Olay riski (event risk) yalnızca KISITLAYICIDIR. Yaklaşan, doğrulanmış
# (verified) yüksek etkili takvim olayı varsa yeni pozisyon açılışını kısar;
# ASLA size artırmaz, ASLA RiskGate/DQS/KillSwitch/halt gate'lerini gevşetmez.
# RiskEngine'e ek kısıtlayıcı candidate olarak girer (max-priority seçilir),
# yani DQS KILL_SWITCH / halt her zaman event riskini ezer (bypass yok).
#   block_window_hours : critical/high olay bu pencere içindeyse → NO_POSITION_INCREASE
#   watch_window_hours : high bu pencerede VEYA medium block penceresinde → WATCH
#   high_importance    : "yüksek etkili" sayılan importance seviyeleri
event_risk:
  block_window_hours: 24
  watch_window_hours: 72
  high_importance: [high, critical]

# v2.7 D2 — Crypto Derivatives Intelligence. Funding rate / open interest /
# squeeze proxy YALNIZCA kripto sembolleri için ve YALNIZCA kısıtlayıcı
# (CAUTION / size-reduce / NO_POSITION_INCREASE) veya bağlam etkisi yapar;
# ASLA size artırmaz, ASLA RiskGate/DQS/KillSwitch/halt'ı bypass etmez.
# squeeze_proxy GERÇEK liquidation API'si DEĞİLDİR — açıkça "proxy" etiketlidir.
#   funding_crowded_long/short : |funding| bu eşikleri aşarsa kalabalık pozisyon
#   funding_extreme            : squeeze proxy'ye güçlü funding katkısı eşiği
#   oi_surge_pct               : OI artışı squeeze baskısı katkı referansı
#   squeeze_low/elevated/high  : squeeze_proxy (0..100) seviye eşikleri
#   weights                    : squeeze proxy bileşen ağırlıkları (toplam 1.0)
#   max_age_sec                : bunun üstü STALE → DEGRADED (karar dışı)
#   timeframe_weight           : 15m/1h reaksiyon için yüksek, 1d düşük, 1w yok
derivatives:
  funding_crowded_long: 0.0005
  funding_crowded_short: -0.0005
  funding_extreme: 0.0010
  oi_surge_pct: 0.05
  squeeze_low: 35
  squeeze_elevated: 55
  squeeze_high: 75
  weights: { funding: 0.35, oi_change: 0.30, momentum: 0.20, volatility: 0.15 }
  max_age_sec: 900
  timeframe_weight:
    "15m": 1.0
    "1h": 1.0
    "4h": 0.75
    "1d": 0.5
    "1w": 0.0

# G4 — trade PnL verisi yetersizken kullanılan deterministik korelasyon
# baseline'ı. Çiftler simetrik okunur; listede olmayan çift → neutral (rho=0,
# insufficient_correlation_data uyarısı, size adjustment yok).
correlation_baseline:
  BTCUSD:
    ETHUSD: 0.75
    QQQ: 0.60
  ETHUSD:
    QQQ: 0.55
  XAUUSD:
    XAGUSD: 0.80
    DXY: -0.65
  XAGUSD:
    DXY: -0.55

paper_trading:
  initial_equity_usd: 100000
  max_position_usd: 25000
  sl_pct:
    BTCUSD: 0.04
    ETHUSD: 0.05
    XAUUSD: 0.03
    XAGUSD: 0.04
  tp_rr_ratio: 2.0
  trailing_stop_enabled: true
  partial_tp1_pct: 0.5

learning:
  min_samples_for_signal: 3
  avoid_win_rate: 0.30
  boost_win_rate: 0.70
  boost_size_multiplier: 1.3
  retrain_every_n_closes: 5
  walk_forward_train_ratio: 0.7

agent:
  personas: [analyst, risk_officer, macro_strategist]
  quorum_required: 2          # 3'ten en az 2 hemfikir
  groq_daily_token_budget: 1000000
